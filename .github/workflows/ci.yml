name: CI

# 一个工作流，按变更路径决定跑什么：
#   service/**  → Go 检查，push 时再构建并发布 pre-release
#   manager/**  → Flutter 检查，push 时再出 arm64 APK
#   scripts/**  → 只跑 Go 检查
#   docs / *.md → 整个工作流跳过
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      service: ${{ steps.filter.outputs.service }}
      manager: ${{ steps.filter.outputs.manager }}
      scripts: ${{ steps.filter.outputs.scripts }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            changed="$(printf 'service/\nmanager/\nscripts/\n.github/workflows/\n')"
          else
            if [ "$EVENT_NAME" = "pull_request" ]; then
              base="$PR_BASE"
            else
              base="$BEFORE"
            fi
            if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$base^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "$base" HEAD)"
            else
              # 首次推送/重写历史时没有 before，退回只看最后一个提交。
              changed="$(git show --pretty=format: --name-only HEAD)"
            fi
          fi
          has() { printf '%s\n' "$changed" | grep -qE "$1" && echo true || echo false; }
          service="$(has '^service/')"
          manager="$(has '^manager/')"
          scripts="$(has '^scripts/')"
          workflow="$(has '^\.github/workflows/')"
          echo "service=$service" >> "$GITHUB_OUTPUT"
          echo "manager=$manager" >> "$GITHUB_OUTPUT"
          echo "scripts=$scripts" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
          echo "service=$service manager=$manager scripts=$scripts workflow=$workflow"

  service-check:
    needs: changes
    if: needs.changes.outputs.service == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum
      - name: Protocol drift check
        run: bash scripts/check-protocol.sh
      - name: Vet
        working-directory: service
        run: go vet ./...
      - name: Test
        working-directory: service
        run: go test -race ./...

  service-release:
    needs: [changes, service-check]
    if: github.event_name != 'pull_request' && (needs.changes.outputs.service == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum
      - name: Build
        id: build
        working-directory: service
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=7 HEAD)"
          version="v1.0.0-Alpha-$short"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p ../dist
          ldflags="-s -w -X main.version=$version"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o ../dist/LianT-linux-amd64 ./cmd/liant
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$ldflags" -o ../dist/LianT-linux-arm64 ./cmd/liant
          cd ../dist
          sha256sum * > SHA256SUMS.txt
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: LianT-service
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.build.outputs.version }}
          name: LianT ${{ steps.build.outputs.version }}
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: true

  android:
    needs: [changes]
    if: github.event_name != 'pull_request' && (needs.changes.outputs.manager == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('manager/**/*.gradle.kts', 'manager/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure release signing
        working-directory: manager
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties
            echo "release signing configured"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 未配置，使用 debug 签名（仅测试包）"
          fi

      - name: Build APK
        id: apk
        working-directory: manager
        run: |
          set -euo pipefail
          bash gradlew :app:assembleRelease --no-daemon --stacktrace
          code="$(awk -F'= ' '/^val liantVersionCode/{print $2; exit}' app/build.gradle.kts)"
          apk="/tmp/LianT-android-arm64-${code}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          ls -lh "$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"

      - name: Kotlin 单元测试
        working-directory: manager
        # P-256 与 openssl 向量的互操作（认证能不能过就靠它）。
        run: bash gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-android-arm64
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish Manager release
        working-directory: manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^val liantVersionName/{print $2; exit}' app/build.gradle.kts)"
          code="${{ steps.apk.outputs.code }}"
          tag="manager-v${version}-${code}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          gh release create "$tag" \
            --title "LianT Manager $version ($code) (test)" \
            --notes "Manager $version，versionCode $code（测试版，纯 Kotlin/Compose）" \
            --prerelease \
            "${{ steps.apk.outputs.apk }}"
