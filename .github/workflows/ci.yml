name: CI

# 质量门禁：服务端 go vet / go test -race / 协议对照，客户端 analyze / test。
# 产物只由 Service 与 Android 两个工作流负责。
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum

      - name: Protocol drift check
        run: bash scripts/check-protocol.sh

      - name: Vet
        working-directory: service
        run: go vet ./...

      - name: Test
        working-directory: service
        run: go test -race ./...

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Pub get
        working-directory: manager
        run: flutter pub get

      - name: Analyze
        working-directory: manager
        run: flutter analyze

      - name: Test
        working-directory: manager
        run: flutter test
