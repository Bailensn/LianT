name: CI

# 只做验证：协议对照、vet、race 测试。产物由 Service binaries 与 Flutter 两个工作流负责。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum

      - name: Protocol drift check
        run: bash scripts/check-protocol.sh

      - name: Vet
        working-directory: service
        run: go vet ./...

      - name: Test
        working-directory: service
        run: go test -race ./...
