name: CI

# 一个工作流，按变更路径决定跑什么：
#   service/**  → Go 检查，push 时再构建并发布 pre-release
#   manager/**  → Flutter 检查，push 时再出三个 APK
#   scripts/**  → 只跑 Go 检查
#   docs / *.md → 整个工作流跳过
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      service: ${{ steps.filter.outputs.service }}
      manager: ${{ steps.filter.outputs.manager }}
      scripts: ${{ steps.filter.outputs.scripts }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            changed="service/ manager/ scripts/ .github/workflows/"
          else
            if [ "$EVENT_NAME" = "pull_request" ]; then
              base="$PR_BASE"
            else
              base="$BEFORE"
            fi
            if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$base^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "$base" HEAD)"
            else
              # 首次推送/重写历史时没有 before，退回只看最后一个提交。
              changed="$(git show --pretty=format: --name-only HEAD)"
            fi
          fi
          has() { printf '%s\n' "$changed" | grep -qE "$1" && echo true || echo false; }
          service="$(has '^service/')"
          manager="$(has '^manager/')"
          scripts="$(has '^scripts/')"
          workflow="$(has '^\.github/workflows/')"
          echo "service=$service" >> "$GITHUB_OUTPUT"
          echo "manager=$manager" >> "$GITHUB_OUTPUT"
          echo "scripts=$scripts" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
          echo "service=$service manager=$manager scripts=$scripts workflow=$workflow"

  service-check:
    needs: changes
    if: needs.changes.outputs.service == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum
      - name: Protocol drift check
        run: bash scripts/check-protocol.sh
      - name: Vet
        working-directory: service
        run: go vet ./...
      - name: Test
        working-directory: service
        run: go test -race ./...

  client-check:
    needs: changes
    if: needs.changes.outputs.manager == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache Flutter SDK
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/flutter-3.24.5
          key: flutter-3.24.5-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            flutter-3.24.5-${{ runner.os }}-
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: false
          cache-path: ${{ runner.tool_cache }}/flutter-3.24.5
      - name: Cache pub
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('manager/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Pub get
        working-directory: manager
        run: flutter pub get
      - name: Analyze
        working-directory: manager
        run: flutter analyze
      - name: Test
        working-directory: manager
        run: flutter test

  service-release:
    needs: [changes, service-check]
    if: github.event_name != 'pull_request' && (needs.changes.outputs.service == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum
      - name: Build
        id: build
        working-directory: service
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=7 HEAD)"
          version="v1.0.0-Alpha-$short"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p ../dist
          ldflags="-s -w -X main.version=$version"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o ../dist/LianT-linux-amd64 ./cmd/liant
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$ldflags" -o ../dist/LianT-linux-arm64 ./cmd/liant
          cd ../dist
          sha256sum * > SHA256SUMS.txt
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: LianT-service
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.build.outputs.version }}
          name: LianT ${{ steps.build.outputs.version }}
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: true

  android:
    needs: [changes, client-check]
    if: github.event_name != 'pull_request' && (needs.changes.outputs.manager == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Cache Flutter SDK
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/flutter-3.24.5
          key: flutter-3.24.5-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            flutter-3.24.5-${{ runner.os }}-
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: false
          cache-path: ${{ runner.tool_cache }}/flutter-3.24.5
      - name: Cache pub
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('manager/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Pub get
        working-directory: manager
        run: flutter pub get
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('manager/android/**/*.gradle', 'manager/android/**/*.gradle.kts', 'manager/android/gradle/wrapper/gradle-wrapper.properties', 'manager/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build APKs
        working-directory: manager
        run: |
          set -euo pipefail
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/LianT-universal.apk
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /tmp/LianT-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk /tmp/LianT-x86_64.apk
          ls -lh /tmp/LianT-*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: LianT-android-arm64
          path: /tmp/LianT-arm64.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: LianT-android-x86_64
          path: /tmp/LianT-x86_64.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: LianT-android-universal
          path: /tmp/LianT-universal.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish Manager release
        working-directory: manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(awk '/^version:/{print $2; exit}' pubspec.yaml | cut -d+ -f1)"
          tag="manager-v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          args=(release create "$tag" --title "LianT Manager $version" --notes "Manager $version")
          case "$version" in
            *-*) args+=(--prerelease) ;;
          esac
          gh "${args[@]}" /tmp/LianT-universal.apk /tmp/LianT-arm64.apk /tmp/LianT-x86_64.apk
