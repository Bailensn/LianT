name: Build Manager Desktop (Gio)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
      linux_amd64:
        description: Linux amd64
        required: false
        type: boolean
        default: false
      linux_arm64:
        description: Linux arm64
        required: false
        type: boolean
        default: false
      windows_amd64:
        description: Windows amd64
        required: false
        type: boolean
        default: false
      darwin_amd64:
        description: macOS Intel amd64
        required: false
        type: boolean
        default: false
      darwin_arm64:
        description: macOS Apple Silicon arm64
        required: false
        type: boolean
        default: false
defaults:
  run:
    working-directory: manager/desktop
jobs:
  build:
    name: Build Gio Desktop
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: windows-amd64
            goos: windows
            goarch: amd64
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
    if: |
      (matrix.target == 'linux-amd64' && inputs.linux_amd64) ||
      (matrix.target == 'linux-arm64' && inputs.linux_arm64) ||
      (matrix.target == 'windows-amd64' && inputs.windows_amd64) ||
      (matrix.target == 'darwin-amd64' && inputs.darwin_amd64) ||
      (matrix.target == 'darwin-arm64' && inputs.darwin_arm64)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: manager/desktop/go.sum
      - name: Download modules
        run: go mod download
      - name: Build
        shell: bash
        run: |
          mkdir -p output
          export CGO_ENABLED=0
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          if [ "${{ inputs.mode }}" = "release" ]; then
            FLAGS="-ldflags=-s -w -trimpath"
          else
            FLAGS=""
          fi
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          go build \
            $FLAGS \
            -o output/manager-desktop-${{ matrix.target }}${EXT} \
            .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: manager-desktop-${{ matrix.target }}
          path: manager/desktop/output/*