name: Build Manager Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version'
        required: true
        default: ''
      windows:
        type: boolean
        default: false
      linux_arm64:
        type: boolean
        default: false
      linux_amd64:
        type: boolean
        default: false
      darwin_arm64:
        type: boolean
        default: false

env:
  VERSION: ${{ inputs.version }}
  GO_VERSION: '1.26.5'
  PY_VERSION: '3.12.14'
  PBS_TAG: '20260814'
  PBS_BASE: 'https://github.com/astral-sh/python-build-standalone/releases/download/20260814'

jobs:
  # ===================================================================
  # Windows amd64 -> Go Launcher + Client 源码 -> Inno Setup
  # ===================================================================
  windows-amd64:
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Go Launcher
        shell: pwsh
        env:
          RUNTIME_URL: ${{ env.PBS_BASE }}/cpython-${{ env.PY_VERSION }}+${{ env.PBS_TAG }}-x86_64-pc-windows-msvc-install_only.tar.gz
        run: |
          $ws = "$env:GITHUB_WORKSPACE"
          Set-Location "$ws\manager\desktop\launcher"
          New-Item -ItemType Directory -Force "$ws\dist\launcher" | Out-Null
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${{ env.VERSION }} -X main.defaultRuntimeURL=${{ env.RUNTIME_URL }}" -o "$ws\dist\launcher\LianT.exe" ./cmd

      - name: Stage client source
        shell: bash
        run: |
          mkdir -p client
          cp -r manager/desktop/client/src client/src
          cp -r manager/desktop/client/qml client/qml
          cp manager/desktop/client/requirements.txt client/requirements.txt

      - name: Inject version into Inno script
        shell: pwsh
        run: |
          cd manager/desktop/installer/windows
          (Get-Content LianT.iss) -replace '^#define MyAppVersion ".*"', '#define MyAppVersion "${{ env.VERSION }}"' | Set-Content -Encoding ASCII LianT.iss

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Fetch Simplified Chinese
        shell: pwsh
        run: |
          $dst = "manager\desktop\installer\windows\ChineseSimplified.isl"
          $url = "https://raw.githubusercontent.com/jrsoftware/issrc/refs/heads/main/Files/Languages/ChineseSimplified.isl"
          $ok = $false
          foreach ($i in 1..5) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $dst -ErrorAction Stop
              if (Test-Path $dst) { $ok = $true; break }
            } catch {
              Write-Host "attempt $i failed: $_"
              Start-Sleep -Seconds ($i * 2)
            }
          }
          if (-not $ok) { throw "Failed to download ChineseSimplified.isl" }
          Write-Host "Installed $dst ($((Get-Item $dst).Length) bytes)"

      - name: Build installer with ISCC
        shell: pwsh
        run: |
          cd manager/desktop/installer/windows
          $iscc = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.Source LianT.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exit code $LASTEXITCODE" }

      - name: Rename setup artifact
        shell: pwsh
        run: |
          $setup = Get-ChildItem "manager/desktop/installer/windows/Output" -Filter "LianTSetup*.exe" | Select-Object -First 1
          if ($null -eq $setup) { throw "setup exe not found" }
          Move-Item -Force $setup.FullName "LianT-v${{ env.VERSION }}-Windows-amd64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-Windows-amd64
          path: LianT-v${{ env.VERSION }}-Windows-amd64.exe

  # ===================================================================
  # macOS arm64 -> LianT.app + dmg
  # ===================================================================
  darwin-arm64:
    if: ${{ inputs.darwin_arm64 }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Go Launcher
        env:
          RUNTIME_URL: ${{ env.PBS_BASE }}/cpython-${{ env.PY_VERSION }}+${{ env.PBS_TAG }}-aarch64-apple-darwin-install_only.tar.gz
        run: |
          cd "$GITHUB_WORKSPACE/manager/desktop/launcher"
          mkdir -p "$GITHUB_WORKSPACE/dist/launcher"
          go build -trimpath -ldflags "-s -w \
            -X main.version=${{ env.VERSION }} \
            -X main.defaultRuntimeURL=${{ env.RUNTIME_URL }}" \
            -o "$GITHUB_WORKSPACE/dist/launcher/LianT" ./cmd

      - name: Assemble LianT.app
        run: |
          set -e
          APP="$GITHUB_WORKSPACE/LianT.app"
          RES="$APP/Contents/Resources/client"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$RES"

          cp "$GITHUB_WORKSPACE/dist/launcher/LianT" "$APP/Contents/MacOS/LianT"
          cp -r manager/desktop/client/src "$RES/src"
          cp -r manager/desktop/client/qml "$RES/qml"
          cp manager/desktop/client/requirements.txt "$RES/requirements.txt"

          cp manager/desktop/installer/darwin/LianT.icns "$APP/Contents/Resources/" 2>/dev/null || true

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0"?>
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>LianT</string>
            <key>CFBundleExecutable</key><string>LianT</string>
            <key>CFBundleIdentifier</key><string>com.bailensn.LianT</string>
            <key>CFBundleVersion</key><string>${{ env.VERSION }}</string>
            <key>CFBundleShortVersionString</key><string>${{ env.VERSION }}</string>
            <key>CFBundleIconFile</key><string>LianT</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$APP" 2>/dev/null || true

      - name: Create dmg
        run: |
          hdiutil create -volname LianT -srcfolder "$GITHUB_WORKSPACE/LianT.app" -ov \
            -format UDZO "LianT-v${{ env.VERSION }}-Darwin-arm64.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-Darwin-arm64
          path: LianT-v${{ env.VERSION }}-Darwin-arm64.dmg

  # ===================================================================
  # Linux amd64 -> deb + rpm (无运行时，首启动动态下载)
  # ===================================================================
  linux-amd64:
    if: ${{ inputs.linux_amd64 }}
    runs-on: ubuntu-latest
    env:
      ROOTFS: manager/desktop/installer/linux/rootfs
      DEB_ARCH: amd64
      RPM_ARCH: x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            fakeroot rpm file desktop-file-utils pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libwayland-dev libwayland-bin libx11-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev \
            libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxxf86vm-dev \
            libvulkan-dev

      # Gio 的 cgo 在编译期通过 pkg-config 探测 xkbcommon/wayland-client 等
      # 系统库。提前显式校验，避免依赖缺失时深入到 go build 才报错。
      - name: Verify X11/Wayland pkg-config deps
        run: |
          pkg-config --modversion xkbcommon
          pkg-config --modversion xkbcommon-x11
          pkg-config --modversion wayland-client
          pkg-config --modversion x11
          pkg-config --modversion x11-xcb
          test -f /usr/include/vulkan/vulkan.h && echo "vulkan.h OK"

      - name: Build Go Launcher
        env:
          RUNTIME_URL: ${{ env.PBS_BASE }}/cpython-${{ env.PY_VERSION }}+${{ env.PBS_TAG }}-x86_64-unknown-linux-gnu-install_only.tar.gz
        run: |
          cd "$GITHUB_WORKSPACE/manager/desktop/launcher"
          mkdir -p "$GITHUB_WORKSPACE/dist/launcher"
          go build -trimpath -ldflags "-s -w \
            -X main.version=${{ env.VERSION }} \
            -X main.defaultRuntimeURL=${{ env.RUNTIME_URL }}" \
            -o "$GITHUB_WORKSPACE/dist/launcher/LianT" ./cmd

      - name: Assemble deb rootfs
        run: |
          set -e
          rm -rf "$ROOTFS/opt/LianT/src" "$ROOTFS/opt/LianT/qml" "$ROOTFS/opt/LianT/requirements.txt"
          mkdir -p "$ROOTFS/opt/LianT/bin"
          mkdir -p "$ROOTFS/usr/share/applications"
          mkdir -p "$ROOTFS/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "$ROOTFS/usr/share/icons/hicolor/512x512/apps"

          install -m 755 dist/launcher/LianT "$ROOTFS/opt/LianT/bin/LianT"

          cp -r manager/desktop/client/src "$ROOTFS/opt/LianT/src"
          cp -r manager/desktop/client/qml "$ROOTFS/opt/LianT/qml"
          cp manager/desktop/client/requirements.txt "$ROOTFS/opt/LianT/requirements.txt"

          install -m 644 manager/desktop/packaging/linux/LianT.desktop \
            "$ROOTFS/usr/share/applications/LianT.desktop"
          install -m 644 manager/desktop/packaging/linux/icons/scalable/LianT.svg \
            "$ROOTFS/usr/share/icons/hicolor/scalable/apps/LianT.svg"
          install -m 644 manager/desktop/packaging/linux/icons/512x512/LianT.png \
            "$ROOTFS/usr/share/icons/hicolor/512x512/apps/LianT.png"

      - name: Package deb
        run: |
          PKG=pkg-deb
          rm -rf "$PKG"
          cp -r "$ROOTFS/." "$PKG/"
          cp -r manager/desktop/installer/linux/deb/DEBIAN "$PKG/DEBIAN"

          sed -i "s/^Version:.*/Version: ${{ env.VERSION }}/" "$PKG/DEBIAN/control"
          sed -i "s/^Architecture:.*/Architecture: ${{ env.DEB_ARCH }}/" "$PKG/DEBIAN/control"

          fakeroot dpkg-deb --build "$PKG" "LianT-v${{ env.VERSION }}-Linux-${{ env.DEB_ARCH }}.deb"

      - name: Package rpm
        run: |
          set -e
          TOPDIR="$(pwd)/rpmbuild"
          rm -rf "$TOPDIR"
          mkdir -p "$TOPDIR"/{BUILD,RPMS,SOURCES,SPECS}

          SRCTREE="LianT-src"
          rm -rf "$SRCTREE"
          mkdir -p "$SRCTREE/build/client"
          install -m 755 dist/launcher/LianT "$SRCTREE/build/LianT"
          cp -r manager/desktop/client/src "$SRCTREE/build/client/src"
          cp -r manager/desktop/client/qml "$SRCTREE/build/client/qml"
          cp manager/desktop/client/requirements.txt "$SRCTREE/build/client/requirements.txt"

          cp -r manager/desktop/packaging "$SRCTREE/packaging"
          cp -r manager/desktop/assets "$SRCTREE/assets"

          tar -czf "$TOPDIR/SOURCES/LianT-src.tar.gz" "$SRCTREE"

          cp manager/desktop/installer/linux/rpm/LianT.spec "$TOPDIR/SPECS/LianT.spec"
          sed -i "s/^BuildArch:.*/BuildArch: ${{ env.RPM_ARCH }}/" "$TOPDIR/SPECS/LianT.spec"
          sed -i "1i Source: LianT-src.tar.gz" "$TOPDIR/SPECS/LianT.spec"
          sed -i "s|# No source preparation needed|%setup -q -n LianT-src|" "$TOPDIR/SPECS/LianT.spec"

          rpmbuild \
            --define "_topdir $TOPDIR" \
            --define "_build_id_links none" \
            -bb "$TOPDIR/SPECS/LianT.spec"

          cp "$TOPDIR"/RPMS/${{ env.RPM_ARCH }}/*.rpm \
            "LianT-v${{ env.VERSION }}-Linux-amd64.rpm"

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-Linux-amd64
          path: |
            LianT-v${{ env.VERSION }}-Linux-amd64.deb
            LianT-v${{ env.VERSION }}-Linux-amd64.rpm

  # ===================================================================
  # Linux arm64 -> deb + rpm
  # ===================================================================
  linux-arm64:
    if: ${{ inputs.linux_arm64 }}
    runs-on: ubuntu-24.04-arm
    env:
      ROOTFS: manager/desktop/installer/linux/rootfs
      DEB_ARCH: arm64
      RPM_ARCH: aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            fakeroot rpm file desktop-file-utils pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libwayland-dev libwayland-bin libx11-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev \
            libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxxf86vm-dev \
            libvulkan-dev

      # Gio 的 cgo 在编译期通过 pkg-config 探测 xkbcommon/wayland-client 等
      # 系统库。提前显式校验，避免依赖缺失时深入到 go build 才报错。
      - name: Verify X11/Wayland pkg-config deps
        run: |
          pkg-config --modversion xkbcommon
          pkg-config --modversion xkbcommon-x11
          pkg-config --modversion wayland-client
          pkg-config --modversion x11
          pkg-config --modversion x11-xcb
          test -f /usr/include/vulkan/vulkan.h && echo "vulkan.h OK"

      - name: Build Go Launcher
        env:
          RUNTIME_URL: ${{ env.PBS_BASE }}/cpython-${{ env.PY_VERSION }}+${{ env.PBS_TAG }}-aarch64-unknown-linux-gnu-install_only.tar.gz
        run: |
          cd "$GITHUB_WORKSPACE/manager/desktop/launcher"
          mkdir -p "$GITHUB_WORKSPACE/dist/launcher"
          go build -trimpath -ldflags "-s -w \
            -X main.version=${{ env.VERSION }} \
            -X main.defaultRuntimeURL=${{ env.RUNTIME_URL }}" \
            -o "$GITHUB_WORKSPACE/dist/launcher/LianT" ./cmd

      - name: Assemble deb rootfs
        run: |
          set -e
          rm -rf "$ROOTFS/opt/LianT/src" "$ROOTFS/opt/LianT/qml" "$ROOTFS/opt/LianT/requirements.txt"
          mkdir -p "$ROOTFS/opt/LianT/bin"
          mkdir -p "$ROOTFS/usr/share/applications"
          mkdir -p "$ROOTFS/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "$ROOTFS/usr/share/icons/hicolor/512x512/apps"

          install -m 755 dist/launcher/LianT "$ROOTFS/opt/LianT/bin/LianT"

          cp -r manager/desktop/client/src "$ROOTFS/opt/LianT/src"
          cp -r manager/desktop/client/qml "$ROOTFS/opt/LianT/qml"
          cp manager/desktop/client/requirements.txt "$ROOTFS/opt/LianT/requirements.txt"

          install -m 644 manager/desktop/packaging/linux/LianT.desktop \
            "$ROOTFS/usr/share/applications/LianT.desktop"
          install -m 644 manager/desktop/packaging/linux/icons/scalable/LianT.svg \
            "$ROOTFS/usr/share/icons/hicolor/scalable/apps/LianT.svg"
          install -m 644 manager/desktop/packaging/linux/icons/512x512/LianT.png \
            "$ROOTFS/usr/share/icons/hicolor/512x512/apps/LianT.png"

      - name: Package deb
        run: |
          PKG=pkg-deb
          rm -rf "$PKG"
          cp -r "$ROOTFS/." "$PKG/"
          cp -r manager/desktop/installer/linux/deb/DEBIAN "$PKG/DEBIAN"

          sed -i "s/^Version:.*/Version: ${{ env.VERSION }}/" "$PKG/DEBIAN/control"
          sed -i "s/^Architecture:.*/Architecture: ${{ env.DEB_ARCH }}/" "$PKG/DEBIAN/control"

          fakeroot dpkg-deb --build "$PKG" "LianT-v${{ env.VERSION }}-Linux-${{ env.DEB_ARCH }}.deb"

      - name: Package rpm
        run: |
          set -e
          TOPDIR="$(pwd)/rpmbuild"
          rm -rf "$TOPDIR"
          mkdir -p "$TOPDIR"/{BUILD,RPMS,SOURCES,SPECS}

          SRCTREE="LianT-src"
          rm -rf "$SRCTREE"
          mkdir -p "$SRCTREE/build/client"
          install -m 755 dist/launcher/LianT "$SRCTREE/build/LianT"
          cp -r manager/desktop/client/src "$SRCTREE/build/client/src"
          cp -r manager/desktop/client/qml "$SRCTREE/build/client/qml"
          cp manager/desktop/client/requirements.txt "$SRCTREE/build/client/requirements.txt"

          cp -r manager/desktop/packaging "$SRCTREE/packaging"
          cp -r manager/desktop/assets "$SRCTREE/assets"

          tar -czf "$TOPDIR/SOURCES/LianT-src.tar.gz" "$SRCTREE"

          cp manager/desktop/installer/linux/rpm/LianT.spec "$TOPDIR/SPECS/LianT.spec"
          sed -i "s/^BuildArch:.*/BuildArch: ${{ env.RPM_ARCH }}/" "$TOPDIR/SPECS/LianT.spec"
          sed -i "1i Source: LianT-src.tar.gz" "$TOPDIR/SPECS/LianT.spec"
          sed -i "s|# No source preparation needed|%setup -q -n LianT-src|" "$TOPDIR/SPECS/LianT.spec"

          rpmbuild \
            --define "_topdir $TOPDIR" \
            --define "_build_id_links none" \
            -bb "$TOPDIR/SPECS/LianT.spec"

          cp "$TOPDIR"/RPMS/${{ env.RPM_ARCH }}/*.rpm \
            "LianT-v${{ env.VERSION }}-Linux-arm64.rpm"

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-Linux-arm64
          path: |
            LianT-v${{ env.VERSION }}-Linux-arm64.deb
            LianT-v${{ env.VERSION }}-Linux-arm64.rpm
