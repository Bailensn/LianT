name: Build Manager Desktop

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        type: choice
        options:
          - debug
          - release
        default: release
      version:
        description: 'Version'
        type: string
        default: '1.0.0'
      linux_amd64:
        description: 'Linux amd64'
        type: boolean
        default: false
      linux_arm64:
        description: 'Linux arm64'
        type: boolean
        default: false
      windows_amd64:
        description: 'Windows amd64 (.exe)'
        type: boolean
        default: false
      darwin_arm64:
        description: 'macOS arm64 (Apple Silicon)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  APP_NAME: LianT
  APP_VERSION: ${{ inputs.version }}
  BUILD_ROOT: ${{ github.workspace }}/build
  SRC_ROOT: ${{ github.workspace }}/manager/desktop
  OUTPUT_DIR: ${{ github.workspace }}

jobs:
  # ======================================================================
  # Linux amd64
  # ======================================================================
  linux-amd64:
    if: ${{ inputs.linux_amd64 }}
    name: Linux amd64
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SRC_ROOT }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (Fyne + OpenGL + X11)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxfixes-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libxi-dev libxinerama-dev libxxf86vm-dev libxext-dev \
            pkg-config gcc libwayland-dev

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - name: Verify CGO
        run: |
          which gcc || (sudo apt-get install -y gcc && echo "gcc installed")
          gcc --version
          go env CGO_ENABLED

      - name: Build binary
        run: |
          export CGO_ENABLED=1 GOOS=linux GOARCH=amd64
          mkdir -p ${{ env.BUILD_ROOT }}/linux/amd64
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            go build -ldflags="-s -w" -trimpath -o ${{ env.BUILD_ROOT }}/linux/amd64/${{ env.APP_NAME }} .
          else
            go build -o ${{ env.BUILD_ROOT }}/linux/amd64/${{ env.APP_NAME }} .
          fi

      - name: Upload binary (debug)
        if: ${{ inputs.build_mode == 'debug' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-linux-amd64
          path: ${{ env.BUILD_ROOT }}/linux/amd64/${{ env.APP_NAME }}
          retention-days: 7

      - name: Package .deb & .rpm (release)
        if: ${{ inputs.build_mode == 'release' }}
        shell: bash
        run: |
          set -e
          BIN="${{ env.BUILD_ROOT }}/linux/amd64/${{ env.APP_NAME }}"
          test -f "$BIN" || { echo "❌ Binary not found at $BIN"; exit 1; }

          sudo apt-get install -y dpkg-dev fakeroot rpm
          PKG="deb_pkg"
          mkdir -p ${PKG}/usr/bin
          mkdir -p ${PKG}/usr/share/applications
          for s in 16 32 48 64 128 256 512; do
            mkdir -p ${PKG}/usr/share/icons/hicolor/${s}x${s}/apps
          done
          mkdir -p ${PKG}/DEBIAN
          cp "$BIN" ${PKG}/usr/bin/${{ env.APP_NAME }}
          chmod 755 ${PKG}/usr/bin/${{ env.APP_NAME }}

          RES="${{ github.workspace }}/manager/resources/linux"
          cp ${RES}/16/LianT.png  ${PKG}/usr/share/icons/hicolor/16x16/apps/LianT.png
          cp ${RES}/32/LianT.png  ${PKG}/usr/share/icons/hicolor/32x32/apps/LianT.png
          cp ${RES}/48/LianT.png  ${PKG}/usr/share/icons/hicolor/48x48/apps/LianT.png
          cp ${RES}/64/LianT.png  ${PKG}/usr/share/icons/hicolor/64x64/apps/LianT.png
          cp ${RES}/128/LianT.png ${PKG}/usr/share/icons/hicolor/128x128/apps/LianT.png
          cp ${RES}/256/LianT.png ${PKG}/usr/share/icons/hicolor/256x256/apps/LianT.png
          cp ${RES}/512/LianT.png ${PKG}/usr/share/icons/hicolor/512x512/apps/LianT.png
          cp ${RES}/LianT.desktop ${PKG}/usr/share/applications/LianT.desktop

          cat > ${PKG}/DEBIAN/control <<EOF
          Package: liant
          Version: ${{ env.APP_VERSION }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: LianT Team
          Description: LianT Manager
           Cross-platform manager tool.
          EOF
          sed -i 's/\r$//' ${PKG}/DEBIAN/control
          dpkg-deb --build --root-owner-group ${PKG} "${{ env.APP_NAME }}_${{ env.APP_VERSION }}_amd64.deb"
          echo "✅ Generated .deb: ${{ env.APP_NAME }}_${{ env.APP_VERSION }}_amd64.deb"

          RPMTOP="${HOME}/rpmbuild"
          mkdir -p ${RPMTOP}/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          BR="${RPMTOP}/BUILDROOT"
          mkdir -p ${BR}/usr/bin
          mkdir -p ${BR}/usr/share/applications
          for s in 16 32 48 64 128 256 512; do
            mkdir -p ${BR}/usr/share/icons/hicolor/${s}x${s}/apps
          done
          cp "$BIN" ${BR}/usr/bin/${{ env.APP_NAME }}
          chmod 755 ${BR}/usr/bin/${{ env.APP_NAME }}
          cp ${RES}/16/LianT.png  ${BR}/usr/share/icons/hicolor/16x16/apps/LianT.png
          cp ${RES}/32/LianT.png  ${BR}/usr/share/icons/hicolor/32x32/apps/LianT.png
          cp ${RES}/48/LianT.png  ${BR}/usr/share/icons/hicolor/48x48/apps/LianT.png
          cp ${RES}/64/LianT.png  ${BR}/usr/share/icons/hicolor/64x64/apps/LianT.png
          cp ${RES}/128/LianT.png ${BR}/usr/share/icons/hicolor/128x128/apps/LianT.png
          cp ${RES}/256/LianT.png ${BR}/usr/share/icons/hicolor/256x256/apps/LianT.png
          cp ${RES}/512/LianT.png ${BR}/usr/share/icons/hicolor/512x512/apps/LianT.png
          cp ${RES}/LianT.desktop ${BR}/usr/share/applications/LianT.desktop

          cat > ${RPMTOP}/SPECS/LianT.spec <<EOF
          Name:           liant
          Version:        ${{ env.APP_VERSION }}
          Release:        1%{?dist}
          Summary:        LianT Manager
          License:        Proprietary
          BuildArch:      x86_64

          %description
          Cross-platform manager tool.

          %install
          mkdir -p %{buildroot}/usr/bin
          cp ${BR}/usr/bin/LianT %{buildroot}/usr/bin/LianT
          chmod 755 %{buildroot}/usr/bin/LianT
          mkdir -p %{buildroot}/usr/share/applications
          cp ${BR}/usr/share/applications/LianT.desktop %{buildroot}/usr/share/applications/LianT.desktop
          for s in 16 32 48 64 128 256 512; do
            mkdir -p %{buildroot}/usr/share/icons/hicolor/\${s}x\${s}/apps
          done
          cp ${BR}/usr/share/icons/hicolor/16x16/apps/LianT.png   %{buildroot}/usr/share/icons/hicolor/16x16/apps/LianT.png
          cp ${BR}/usr/share/icons/hicolor/32x32/apps/LianT.png   %{buildroot}/usr/share/icons/hicolor/32x32/apps/LianT.png
          cp ${BR}/usr/share/icons/hicolor/48x48/apps/LianT.png   %{buildroot}/usr/share/icons/hicolor/48x48/apps/LianT.png
          cp ${BR}/usr/share/icons/hicolor/64x64/apps/LianT.png   %{buildroot}/usr/share/icons/hicolor/64x64/apps/LianT.png
          cp ${BR}/usr/share/icons/hicolor/128x128/apps/LianT.png %{buildroot}/usr/share/icons/hicolor/128x128/apps/LianT.png
          cp ${BR}/usr/share/icons/hicolor/256x256/apps/LianT.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/LianT.png
          cp ${BR}/usr/share/icons/hicolor/512x512/apps/LianT.png %{buildroot}/usr/share/icons/hicolor/512x512/apps/LianT.png

          %files
          /usr/bin/LianT
          /usr/share/applications/LianT.desktop
          /usr/share/icons/hicolor/16x16/apps/LianT.png
          /usr/share/icons/hicolor/32x32/apps/LianT.png
          /usr/share/icons/hicolor/48x48/apps/LianT.png
          /usr/share/icons/hicolor/64x64/apps/LianT.png
          /usr/share/icons/hicolor/128x128/apps/LianT.png
          /usr/share/icons/hicolor/256x256/apps/LianT.png
          /usr/share/icons/hicolor/512x512/apps/LianT.png

          %post
          /bin/touch --no-create /usr/share/icons/hicolor 2>/dev/null || true
          [ -x /usr/bin/gtk-update-icon-cache ] && /usr/bin/gtk-update-icon-cache -f -t /usr/share/icons/hicolor 2>/dev/null || true
          [ -x /usr/bin/update-desktop-database ] && /usr/bin/update-desktop-database 2>/dev/null || true

          %postun
          [ -x /usr/bin/gtk-update-icon-cache ] && /usr/bin/gtk-update-icon-cache -f -t /usr/share/icons/hicolor 2>/dev/null || true
          [ -x /usr/bin/update-desktop-database ] && /usr/bin/update-desktop-database 2>/dev/null || true
          EOF

          rpmbuild -bb \
            --define "_topdir ${RPMTOP}" \
            --define "_buildroot ${BR}" \
            --define "_rpmdir ${RPMTOP}/RPMS" \
            ${RPMTOP}/SPECS/LianT.spec
          find ${RPMTOP}/RPMS -name "*.rpm" -exec cp {} "${{ env.APP_NAME }}_${{ env.APP_VERSION }}_x86_64.rpm" \;
          echo "✅ Generated .rpm: ${{ env.APP_NAME }}_${{ env.APP_VERSION }}_x86_64.rpm"

          mv *.deb *.rpm ${{ env.OUTPUT_DIR }}/

      - name: Upload packages (release)
        if: ${{ inputs.build_mode == 'release' }}
        uses: actions/upload-artifact@v6
        with:
          name: packages-linux-amd64
          path: |
            ${{ env.APP_NAME }}_${{ env.APP_VERSION }}_amd64.deb
            ${{ env.APP_NAME }}_${{ env.APP_VERSION }}_x86_64.rpm
          if-no-files-found: error
          retention-days: 30

  # ======================================================================
  # Linux arm64
  # ======================================================================
  linux-arm64:
    if: ${{ inputs.linux_arm64 }}
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: ${{ env.SRC_ROOT }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (Fyne + OpenGL + X11)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxfixes-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libxi-dev libxinerama-dev libxxf86vm-dev libxext-dev \
            pkg-config gcc

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - name: Verify CGO
        run: |
          which gcc || (sudo apt-get install -y gcc && echo "gcc installed")
          gcc --version
          go env CGO_ENABLED

      - name: Build binary
        run: |
          export CGO_ENABLED=1 GOOS=linux GOARCH=arm64
          mkdir -p ${{ env.BUILD_ROOT }}/linux/arm64
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            go build -ldflags="-s -w" -trimpath -o ${{ env.BUILD_ROOT }}/linux/arm64/${{ env.APP_NAME }} .
          else
            go build -o ${{ env.BUILD_ROOT }}/linux/arm64/${{ env.APP_NAME }} .
          fi

      - name: Upload binary (debug)
        if: ${{ inputs.build_mode == 'debug' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-linux-arm64
          path: ${{ env.BUILD_ROOT }}/linux/arm64/${{ env.APP_NAME }}
          retention-days: 7

      - name: Package .deb & .rpm (release)
        if: ${{ inputs.build_mode == 'release' }}
        shell: bash
        run: |
          set -e
          BIN="${{ env.BUILD_ROOT }}/linux/arm64/${{ env.APP_NAME }}"
          test -f "$BIN" || { echo "❌ Binary not found at $BIN"; exit 1; }

          sudo apt-get install -y dpkg-dev fakeroot rpm
          PKG="deb_pkg"
          mkdir -p ${PKG}/usr/bin
          mkdir -p ${PKG}/usr/share/applications
          for s in 16 32 48 64 128 256 512; do
            mkdir -p ${PKG}/usr/share/icons/hicolor/${s}x${s}/apps
          done
          mkdir -p ${PKG}/DEBIAN
          cp "$BIN" ${PKG}/usr/bin/${{ env.APP_NAME }}
          chmod 755 ${PKG}/usr/bin/${{ env.APP_NAME }}

          RES="${{ github.workspace }}/manager/resources/linux"
          cp ${RES}/16/LianT.png  ${PKG}/usr/share/icons/hicolor/16x16/apps/LianT.png
          cp ${RES}/32/LianT.png  ${PKG}/usr/share/icons/hicolor/32x32/apps/LianT.png
          cp ${RES}/48/LianT.png  ${PKG}/usr/share/icons/hicolor/48x48/apps/LianT.png
          cp ${RES}/64/LianT.png  ${PKG}/usr/share/icons/hicolor/64x64/apps/LianT.png
          cp ${RES}/128/LianT.png ${PKG}/usr/share/icons/hicolor/128x128/apps/LianT.png
          cp ${RES}/256/LianT.png ${PKG}/usr/share/icons/hicolor/256x256/apps/LianT.png
          cp ${RES}/512/LianT.png ${PKG}/usr/share/icons/hicolor/512x512/apps/LianT.png
          cp ${RES}/LianT.desktop ${PKG}/usr/share/applications/LianT.desktop

          cat > ${PKG}/DEBIAN/control <<EOF
          Package: liant
          Version: ${{ env.APP_VERSION }}
          Section: utils
          Priority: optional
          Architecture: arm64
          Maintainer: LianT Team
          Description: LianT Manager
           Cross-platform manager tool.
          EOF
          sed -i 's/\r$//' ${PKG}/DEBIAN/control
          dpkg-deb --build --root-owner-group ${PKG} "${{ env.APP_NAME }}_${{ env.APP_VERSION }}_arm64.deb"
          echo "✅ Generated .deb: ${{ env.APP_NAME }}_${{ env.APP_VERSION }}_arm64.deb"

          RPMTOP="${HOME}/rpmbuild"
          mkdir -p ${RPMTOP}/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          BR="${RPMTOP}/BUILDROOT"
          mkdir -p ${BR}/usr/bin
          mkdir -p ${BR}/usr/share/applications
          for s in 16 32 48 64 128 256 512; do
            mkdir -p ${BR}/usr/share/icons/hicolor/${s}x${s}/apps
          done
          cp "$BIN" ${BR}/usr/bin/${{ env.APP_NAME }}
          chmod 755 ${BR}/usr/bin/${{ env.APP_NAME }}
          cp ${RES}/16/LianT.png  ${BR}/usr/share/icons/hicolor/16x16/apps/LianT.png
          cp ${RES}/32/LianT.png  ${BR}/usr/share/icons/hicolor/32x32/apps/LianT.png
          cp ${RES}/48/LianT.png  ${BR}/usr/share/icons/hicolor/48x48/apps/LianT.png
          cp ${RES}/64/LianT.png  ${BR}/usr/share/icons/hicolor/64x64/apps/LianT.png
          cp ${RES}/128/LianT.png ${BR}/usr/share/icons/hicolor/128x128/apps/LianT.png
          cp ${RES}/256/LianT.png ${BR}/usr/share/icons/hicolor/256x256/apps/LianT.png
          cp ${RES}/512/LianT.png ${BR}/usr/share/icons/hicolor/512x512/apps/LianT.png
          cp ${RES}/LianT.desktop ${BR}/usr/share/applications/LianT.desktop

          cat > ${RPMTOP}/SPECS/LianT.spec <<EOF
          Name:           liant
          Version:        ${{ env.APP_VERSION }}
          Release:        1%{?dist}
          Summary:        LianT Manager
          License:        Proprietary
          BuildArch:      aarch64

          %description
          Cross-platform manager tool.

          %install
          mkdir -p %{buildroot}/usr/bin
          cp ${BR}/usr/bin/LianT %{buildroot}/usr/bin/LianT
          chmod 755 %{buildroot}/usr/bin/LianT
          mkdir -p %{buildroot}/usr/share/applications
          cp ${BR}/usr/share/applications/LianT.desktop %{buildroot}/usr/share/applications/LianT.desktop
          for s in 16 32 48 64 128 256 512; do
            mkdir -p %{buildroot}/usr/share/icons/hicolor/\${s}x\${s}/apps
          done
          cp ${BR}/usr/share/icons/hicolor/16x16/apps/LianT.png   %{buildroot}/usr/share/icons/hicolor/16x16/apps/LianT.png
          cp ${BR}/usr/share/icons/hicolor/32x32/apps/LianT.png   %{buildroot}/usr/share/icons/hicolor/32x32/apps/LianT.png
          cp ${BR}/usr/share/icons/hicolor/48x48/apps/LianT.png   %{buildroot}/usr/share/icons/hicolor/48x48/apps/LianT.png
          cp ${BR}/usr/share/icons/hicolor/64x64/apps/LianT.png   %{buildroot}/usr/share/icons/hicolor/64x64/apps/LianT.png
          cp ${BR}/usr/share/icons/hicolor/128x128/apps/LianT.png %{buildroot}/usr/share/icons/hicolor/128x128/apps/LianT.png
          cp ${BR}/usr/share/icons/hicolor/256x256/apps/LianT.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/LianT.png
          cp ${BR}/usr/share/icons/hicolor/512x512/apps/LianT.png %{buildroot}/usr/share/icons/hicolor/512x512/apps/LianT.png

          %files
          /usr/bin/LianT
          /usr/share/applications/LianT.desktop
          /usr/share/icons/hicolor/16x16/apps/LianT.png
          /usr/share/icons/hicolor/32x32/apps/LianT.png
          /usr/share/icons/hicolor/48x48/apps/LianT.png
          /usr/share/icons/hicolor/64x64/apps/LianT.png
          /usr/share/icons/hicolor/128x128/apps/LianT.png
          /usr/share/icons/hicolor/256x256/apps/LianT.png
          /usr/share/icons/hicolor/512x512/apps/LianT.png

          %post
          /bin/touch --no-create /usr/share/icons/hicolor 2>/dev/null || true
          [ -x /usr/bin/gtk-update-icon-cache ] && /usr/bin/gtk-update-icon-cache -f -t /usr/share/icons/hicolor 2>/dev/null || true
          [ -x /usr/bin/update-desktop-database ] && /usr/bin/update-desktop-database 2>/dev/null || true

          %postun
          [ -x /usr/bin/gtk-update-icon-cache ] && /usr/bin/gtk-update-icon-cache -f -t /usr/share/icons/hicolor 2>/dev/null || true
          [ -x /usr/bin/update-desktop-database ] && /usr/bin/update-desktop-database 2>/dev/null || true
          EOF

          rpmbuild -bb \
            --define "_topdir ${RPMTOP}" \
            --define "_buildroot ${BR}" \
            --define "_rpmdir ${RPMTOP}/RPMS" \
            ${RPMTOP}/SPECS/LianT.spec
          find ${RPMTOP}/RPMS -name "*.rpm" -exec cp {} "${{ env.APP_NAME }}_${{ env.APP_VERSION }}_aarch64.rpm" \;
          echo "✅ Generated .rpm: ${{ env.APP_NAME }}_${{ env.APP_VERSION }}_aarch64.rpm"

          mv *.deb *.rpm ${{ env.OUTPUT_DIR }}/

      - name: Upload packages (release)
        if: ${{ inputs.build_mode == 'release' }}
        uses: actions/upload-artifact@v6
        with:
          name: packages-linux-arm64
          path: |
            ${{ env.APP_NAME }}_${{ env.APP_VERSION }}_arm64.deb
            ${{ env.APP_NAME }}_${{ env.APP_VERSION }}_aarch64.rpm
          if-no-files-found: error
          retention-days: 30

  # ======================================================================
  # Windows amd64
  # ======================================================================
  windows-amd64:
    if: ${{ inputs.windows_amd64 }}
    name: Windows amd64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ env.SRC_ROOT }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - name: Install MinGW-w64 (required for Fyne CGO)
        run: choco install mingw -y --no-progress
        shell: pwsh

      - name: Verify CGO toolchain
        shell: pwsh
        run: |
          $mingwPath = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          if (Test-Path $mingwPath) {
            $env:Path = "$mingwPath;$env:Path"
          }
          gcc --version
          go env CGO_ENABLED

      - name: Build binary
        shell: pwsh
        run: |
          # Ensure MinGW is in PATH for this step
          $mingwPath = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          if (Test-Path $mingwPath) {
            $env:Path = "$mingwPath;$env:Path"
          }
          $env:CGO_ENABLED = "1"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"

          New-Item -ItemType Directory -Force -Path "${{ env.BUILD_ROOT }}\windows\amd64" | Out-Null
          if ("${{ inputs.build_mode }}" -eq "release") {
            go build -ldflags="-s -w -H=windowsgui" -trimpath -o "${{ env.BUILD_ROOT }}\windows\amd64\${{ env.APP_NAME }}.exe" .
          } else {
            go build -o "${{ env.BUILD_ROOT }}\windows\amd64\${{ env.APP_NAME }}.exe" .
          }

      - name: Upload binary (debug)
        if: ${{ inputs.build_mode == 'debug' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-windows-amd64
          path: ${{ env.BUILD_ROOT }}/windows/amd64/${{ env.APP_NAME }}.exe
          retention-days: 7

      - name: Install Inno Setup (release)
        if: ${{ inputs.build_mode == 'release' }}
        shell: pwsh
        run: |
          choco install innosetup -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

      - name: Package Windows .exe installer (release)
        if: ${{ inputs.build_mode == 'release' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $APP     = "${{ env.APP_NAME }}"
          $VERSION = "${{ env.APP_VERSION }}"
          $BUILD   = "${{ env.BUILD_ROOT }}\windows\amd64"
          $RES     = "${{ github.workspace }}\manager\resources\windows"
          $PKG     = "pkg_win"
          $OUT     = "${{ env.OUTPUT_DIR }}"

          Write-Host "🔍 APP=$APP  VERSION=$VERSION"
          Write-Host "🔍 BUILD=$BUILD"
          Write-Host "🔍 RES=$RES"

          # ---- 校验二进制 ----
          $exePath = "$BUILD\$APP.exe"
          if (-not (Test-Path $exePath)) {
            throw "❌ Binary not found at $exePath"
          }
          Write-Host "✅ Binary found: $exePath ($([math]::Round((Get-Item $exePath).Length/1MB,2)) MB)"

          # ---- 确定图标文件 ----
          $iconFile = ""
          if (Test-Path "$RES\$APP.ico") {
            $iconFile = "$RES\$APP.ico"
          } elseif (Test-Path "$RES\LianT.ico") {
            $iconFile = "$RES\LianT.ico"
          } else {
            $found = Get-ChildItem $RES -Filter "*.ico" -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $iconFile = $found.FullName }
          }
          if ($iconFile) {
            Write-Host "✅ Using icon: $iconFile"
          } else {
            Write-Host "⚠️ No .ico found in $RES, installer will use default icon"
          }

          # ---- 准备打包目录 ----
          New-Item -ItemType Directory -Force -Path $PKG | Out-Null
          Copy-Item $exePath "$PKG\$APP.exe" -Force
          Write-Host "✅ Copied $APP.exe into $PKG\"

          if ($iconFile) {
            Copy-Item $iconFile "$PKG\app.ico" -Force
            Write-Host "✅ Copied icon into $PKG\app.ico"
          }

          # 复制其他资源文件（非 .ico）
          if (Test-Path $RES) {
            Get-ChildItem $RES -File | Where-Object { $_.Extension -ne ".ico" } | ForEach-Object {
              Copy-Item $_.FullName "$PKG\" -Force
              Write-Host "  + $($_.Name)"
            }
          }

          # ---- 构建 Inno Setup 脚本 ----
          $issPath = "$PKG\installer.iss"

          $lines = @()
          $lines += "; -- Inno Setup Script for $APP $VERSION --"
          $lines += "; Generated by GitHub Actions workflow"
          $lines += ""
          $lines += "[Setup]"
          $lines += "AppName=$APP"
          $lines += "AppVersion=$VERSION"
          $lines += "AppPublisher=LianT Team"
          $lines += "DefaultDirName={pf}\$APP"
          $lines += "DefaultGroupName=$APP"
          $lines += "OutputDir=$OUT"
          $lines += "OutputBaseFilename=${APP}_${VERSION}_amd64"
          $lines += "Compression=lzma"
          $lines += "SolidCompression=yes"
          $lines += "PrivilegesRequired=admin"
          $lines += "UninstallDisplayIcon={app}\app.ico"
          if ($iconFile) {
            $lines += "SetupIconFile=app.ico"
          }
          $lines += ""
          $lines += "[Files]"
          $lines += "Source: ""$APP.exe""; DestDir: ""{app}""; Flags: ignoreversion"
          if ($iconFile) {
            $lines += "Source: ""app.ico""; DestDir: ""{app}""; Flags: ignoreversion"
          }
          # 额外文件
          $extraFiles = Get-ChildItem "$PKG\*" -File | Where-Object { $_.Name -notin @("$APP.exe","app.ico","installer.iss") }
          if ($extraFiles) {
            foreach ($f in $extraFiles) {
              $lines += "Source: ""$($f.Name)""; DestDir: ""{app}""; Flags: ignoreversion"
            }
          }
          $lines += ""
          $lines += "[Icons]"
          $lines += "Name: ""{group}\$APP""; Filename: ""{app}\$APP.exe""; IconFilename: ""{app}\app.ico"""
          $lines += "Name: ""{commondesktop}\$APP""; Filename: ""{app}\$APP.exe""; IconFilename: ""{app}\app.ico""; Tasks: desktopicon"
          $lines += ""
          $lines += "[Tasks]"
          $lines += 'Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"'
          $lines += ""
          $lines += "[Run]"
          $lines += "Filename: ""{app}\$APP.exe""; Description: ""Launch $APP""; Flags: nowait postinstall skipifsilent"

          # 写入文件（UTF8 无 BOM）
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllLines($issPath, $lines, $utf8NoBom)
          Write-Host "📝 installer.iss written to $issPath"

          # 显示脚本内容
          Write-Host "📝 installer.iss contents:"
          Get-Content $issPath | ForEach-Object { Write-Host "  $_" }

          # 确认包目录内容
          Write-Host "📦 Package contents:"
          Get-ChildItem $PKG | ForEach-Object { Write-Host "  $($_.Name)  ($($_.Length) bytes)" }

          # ---- 查找 iscc 编译器 ----
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @(
              "$env:ProgramFiles\Inno Setup 6\iscc.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\iscc.exe",
              "C:\tools\Inno Setup 6\iscc.exe"
            )
            foreach ($c in $candidates) {
              if (Test-Path $c) { $iscc = $c; break }
            }
          }
          if (-not $iscc) {
            throw "❌ iscc.exe not found after Inno Setup installation"
          }
          Write-Host "🔧 Using iscc: $iscc"

          # ---- 编译 ----
          Push-Location $PKG
          & $iscc "installer.iss"
          $exitCode = $LASTEXITCODE
          Pop-Location
          if ($exitCode -ne 0) { throw "Inno Setup 编译失败 (exit code $exitCode)" }

          # ---- 确认输出文件 ----
          $outputFile = "$OUT\${APP}_${VERSION}_amd64.exe"
          if (Test-Path $outputFile) {
            $size = (Get-Item $outputFile).Length
            Write-Host "✅ Generated installer: $outputFile ($([math]::Round($size/1MB,2)) MB)"
          } else {
            $generated = Get-ChildItem "$OUT\*.exe" -File | Where-Object { $_.Name -match "^${APP}.*amd64\.exe$" } | Select-Object -First 1
            if ($generated) {
              Write-Host "✅ Generated installer: $($generated.FullName) ($([math]::Round($generated.Length/1MB,2)) MB)"
            } else {
              Write-Host "📁 OUTPUT_DIR contents:"
              Get-ChildItem $OUT | ForEach-Object { Write-Host "  $($_.Name)" }
              throw "❌ Installer output not found at expected path: $outputFile"
            }
          }

      - name: Upload packages (release)
        if: ${{ inputs.build_mode == 'release' }}
        uses: actions/upload-artifact@v6
        with:
          name: packages-windows-amd64
          path: ${{ env.APP_NAME }}_${{ env.APP_VERSION }}_amd64.exe
          if-no-files-found: error
          retention-days: 30

  # ======================================================================
  # macOS arm64
  # ======================================================================
  darwin-arm64:
    if: ${{ inputs.darwin_arm64 }}
    name: macOS arm64
    runs-on: macos-14
    defaults:
      run:
        working-directory: ${{ env.SRC_ROOT }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - name: Verify CGO toolchain
        run: |
          which clang || (xcode-select --install && echo "Xcode CLI installed")
          clang --version
          go env CGO_ENABLED

      - name: Build binary
        run: |
          export CGO_ENABLED=1 GOOS=darwin GOARCH=arm64
          mkdir -p ${{ env.BUILD_ROOT }}/darwin/arm64
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            go build -ldflags="-s -w" -trimpath -o ${{ env.BUILD_ROOT }}/darwin/arm64/${{ env.APP_NAME }} .
          else
            go build -o ${{ env.BUILD_ROOT }}/darwin/arm64/${{ env.APP_NAME }} .
          fi

      - name: Upload binary (debug)
        if: ${{ inputs.build_mode == 'debug' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-darwin-arm64
          path: ${{ env.BUILD_ROOT }}/darwin/arm64/${{ env.APP_NAME }}
          retention-days: 7

      - name: Package macOS .dmg (release)
        if: ${{ inputs.build_mode == 'release' }}
        shell: bash
        run: |
          set -e
          BIN="${{ env.BUILD_ROOT }}/darwin/arm64/${{ env.APP_NAME }}"
          test -f "$BIN" || { echo "❌ Binary not found at $BIN"; exit 1; }

          APP="${APP_NAME}.app"
          mkdir -p ${APP}/Contents/MacOS
          mkdir -p ${APP}/Contents/Resources

          cp "$BIN" ${APP}/Contents/MacOS/${{ env.APP_NAME }}
          chmod +x ${APP}/Contents/MacOS/${{ env.APP_NAME }}

          RES="${{ github.workspace }}/manager/resources/darwin"
          if [ -f "${RES}/LianT.icns" ]; then
            cp "${RES}/LianT.icns" ${APP}/Contents/Resources/AppIcon.icns
          elif [ -f "${RES}/LianT.png" ]; then
            cp "${RES}/LianT.png"  ${APP}/Contents/Resources/AppIcon.png
          fi

          if [ -d "${RES}" ]; then
            for f in "${RES}"/*; do
              fname=$(basename "$f")
              [ "$fname" = "LianT.icns" ] || [ "$fname" = "LianT.png" ] && continue
              cp -r "$f" ${APP}/Contents/Resources/ 2>/dev/null || true
            done
          fi

          cat > ${APP}/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>              <string>${APP_NAME}</string>
            <key>CFBundleDisplayName</key>       <string>${APP_NAME}</string>
            <key>CFBundleIdentifier</key>        <string>com.liant.manager</string>
            <key>CFBundleVersion</key>           <string>${{ env.APP_VERSION }}</string>
            <key>CFBundleShortVersionString</key><string>${{ env.APP_VERSION }}</string>
            <key>CFBundleExecutable</key>        <string>${APP_NAME}</string>
            <key>CFBundlePackageType</key>       <string>APPL</string>
            <key>CFBundleSignature</key>         <string>????</string>
            <key>LSMinimumSystemVersion</key>    <string>10.13</string>
            <key>NSHighResolutionCapable</key>   <true/>
            <key>LSApplicationCategoryType</key> <string>public.app-category.utilities</string>
          </dict>
          </plist>
          EOF

          echo "✅ .app bundle created"

          DMG_DIR="dmg_stage"
          mkdir -p ${DMG_DIR}
          cp -r ${APP} ${DMG_DIR}/
          ln -sf /Applications ${DMG_DIR}/Applications

          hdiutil create -volname "${APP_NAME}" \
            -srcfolder ${DMG_DIR} \
            -ov -format UDZO \
            "${{ env.APP_NAME }}_${{ env.APP_VERSION }}_arm64.dmg"

          echo "✅ Generated .dmg: ${{ env.APP_NAME }}_${{ env.APP_VERSION }}_arm64.dmg"

          mv "${{ env.APP_NAME }}_${{ env.APP_VERSION }}_arm64.dmg" ${{ env.OUTPUT_DIR }}/

      - name: Upload packages (release)
        if: ${{ inputs.build_mode == 'release' }}
        uses: actions/upload-artifact@v6
        with:
          name: packages-darwin-arm64
          path: ${{ env.APP_NAME }}_${{ env.APP_VERSION }}_arm64.dmg
          if-no-files-found: error
          retention-days: 30
