name: Build Manager Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version'
        required: true
        default: '1.0.0'

      windows:
        type: boolean
        default: false

      linux_arm64:
        type: boolean
        default: false

      linux_amd64:
        type: boolean
        default: false

      darwin_arm64:
        type: boolean
        default: false

      darwin_amd64:
        type: boolean
        default: false


jobs:

  windows-amd64:
    if: ${{ inputs.windows }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          cache: true

      - name: Build bare app
        working-directory: manager/desktop
        run: cargo build --release

      - name: Inject version into Inno Setup script
        working-directory: manager/resources/windows
        shell: pwsh
        run: |
          (Get-Content LianT.iss) -replace '^#define AppVersion ".*"', '#define AppVersion "${{ inputs.version }}"' | Set-Content -Encoding ASCII LianT.iss

      - name: Build Inno Setup installer
        working-directory: manager/resources/windows
        shell: pwsh
        run: |
          $iscc = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )
            foreach ($p in $candidates) {
              if (Test-Path $p) { $iscc = Get-Item $p; break }
            }
          }
          if (-not $iscc) { throw "ISCC.exe not found — Inno Setup not installed on runner" }

          & $iscc.Source LianT.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exit code $LASTEXITCODE" }

      - name: Rename setup artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem "manager/release" -Filter *.exe | Select-Object -First 1
          if ($null -eq $exe) { throw "Setup exe not found in manager/release" }
          Move-Item -Force $exe.FullName "LianT_${{ inputs.version }}_amd64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-Windows-amd64
          path: LianT_${{ inputs.version }}_amd64.exe

  darwin-arm64:
    if: ${{ inputs.darwin_arm64 }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          cache: true

      - name: Build bare app
        working-directory: manager/desktop
        run: cargo build --release

      - name: Make app bundle
        run: |
          mkdir -p LianT.app/Contents/MacOS
          mkdir -p LianT.app/Contents/Resources

          cp manager/desktop/target/release/LianT LianT.app/Contents/MacOS/LianT

          cp manager/resources/darwin/LianT.icns \
            LianT.app/Contents/Resources/

          cat << EOF > LianT.app/Contents/Info.plist
          <?xml version="1.0"?>
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>LianT</string>

            <key>CFBundleExecutable</key>
            <string>LianT</string>

            <key>CFBundleIdentifier</key>
            <string>com.bailensn.liant</string>

            <key>CFBundleVersion</key>
            <string>${{ inputs.version }}</string>

            <key>CFBundleIconFile</key>
            <string>LianT.icns</string>

            <key>CFBundlePackageType</key>
            <string>APPL</string>
          </dict>
          </plist>
          EOF

      - name: Create dmg
        run: |
          hdiutil create \
            -volname LianT \
            -srcfolder LianT.app \
            -ov \
            -format UDZO \
            LianT_${{ inputs.version }}_arm64.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-Darwin-arm64
          path: LianT_${{ inputs.version }}_arm64.dmg

  darwin-amd64:
    if: ${{ inputs.darwin_amd64 }}
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          cache: true

      - name: Build bare app
        working-directory: manager/desktop
        run: cargo build --release

      - name: Make app bundle
        run: |
          mkdir -p LianT.app/Contents/MacOS
          mkdir -p LianT.app/Contents/Resources

          cp manager/desktop/target/release/LianT LianT.app/Contents/MacOS/LianT

          cp manager/resources/darwin/LianT.icns \
            LianT.app/Contents/Resources/

          cat << EOF > LianT.app/Contents/Info.plist
          <?xml version="1.0"?>
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>LianT</string>

            <key>CFBundleExecutable</key>
            <string>LianT</string>

            <key>CFBundleIdentifier</key>
            <string>com.bailensn.liant</string>

            <key>CFBundleVersion</key>
            <string>${{ inputs.version }}</string>

            <key>CFBundleIconFile</key>
            <string>LianT.icns</string>

            <key>CFBundlePackageType</key>
            <string>APPL</string>
          </dict>
          </plist>
          EOF

      - name: Create dmg
        run: |
          hdiutil create \
            -volname LianT \
            -srcfolder LianT.app \
            -ov \
            -format UDZO \
            LianT_${{ inputs.version }}_amd64.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-Darwin-amd64
          path: LianT_${{ inputs.version }}_amd64.dmg

  linux-amd64:
    if: ${{ inputs.linux_amd64 }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          cache: true

      - name: Install build tools
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.archive.ubuntu.com|g; /packages.microsoft.com/d' /etc/apt/sources.list

          sudo apt-get update -y

          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libssl-dev \
            libxkbcommon-x11-0 \
            fonts-noto-cjk \
            fakeroot \
            rpm

      - name: Build bare app
        working-directory: manager/desktop
        run: cargo build --release

      - name: Package deb
        run: |
          PKG="pkg-deb"

          rm -rf "$PKG"

          mkdir -p "$PKG"/DEBIAN
          mkdir -p "$PKG"/opt/LianT
          mkdir -p "$PKG"/usr/bin
          mkdir -p "$PKG"/usr/share/applications

          for d in manager/resources/linux/*; do
            sz=$(basename "$d")

            [[ "$sz" =~ ^[0-9]+$ ]] || continue

            mkdir -p "$PKG"/usr/share/icons/hicolor/${sz}x${sz}/apps

            cp "$d"/LianT.png \
              "$PKG"/usr/share/icons/hicolor/${sz}x${sz}/apps/
          done

          cp manager/desktop/target/release/LianT "$PKG"/opt/LianT/

          ln -s /opt/LianT/LianT \
            "$PKG"/usr/bin/LianT

          sed \
            "s|^Exec=.*|Exec=/usr/bin/LianT|; s|^Icon=.*|Icon=LianT|" \
            manager/resources/linux/LianT.desktop \
            > "$PKG"/usr/share/applications/LianT.desktop

          cat << EOF > "$PKG"/DEBIAN/control
          Package: LianT
          Version: ${{ inputs.version }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: LianT Team <bailensnn@gmail.com>
          Description: LianT Manager Desktop
           Cross-platform manager tool for LianT service.
          EOF

          fakeroot dpkg-deb \
            --build \
            "$PKG" \
            LianT_${{ inputs.version }}_amd64.deb

      - name: Package rpm
        run: |
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS}

          mkdir -p rpmbuild/SOURCES/LianT

          cp manager/desktop/target/release/LianT rpmbuild/SOURCES/LianT/

          cat << EOF > rpmbuild/SPECS/LianT.spec
          Name: LianT
          Version: ${{ inputs.version }}
          Release: 1
          Summary: LianT Manager Desktop
          License: Apache-2.0
          BuildArch: x86_64

          %description
          Cross-platform manager tool for LianT service.

          %install
          mkdir -p %{buildroot}/opt/LianT
          mkdir -p %{buildroot}/usr/bin

          cp %{_sourcedir}/LianT/LianT %{buildroot}/opt/LianT/

          ln -s /opt/LianT/LianT %{buildroot}/usr/bin/LianT

          %files
          /opt/LianT
          /usr/bin/LianT
          EOF

          rpmbuild \
            --define "_topdir $(pwd)/rpmbuild" \
            -bb rpmbuild/SPECS/LianT.spec

          cp rpmbuild/RPMS/x86_64/*.rpm \
            LianT_${{ inputs.version }}_amd64.rpm

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-Linux-amd64
          path: |
            LianT_${{ inputs.version }}_amd64.deb
            LianT_${{ inputs.version }}_amd64.rpm


  linux-arm64:
    if: ${{ inputs.linux_arm64 }}
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          cache: true

      - name: Install build tools
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.archive.ubuntu.com|g; /packages.microsoft.com/d' /etc/apt/sources.list

          sudo apt-get update -y

          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libssl-dev \
            libxkbcommon-x11-0 \
            fonts-noto-cjk \
            fakeroot \
            rpm

      - name: Build bare app
        working-directory: manager/desktop
        run: cargo build --release

      - name: Package deb
        run: |
          PKG="pkg-deb"

          rm -rf "$PKG"

          mkdir -p "$PKG"/DEBIAN
          mkdir -p "$PKG"/opt/LianT
          mkdir -p "$PKG"/usr/bin
          mkdir -p "$PKG"/usr/share/applications

          for d in manager/resources/linux/*; do
            sz=$(basename "$d")

            [[ "$sz" =~ ^[0-9]+$ ]] || continue

            mkdir -p "$PKG"/usr/share/icons/hicolor/${sz}x${sz}/apps

            cp "$d"/LianT.png \
              "$PKG"/usr/share/icons/hicolor/${sz}x${sz}/apps/
          done

          cp manager/desktop/target/release/LianT "$PKG"/opt/LianT/

          ln -s /opt/LianT/LianT \
            "$PKG"/usr/bin/LianT

          sed \
            "s|^Exec=.*|Exec=/usr/bin/LianT|; s|^Icon=.*|Icon=LianT|" \
            manager/resources/linux/LianT.desktop \
            > "$PKG"/usr/share/applications/LianT.desktop

          cat << EOF > "$PKG"/DEBIAN/control
          Package: LianT
          Version: ${{ inputs.version }}
          Section: utils
          Priority: optional
          Architecture: arm64
          Maintainer: LianT Team <bailensnn@gmail.com>
          Description: LianT Manager Desktop
           Cross-platform manager tool for LianT service.
          EOF

          fakeroot dpkg-deb \
            --build \
            "$PKG" \
            LianT_${{ inputs.version }}_arm64.deb

      - name: Package rpm
        run: |
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS}

          mkdir -p rpmbuild/SOURCES/LianT

          cp manager/desktop/target/release/LianT rpmbuild/SOURCES/LianT/

          cat << EOF > rpmbuild/SPECS/LianT.spec
          Name: LianT
          Version: ${{ inputs.version }}
          Release: 1
          Summary: LianT Manager Desktop
          License: Apache-2.0
          BuildArch: aarch64

          %description
          Cross-platform manager tool for LianT service.

          %install
          mkdir -p %{buildroot}/opt/LianT
          mkdir -p %{buildroot}/usr/bin

          cp %{_sourcedir}/LianT/LianT %{buildroot}/opt/LianT/

          ln -s /opt/LianT/LianT %{buildroot}/usr/bin/LianT

          %files
          /opt/LianT
          /usr/bin/LianT
          EOF

          rpmbuild \
            --define "_topdir $(pwd)/rpmbuild" \
            -bb rpmbuild/SPECS/LianT.spec

          cp rpmbuild/RPMS/aarch64/*.rpm \
            LianT_${{ inputs.version }}_arm64.rpm

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-Linux-arm64
          path: |
            LianT_${{ inputs.version }}_arm64.deb
            LianT_${{ inputs.version }}_arm64.rpm