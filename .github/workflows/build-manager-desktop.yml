name: Build LianT (Compose Multiplatform)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        type: choice
        options: [debug, release]
        default: release
      version:
        description: 'Version'
        type: string
        default: '1.0.0'
      linux_amd64:
        description: 'Linux amd64 (deb/rpm)'
        type: boolean
        default: false
      linux_arm64:
        description: 'Linux arm64 (deb/rpm)'
        type: boolean
        default: false
      windows_amd64:
        description: 'Windows amd64 (exe)'
        type: boolean
        default: false
      darwin_arm64:
        description: 'macOS arm64 (dmg)'
        type: boolean
        default: false
      darwin_amd64:
        description: 'macOS amd64 (dmg)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  APP_NAME: LianT
  APP_VERSION: ${{ inputs.version }}
  OUTPUT_DIR: ${{ github.workspace }}/out
  MANAGER_DIR: ${{ github.workspace }}/manager

jobs:
  # ======================================================================
  # Linux amd64
  # ======================================================================
  linux-amd64:
    if: ${{ inputs.linux_amd64 }}
    name: Linux amd64
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - name: Parse versions from libs.versions.toml
        id: versions
        run: |
          set -e
          TOML="${{ env.MANAGER_DIR }}/libs.versions.toml"
          echo "kotlin=$(grep '^kotlin ' "$TOML" | sed 's/.*= *"\(.*\)"/\1/')" >> $GITHUB_OUTPUT
          echo "gradle=$(grep '^gradle ' "$TOML" | sed 's/.*= *"\(.*\)"/\1/')" >> $GITHUB_OUTPUT
          echo "agp=$(grep '^agp ' "$TOML" | sed 's/.*= *"\(.*\)"/\1/')" >> $GITHUB_OUTPUT
          echo "compose=$(grep '^compose-multiplatform ' "$TOML" | sed 's/.*= *"\(.*\)"/\1/')" >> $GITHUB_OUTPUT
          echo "jdk=$(grep '^jdk ' "$TOML" | sed 's/.*= *"\(.*\)"/\1/')" >> $GITHUB_OUTPUT
          echo "--- versions ---"
          cat $GITHUB_OUTPUT

      - name: Install JDK + system deps for jpackage
        run: |
          set -e
          JDK_VER="${{ steps.versions.outputs.jdk }}"
          sudo apt-get update
          sudo apt-get install -y openjdk-${JDK_VER}-jdk-headless \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxfixes-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libxi-dev libxinerama-dev libxxf86vm-dev libxext-dev \
            pkg-config fakeroot dpkg-dev rpm binutils libwayland-dev
          echo "JAVA_HOME=/usr/lib/jvm/java-${{ steps.versions.outputs.jdk }}-openjdk-amd64" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ steps.versions.outputs.jdk }}

      - name: Generate Gradle scaffolding
        run: |
          set -e
          KOTLIN_VER="${{ steps.versions.outputs.kotlin }}"
          AGP_VER="${{ steps.versions.outputs.agp }}"
          COMPOSE_VER="${{ steps.versions.outputs.compose }}"
          JVM_TARGET=$(grep '^jvmTarget ' "${{ env.MANAGER_DIR }}/libs.versions.toml" | sed 's/.*= *"\(.*\)"/\1/')

          # 1) settings.gradle.kts
          cat > settings.gradle.kts <<'SETTINGS'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "LianT"
          include(":composeApp")
          SETTINGS

          # 2) 根 build.gradle.kts
          cat > build.gradle.kts <<ROOT
          plugins {
            id("org.jetbrains.kotlin.multiplatform") version "${KOTLIN_VER}" apply false
            id("org.jetbrains.kotlin.plugin.serialization") version "${KOTLIN_VER}" apply false
            id("org.jetbrains.compose") version "${COMPOSE_VER}" apply false
            id("com.android.application") version "${AGP_VER}" apply false
          }
          ROOT

          # 3) gradle.properties
          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          PROPS

          # 4) composeApp/build.gradle.kts
          mkdir -p composeApp
          cat > composeApp/build.gradle.kts <<COMPOSE
          plugins {
            id("org.jetbrains.kotlin.multiplatform")
            id("org.jetbrains.kotlin.plugin.serialization")
            id("org.jetbrains.compose")
            id("com.android.application")
          }

          kotlin {
            jvm("desktop") {
              compilations.all {
                kotlinOptions.jvmTarget = "${JVM_TARGET}"
              }
            }
            androidTarget {
              compilations.all {
                kotlinOptions.jvmTarget = "${JVM_TARGET}"
              }
            }
            sourceSets {
              val commonMain by getting {
                dependencies {
                  implementation(compose.runtime)
                  implementation(compose.foundation)
                  implementation(compose.material3)
                  implementation(compose.ui)
                  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1")
                  implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.3")
                }
              }
              val desktopMain by getting {
                dependencies {
                  implementation(compose.desktop.currentOs)
                }
              }
              val androidMain by getting {
                dependencies {
                  implementation(compose.ui)
                  implementation(compose.material3)
                  implementation(compose.foundation)
                  implementation(compose.runtime)
                }
              }
            }
          }

          android {
            namespace = "com.bailensn.tlink"
            compileSdk = 34
            defaultConfig {
              applicationId = "com.bailensn.tlink"
              minSdk = 24
              targetSdk = 34
              versionCode = 1
              versionName = "${{ env.APP_VERSION }}"
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            buildFeatures { compose = true }
          }

          compose.desktop {
            application {
              mainClass = "com.bailensn.tlink.MainKt"
              jvmArgs += listOf("-Xmx512m")
              nativeDistributions {
                targetFormats(
                  org.jetbrains.compose.desktop.application.dsl.TargetFormat.Deb,
                  org.jetbrains.compose.desktop.application.dsl.TargetFormat.Rpm
                )
                packageName = "LianT"
                packageVersion = "${{ env.APP_VERSION }}"
                description = "联T Manager"
                vendor = "bailensn"
                linux {
                  packageName = "liant"
                  debMaintainer = "LianT Team"
                }
              }
            }
          }
          COMPOSE

          # 5) 复制源码
          mkdir -p composeApp/src
          cp -r ${{ env.MANAGER_DIR }}/commonMain composeApp/src/
          cp -r ${{ env.MANAGER_DIR }}/desktopMain composeApp/src/
          cp -r ${{ env.MANAGER_DIR }}/androidMain composeApp/src/

          # 6) 复制图标资源（如果存在）
          if [ -d "${{ env.MANAGER_DIR }}/resources" ]; then
            mkdir -p composeApp/src/main
            cp -r ${{ env.MANAGER_DIR }}/resources composeApp/src/main/
          fi

          # 7) 生成 Gradle wrapper
          GRADLE_VER="${{ steps.versions.outputs.gradle }}"
          curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          export PATH="/opt/gradle-${GRADLE_VER}/bin:$PATH"
          gradle wrapper --gradle-version ${GRADLE_VER} --distribution-type bin
          echo "✅ Gradle ${GRADLE_VER} wrapper generated"

      - name: Build release distribution
        if: ${{ inputs.build_mode == 'release' }}
        run: |
          GRADLE_VER="${{ steps.versions.outputs.gradle }}"
          export PATH="/opt/gradle-${GRADLE_VER}/bin:$PATH"
          chmod +x gradlew
          ./gradlew :composeApp:packageReleaseDistributionForCurrentOS

      - name: Build debug (just build, no packaging)
        if: ${{ inputs.build_mode == 'debug' }}
        run: |
          GRADLE_VER="${{ steps.versions.outputs.gradle }}"
          export PATH="/opt/gradle-${GRADLE_VER}/bin:$PATH"
          chmod +x gradlew
          ./gradlew :composeApp:compileKotlinDesktop

      - name: Collect artifacts
        if: ${{ inputs.build_mode == 'release' }}
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          find composeApp/build/compose/binaries -type f \( -name "*.deb" -o -name "*.rpm" \) -exec cp {} ${{ env.OUTPUT_DIR }}/ \;
          ls -la ${{ env.OUTPUT_DIR }}/

      - name: Upload packages
        if: ${{ inputs.build_mode == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: packages-linux-amd64
          path: ${{ env.OUTPUT_DIR }}/*
          if-no-files-found: error
          retention-days: 30

  # ======================================================================
  # Linux arm64
  # ======================================================================
  linux-arm64:
    if: ${{ inputs.linux_arm64 }}
    name: Linux arm64
    runs-on: ubuntu-26.04-arm
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - name: Parse versions from libs.versions.toml
        id: versions
        run: |
          set -e
          TOML="${{ env.MANAGER_DIR }}/libs.versions.toml"
          echo "kotlin=$(grep '^kotlin ' "$TOML" | sed 's/.*= *"\(.*\)"/\1/')" >> $GITHUB_OUTPUT
          echo "gradle=$(grep '^gradle ' "$TOML" | sed 's/.*= *"\(.*\)"/\1/')" >> $GITHUB_OUTPUT
          echo "agp=$(grep '^agp ' "$TOML" | sed 's/.*= *"\(.*\)"/\1/')" >> $GITHUB_OUTPUT
          echo "compose=$(grep '^compose-multiplatform ' "$TOML" | sed 's/.*= *"\(.*\)"/\1/')" >> $GITHUB_OUTPUT
          echo "jdk=$(grep '^jdk ' "$TOML" | sed 's/.*= *"\(.*\)"/\1/')" >> $GITHUB_OUTPUT
          echo "--- versions ---"
          cat $GITHUB_OUTPUT

      - name: Install JDK + system deps for jpackage
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y openjdk-${{ steps.versions.outputs.jdk }}-jdk-headless \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxfixes-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libxi-dev libxinerama-dev libxxf86vm-dev libxext-dev \
            pkg-config fakeroot dpkg-dev rpm binutils libwayland-dev
          echo "JAVA_HOME=/usr/lib/jvm/java-${{ steps.versions.outputs.jdk }}-openjdk-arm64" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ steps.versions.outputs.jdk }}

      - name: Generate Gradle scaffolding
        run: |
          set -e
          KOTLIN_VER="${{ steps.versions.outputs.kotlin }}"
          AGP_VER="${{ steps.versions.outputs.agp }}"
          COMPOSE_VER="${{ steps.versions.outputs.compose }}"
          JVM_TARGET=$(grep '^jvmTarget ' "${{ env.MANAGER_DIR }}/libs.versions.toml" | sed 's/.*= *"\(.*\)"/\1/')

          cat > settings.gradle.kts <<'SETTINGS'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "LianT"
          include(":composeApp")
          SETTINGS

          cat > build.gradle.kts <<ROOT
          plugins {
            id("org.jetbrains.kotlin.multiplatform") version "${KOTLIN_VER}" apply false
            id("org.jetbrains.kotlin.plugin.serialization") version "${KOTLIN_VER}" apply false
            id("org.jetbrains.compose") version "${COMPOSE_VER}" apply false
            id("com.android.application") version "${AGP_VER}" apply false
          }
          ROOT

          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          PROPS

          mkdir -p composeApp
          cat > composeApp/build.gradle.kts <<COMPOSE
          plugins {
            id("org.jetbrains.kotlin.multiplatform")
            id("org.jetbrains.kotlin.plugin.serialization")
            id("org.jetbrains.compose")
            id("com.android.application")
          }

          kotlin {
            jvm("desktop") {
              compilations.all {
                kotlinOptions.jvmTarget = "${JVM_TARGET}"
              }
            }
            androidTarget {
              compilations.all {
                kotlinOptions.jvmTarget = "${JVM_TARGET}"
              }
            }
            sourceSets {
              val commonMain by getting {
                dependencies {
                  implementation(compose.runtime)
                  implementation(compose.foundation)
                  implementation(compose.material3)
                  implementation(compose.ui)
                  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1")
                  implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.3")
                }
              }
              val desktopMain by getting {
                dependencies {
                  implementation(compose.desktop.currentOs)
                }
              }
              val androidMain by getting {
                dependencies {
                  implementation(compose.ui)
                  implementation(compose.material3)
                  implementation(compose.foundation)
                  implementation(compose.runtime)
                }
              }
            }
          }

          android {
            namespace = "com.bailensn.tlink"
            compileSdk = 34
            defaultConfig {
              applicationId = "com.bailensn.tlink"
              minSdk = 24
              targetSdk = 34
              versionCode = 1
              versionName = "${{ env.APP_VERSION }}"
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            buildFeatures { compose = true }
          }

          compose.desktop {
            application {
              mainClass = "com.bailensn.tlink.MainKt"
              jvmArgs += listOf("-Xmx512m")
              nativeDistributions {
                targetFormats(
                  org.jetbrains.compose.desktop.application.dsl.TargetFormat.Deb,
                  org.jetbrains.compose.desktop.application.dsl.TargetFormat.Rpm
                )
                packageName = "LianT"
                packageVersion = "${{ env.APP_VERSION }}"
                description = "联T Manager"
                vendor = "bailensn"
                linux {
                  packageName = "liant"
                  debMaintainer = "LianT Team"
                }
              }
            }
          }
          COMPOSE

          mkdir -p composeApp/src
          cp -r ${{ env.MANAGER_DIR }}/commonMain composeApp/src/
          cp -r ${{ env.MANAGER_DIR }}/desktopMain composeApp/src/
          cp -r ${{ env.MANAGER_DIR }}/androidMain composeApp/src/

          if [ -d "${{ env.MANAGER_DIR }}/resources" ]; then
            mkdir -p composeApp/src/main
            cp -r ${{ env.MANAGER_DIR }}/resources composeApp/src/main/
          fi

          GRADLE_VER="${{ steps.versions.outputs.gradle }}"
          curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          export PATH="/opt/gradle-${GRADLE_VER}/bin:$PATH"
          gradle wrapper --gradle-version ${GRADLE_VER} --distribution-type bin
          echo "✅ Gradle ${GRADLE_VER} wrapper generated"

      - name: Build release distribution
        if: ${{ inputs.build_mode == 'release' }}
        run: |
          GRADLE_VER="${{ steps.versions.outputs.gradle }}"
          export PATH="/opt/gradle-${GRADLE_VER}/bin:$PATH"
          chmod +x gradlew
          ./gradlew :composeApp:packageReleaseDistributionForCurrentOS

