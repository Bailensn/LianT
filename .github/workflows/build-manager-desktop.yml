name: Build Manager Desktop (CMP)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.0.0'
      windows:
        type: boolean
        default: false
      darwin_arm64:
        type: boolean
        default: false
      linux_amd64:
        type: boolean
        default: false
      linux_arm64:
        type: boolean
        default: false

jobs:
  # ================== Windows ==================
  windows:
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build bare app
        working-directory: manager/desktop
        run: ./gradlew :desktopApp:createDistributable --no-daemon

      - name: UPX compress
        working-directory: manager/desktop
        run: |
          7z e -y https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-win64.zip upx.exe
          ./upx.exe -9 desktopApp/build/compose/binaries/main/app/*.exe
          ./upx.exe -9 desktopApp/build/compose/binaries/main/app/*.dll

      # 你的 Inno Setup 脚本自己控，Source 指向下面这个目录
      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup -y
          iscc manager/desktop/installer.iss
          mv manager/desktop/Output/LianT.exe LianT_${{ inputs.version }}_amd64.exe

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-Windows
          path: LianT_${{ inputs.version }}_amd64.exe

  # ================== macOS ==================
  darwin:
    if: ${{ inputs.darwin_arm64 }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build bare app
        working-directory: manager/desktop
        run: ./gradlew :desktopApp:createDistributable --no-daemon

      - name: Create .app bundle
        run: |
          APP="manager/desktop/desktopApp/build/compose/binaries/main/app"
          mkdir -p LianT.app/Contents/MacOS
          mkdir -p LianT.app/Contents/Resources
          cp -r $APP/* LianT.app/Contents/MacOS/
          cp manager/resources/darwin/LianT.icns LianT.app/Contents/Resources/
          cat > LianT.app/Contents/Info.plist << EOF
          <?xml version="1.0"?>
          <plist><dict>
          <key>CFBundleName</key><string>LianT</string>
          <key>CFBundleExecutable</key><string>LianT</string>
          <key>CFBundleIdentifier</key><string>com.bailensn.liant</string>
          <key>CFBundleVersion</key><string>${{ inputs.version }}</string>
          <key>CFBundleIconFile</key><string>LianT.icns</string>
          </dict></plist>
          EOF

      - name: Package dmg
        run: |
          hdiutil create -volname LianT -srcfolder LianT.app -ov -format UDZO LianT_${{ inputs.version }}_arm64.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-macOS
          path: LianT_${{ inputs.version }}_arm64.dmg

  # ================== Linux ==================
  linux:
    if: ${{ inputs.linux_amd64 || inputs.linux_arm64 }}
    strategy:
      matrix:
        arch: [ { name: "amd64", flag: "linux_amd64" }, { name: "arm64", flag: "linux_arm64" } ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build bare app
        working-directory: manager/desktop
        run: ./gradlew :desktopApp:createDistributable --no-daemon

      - name: Package deb
        run: |
          APP_DIR="manager/desktop/desktopApp/build/compose/binaries/main/app"
          PKG="pkg"
          rm -rf $PKG && mkdir -p $PKG/usr/bin
          mkdir -p $PKG/usr/share/applications
          for d in manager/resources/linux/*; do
            sz=$(basename $d)
            [[ "$sz" =~ ^[0-9]+$ ]] || continue
            mkdir -p $PKG/usr/share/icons/hicolor/${sz}x${sz}/apps
            cp $d/LianT.png $PKG/usr/share/icons/hicolor/${sz}x${sz}/apps/
          done
          cp $APP_DIR/LianT $PKG/usr/bin/
          chmod +x $PKG/usr/bin/LianT
          sed "s|^Exec=.*|Exec=/usr/bin/LianT|; s|^Icon=.*|Icon=LianT|" \
            manager/resources/linux/LianT.desktop > $PKG/usr/share/applications/LianT.desktop
          fakeroot dpkg-deb --build $PKG LianT_${{ inputs.version }}_${{ matrix.arch.name }}.deb

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-Linux-${{ matrix.arch.name }}
          path: LianT_${{ inputs.version }}_${{ matrix.arch.name }}.deb
