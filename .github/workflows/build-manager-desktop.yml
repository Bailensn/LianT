          if-no-files-found: error
          retention-days: 30

  # ======================================================================
  # Windows amd64
  # ======================================================================
  windows-amd64:
    if: ${{ inputs.windows_amd64 }}
    name: Windows amd64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - name: Parse versions from libs.versions.toml
        id: versions
        shell: bash
        run: |
          set -e
          TOML="${{ env.MANAGER_DIR }}/libs.versions.toml"
          AWK_SCRIPT='
            /^\[versions\]/ { in_v=1; next }
            /^\[/ { in_v=0 }
            in_v && /^[a-zA-Z_-]+[[:space:]]*=/ {
              key=$1; sub(/[[:space:]]*=.*/,"",key)
              val=""; in_q=0
              for(i=1;i<=length($0);i++){
                c=substr($0,i,1)
                if(c=="\""){ in_q=1-in_q; continue }
                if(in_q) val=val c
              }
              print key "=" val
            }'
          eval "$(echo "$AWK_SCRIPT" | awk -f - "$TOML" | sed 's/^/echo "/; s/$/\" >> $GITHUB_OUTPUT/')"
          echo "--- versions ---"
          cat $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ steps.versions.outputs.jdk }}

      - name: Install WiX Toolset + Inno Setup
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          choco install innosetup -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          echo "PATH=$env:Path" >> $env:GITHUB_ENV

      - name: Generate Gradle scaffolding
        shell: bash
        run: |
          set -e
          KOTLIN_VER="${{ steps.versions.outputs.kotlin }}"
          AGP_VER="${{ steps.versions.outputs.agp }}"
          COMPOSE_VER="${{ steps.versions.outputs.compose }}"
          JVM_TARGET="${{ steps.versions.outputs.jvmTarget }}"
          GRADLE_VER="${{ steps.versions.outputs.gradle }}"

          cat > settings.gradle.kts <<'SETTINGS'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "LianT"
          include(":composeApp")
          SETTINGS

          cat > build.gradle.kts <<ROOT
          plugins {
            id("org.jetbrains.kotlin.multiplatform") version "${KOTLIN_VER}" apply false
            id("org.jetbrains.kotlin.plugin.serialization") version "${KOTLIN_VER}" apply false
            id("org.jetbrains.compose") version "${COMPOSE_VER}" apply false
            id("com.android.application") version "${AGP_VER}" apply false
          }
          ROOT

          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          PROPS

          mkdir -p composeApp
          cat > composeApp/build.gradle.kts <<COMPOSE
          plugins {
            id("org.jetbrains.kotlin.multiplatform")
            id("org.jetbrains.kotlin.plugin.serialization")
            id("org.jetbrains.compose")
            id("com.android.application")
          }

          kotlin {
            jvm("desktop") {
              compilations.all {
                kotlinOptions.jvmTarget = "${JVM_TARGET}"
              }
            }
            androidTarget {
              compilations.all {
                kotlinOptions.jvmTarget = "${JVM_TARGET}"
              }
            }
            sourceSets {
              val commonMain by getting {
                dependencies {
                  implementation(compose.runtime)
                  implementation(compose.foundation)
                  implementation(compose.material3)
                  implementation(compose.ui)
                  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1")
                  implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.3")
                }
              }
              val desktopMain by getting {
                dependencies {
                  implementation(compose.desktop.currentOs)
                }
              }
              val androidMain by getting {
                dependencies {
                  implementation(compose.ui)
                  implementation(compose.material3)
                  implementation(compose.foundation)
                  implementation(compose.runtime)
                }
              }
            }
          }

          android {
            namespace = "com.bailensn.tlink"
            compileSdk = 34
            defaultConfig {
              applicationId = "com.bailensn.tlink"
              minSdk = 24
              targetSdk = 34
              versionCode = 1
              versionName = "${{ env.APP_VERSION }}"
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            buildFeatures { compose = true }
          }

          compose.desktop {
            application {
              mainClass = "com.bailensn.tlink.MainKt"
              jvmArgs += listOf("-Xmx512m")
              nativeDistributions {
                targetFormats(
                  org.jetbrains.compose.desktop.application.dsl.TargetFormat.Msi
                )
                packageName = "LianT"
                packageVersion = "${{ env.APP_VERSION }}"
                description = "联T Manager"
                vendor = "bailensn"
                windows {
                  menuGroup = "联T"
                  upgradeUuid = "b5a1c3e0-7f2b-4d8a-9e1f-3c4d5e6f7a8b"
                  if (file("src/main/resources/windows/LianT.ico").exists()) {
                    iconFile.set(file("src/main/resources/windows/LianT.ico"))
                  }
                }
              }
            }
          }
          COMPOSE

          mkdir -p composeApp/src
          cp -r "${{ env.MANAGER_DIR }}/commonMain" composeApp/src/
          cp -r "${{ env.MANAGER_DIR }}/desktopMain" composeApp/src/
          cp -r "${{ env.MANAGER_DIR }}/androidMain" composeApp/src/

          if [ -d "${{ env.MANAGER_DIR }}/resources" ]; then
            mkdir -p composeApp/src/main
            cp -r "${{ env.MANAGER_DIR }}/resources" composeApp/src/main/
          fi

          curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          export PATH="/opt/gradle-${GRADLE_VER}/bin:$PATH"
          gradle wrapper --gradle-version ${GRADLE_VER} --distribution-type bin
          echo "✅ Gradle ${GRADLE_VER} wrapper generated"

      - name: Build release distribution (MSI via jpackage)
        if: ${{ inputs.build_mode == 'release' }}
        shell: bash
        run: |
          GRADLE_VER="${{ steps.versions.outputs.gradle }}"
          export PATH="/opt/gradle-${GRADLE_VER}/bin:$PATH"
          chmod +x gradlew
          ./gradlew :composeApp:packageReleaseDistributionForCurrentOS

      - name: Package .exe installer with Inno Setup
        if: ${{ inputs.build_mode == 'release' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $APP     = "${{ env.APP_NAME }}"
          $VERSION = "${{ env.APP_VERSION }}"
          $BUILD   = "${{ github.workspace }}\composeApp\build\compose\binaries"
          $RES     = "${{ env.MANAGER_DIR }}\resources\windows"
          $PKG     = "pkg_win"
          $OUT     = "${{ env.OUTPUT_DIR }}"

          New-Item -ItemType Directory -Force -Path $OUT | Out-Null

          $msi = Get-ChildItem "$BUILD" -Filter "*.msi" -Recurse -File | Select-Object -First 1
          if (-not $msi) { throw "MSI not found in $BUILD" }
          Write-Host "Found MSI: $($msi.FullName)"

          $exeFile = Get-ChildItem "$BUILD" -Filter "$APP.exe" -Recurse -File | Select-Object -First 1
          if (-not $exeFile) { throw "$APP.exe not found under $BUILD" }
          Write-Host "Found EXE: $($exeFile.FullName)"

          New-Item -ItemType Directory -Force -Path $PKG | Out-Null
          Copy-Item $exeFile.FullName "$PKG\$APP.exe" -Force

          $iconFile = ""
          if (Test-Path "$RES\LianT.ico")       { $iconFile = "$RES\LianT.ico" }
          elseif (Test-Path "$RES\$APP.ico")    { $iconFile = "$RES\$APP.ico" }
          else {
            $found = Get-ChildItem $RES -Filter "*.ico" -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $iconFile = $found.FullName }
          }
          if ($iconFile) { Copy-Item $iconFile "$PKG\app.ico" -Force; Write-Host "Icon: $iconFile" }

          $issPath = "$PKG\installer.iss"
          $lines = @()
          $lines += "; -- Inno Setup Script for $APP $VERSION --"
          $lines += "[Setup]"
          $lines += "AppName=$APP"
          $lines += "AppVersion=$VERSION"
          $lines += "AppPublisher=LianT Team"
          $lines += "DefaultDirName={pf}\$APP"
          $lines += "DefaultGroupName=$APP"
          $lines += "OutputDir=$OUT"
          $lines += "OutputBaseFilename=${APP}_${VERSION}_amd64"
          $lines += "Compression=lzma"
          $lines += "SolidCompression=yes"
          $lines += "PrivilegesRequired=admin"
          if ($iconFile) { $lines += "SetupIconFile=app.ico" }
          $lines += ""
          $lines += "[Files]"
          $lines += "Source: ""$APP.exe""; DestDir: ""{app}""; Flags: ignoreversion"
          if ($iconFile) { $lines += "Source: ""app.ico""; DestDir: ""{app}""; Flags: ignoreversion" }
          $lines += ""
          $lines += "[Icons]"
          $lines += "Name: ""{group}\$APP""; Filename: ""{app}\$APP.exe"""
          $lines += "Name: ""{commondesktop}\$APP""; Filename: ""{app}\$APP.exe""; Tasks: desktopicon"
          $lines += ""
          $lines += "[Tasks]"
          $lines += 'Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"'
          $lines += ""
          $lines += "[Run]"
          $lines += "Filename: ""{app}\$APP.exe""; Description: ""Launch $APP""; Flags: nowait postinstall skipifsilent"

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllLines($issPath, $lines, $utf8NoBom)

          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @(
              "$env:ProgramFiles\Inno Setup 6\iscc.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\iscc.exe"
            )
            foreach ($c in $candidates) { if (Test-Path $c) { $iscc = $c; break } }
          }
          if (-not $iscc) { throw "iscc.exe not found" }

          Push-Location $PKG
          & $iscc "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Pop-Location

          $outFile = "$OUT\${APP}_${VERSION}_amd64.exe"
          if (Test-Path $outFile) {
            Write-Host "Generated: $outFile ($([math]::Round((Get-Item $outFile).Length/1MB,2)) MB)"
          } else { throw "Output exe not found at $outFile" }

      - name: Build debug
        if: ${{ inputs.build_mode == 'debug' }}
        shell: bash
        run: |
          GRADLE_VER="${{ steps.versions.outputs.gradle }}"
          export PATH="/opt/gradle-${GRADLE_VER}/bin:$PATH"
          chmod +x gradlew
          ./gradlew :composeApp:compileKotlinDesktop

      - name: Collect artifacts (release)
        if: ${{ inputs.build_mode == 'release' }}
        shell: bash
        run: |
          mkdir -p "${{ env.OUTPUT_DIR }}"
          find composeApp/build/compose/binaries -name "*.exe" -exec cp {} "${{ env.OUTPUT_DIR }}/" \;
          ls -la "${{ env.OUTPUT_DIR }}/"

      - name: Upload packages
        if: ${{ inputs.build_mode == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: packages-windows-amd64
          path: ${{ env.OUTPUT_DIR }}/*
          if-no-files-found: error
          retention-days: 30

  # ======================================================================
  # macOS arm64 (Apple Silicon)
  # ======================================================================
  darwin-arm64:
    if: ${{ inputs.darwin_arm64 }}
    name: macOS arm64
    runs-on: macos-14
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - name: Parse versions from libs.versions.toml
        id: versions
        run: |
          set -e
          TOML="${{ env.MANAGER_DIR }}/libs.versions.toml"
          AWK_SCRIPT='
            /^\[versions\]/ { in_v=1; next }
            /^\[/ { in_v=0 }
            in_v && /^[a-zA-Z_-]+[[:space:]]*=/ {
              key=$1; sub(/[[:space:]]*=.*/,"",key)
              val=""; in_q=0
              for(i=1;i<=length($0);i++){
                c=substr($0,i,1)
                if(c=="\""){ in_q=1-in_q; continue }
                if(in_q) val=val c
              }
              print key "=" val
            }'
          eval "$(echo "$AWK_SCRIPT" | awk -f - "$TOML" | sed 's/^/echo "/; s/$/\" >> $GITHUB_OUTPUT/')"
          echo "--- versions ---"
          cat $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ steps.versions.outputs.jdk }}

      - name: Generate Gradle scaffolding
        run: |
          set -e
          KOTLIN_VER="${{ steps.versions.outputs.kotlin }}"
          AGP_VER="${{ steps.versions.outputs.agp }}"
          COMPOSE_VER="${{ steps.versions.outputs.compose }}"
          JVM_TARGET="${{ steps.versions.outputs.jvmTarget }}"
          GRADLE_VER="${{ steps.versions.outputs.gradle }}"

          cat > settings.gradle.kts <<'SETTINGS'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "LianT"
          include(":composeApp")
          SETTINGS

          cat > build.gradle.kts <<ROOT
          plugins {
            id("org.jetbrains.kotlin.multiplatform") version "${KOTLIN_VER}" apply false
            id("org.jetbrains.kotlin.plugin.serialization") version "${KOTLIN_VER}" apply false
            id("org.jetbrains.compose") version "${COMPOSE_VER}" apply false
            id("com.android.application") version "${AGP_VER}" apply false
          }
          ROOT

          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          PROPS

          mkdir -p composeApp
          cat > composeApp/build.gradle.kts <<COMPOSE
          plugins {
            id("org.jetbrains.kotlin.multiplatform")
            id("org.jetbrains.kotlin.plugin.serialization")
            id("org.jetbrains.compose")
            id("com.android.application")
          }

          kotlin {
            jvm("desktop") {
              compilations.all {
                kotlinOptions.jvmTarget = "${JVM_TARGET}"
              }
            }
            androidTarget {
              compilations.all {
                kotlinOptions.jvmTarget = "${JVM_TARGET}"
              }
            }
            sourceSets {
              val commonMain by getting {
                dependencies {
                  implementation(compose.runtime)
                  implementation(compose.foundation)
                  implementation(compose.material3)
                  implementation(compose.ui)
                  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1")
                  implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.3")
                }
              }
              val desktopMain by getting {
                dependencies {
                  implementation(compose.desktop.currentOs)
                }
              }
              val androidMain by getting {
                dependencies {
                  implementation(compose.ui)
                  implementation(compose.material3)
                  implementation(compose.foundation)
                  implementation(compose.runtime)
                }
              }
            }
          }

          android {
            namespace = "com.bailensn.tlink"
            compileSdk = 34
            defaultConfig {
              applicationId = "com.bailensn.tlink"
              minSdk = 24
              targetSdk = 34
              versionCode = 1
              versionName = "${{ env.APP_VERSION }}"
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            buildFeatures { compose = true }
          }

          compose.desktop {
            application {
              mainClass = "com.bailensn.tlink.MainKt"
              jvmArgs += listOf("-Xmx512m")
              nativeDistributions {
                targetFormats(
                  org.jetbrains.compose.desktop.application.dsl.TargetFormat.Dmg
                )
                packageName = "LianT"
                packageVersion = "${{ env.APP_VERSION }}"
                description = "联T Manager"
                vendor = "bailensn"
                macOS {
                  bundleID = "com.bailensn.tlink"
                  if (file("src/main/resources/darwin/LianT.icns").exists()) {
                    iconFile.set(file("src/main/resources/darwin/LianT.icns"))
                  }
                }
              }
            }
          }
          COMPOSE

          mkdir -p composeApp/src
          cp -r "${{ env.MANAGER_DIR }}/commonMain" composeApp/src/
          cp -r "${{ env.MANAGER_DIR }}/desktopMain" composeApp/src/
          cp -r "${{ env.MANAGER_DIR }}/androidMain" composeApp/src/

          if [ -d "${{ env.MANAGER_DIR }}/resources" ]; then
            mkdir -p composeApp/src/main
            cp -r "${{ env.MANAGER_DIR }}/resources" composeApp/src/main/
          fi

          curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          export PATH="/opt/gradle-${GRADLE_VER}/bin:$PATH"
          gradle wrapper --gradle-version ${GRADLE_VER} --distribution-type bin
          echo "✅ Gradle ${GRADLE_VER} wrapper generated"

      - name: Build release distribution
        if: ${{ inputs.build_mode == 'release' }}
        run: |
          GRADLE_VER="${{ steps.versions.outputs.gradle }}"
          export PATH="/opt/gradle-${GRADLE_VER}/bin:$PATH"
          chmod +x gradlew
          ./gradlew :composeApp:packageReleaseDistributionForCurrentOS

      - name: Build debug
        if: ${{ inputs.build_mode == 'debug' }}
        run: |
          GRADLE_VER="${{ steps.versions.outputs.gradle }}"
          export PATH="/opt/gradle-${GRADLE_VER}/bin:$PATH"
          chmod +x gradlew
          ./gradlew :composeApp:compileKotlinDesktop

      - name: Collect artifacts
        if: ${{ inputs.build_mode == 'release' }}
        run: |
          mkdir -p "${{ env.OUTPUT_DIR }}"
          find composeApp/build/compose/binaries -name "*.dmg" -exec cp {} "${{ env.OUTPUT_DIR }}/" \;
          ls -la "${{ env.OUTPUT_DIR }}/"

      - name: Upload packages
        if: ${{ inputs.build_mode == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: packages-darwin-arm64
          path: ${{ env.OUTPUT_DIR }}/*
          if-no-files-found: error
          retention-days: 30

