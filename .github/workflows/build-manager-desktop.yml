name: Build Manager Desktop

on:
  # 仅允许手动触发
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

      linux_amd64:
        description: "Build Linux amd64"
        required: false
        type: boolean
        default: false

      linux_arm64:
        description: "Build Linux arm64"
        required: false
        type: boolean
        default: false

      windows_amd64:
        description: "Build Windows amd64"
        required: false
        type: boolean
        default: false

      darwin_amd64:
        description: "Build macOS amd64 (Intel)"
        required: false
        type: boolean
        default: false

      darwin_arm64:
        description: "Build macOS arm64 (Apple Silicon)"
        required: false
        type: boolean
        default: false


# 防止 GitHub Actions 在错误目录执行
defaults:
  run:
    working-directory: manager/desktop


jobs:
  build:
    name: Build Gio Desktop
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:

          - name: linux-amd64
            os: linux
            arch: amd64
            enabled: linux_amd64

          - name: linux-arm64
            os: linux
            arch: arm64
            enabled: linux_arm64

          - name: windows-amd64
            os: windows
            arch: amd64
            enabled: windows_amd64

          - name: darwin-amd64
            os: darwin
            arch: amd64
            enabled: darwin_amd64

          - name: darwin-arm64
            os: darwin
            arch: arm64
            enabled: darwin_arm64


    # 根据复选框决定是否运行
    if: |
      github.event.inputs[matrix.enabled] == 'true'


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

          # 注意：
          # cache-dependency-path 必须指向对应模块 go.sum
          cache-dependency-path: manager/desktop/go.sum


      - name: Download dependencies
        run: go mod download


      - name: Build
        shell: bash
        run: |
          mkdir -p output

          if [ "${{ github.event.inputs.mode }}" = "release" ]; then
            FLAGS="-ldflags=-s -w -trimpath"
          else
            FLAGS=""
          fi


          export CGO_ENABLED=0
          export GOOS=${{ matrix.os }}
          export GOARCH=${{ matrix.arch }}


          NAME="manager-desktop-${{ matrix.name }}"

          EXT=""

          if [ "${{ matrix.os }}" = "windows" ]; then
            EXT=".exe"
          fi


          go build \
            $FLAGS \
            -o "output/${NAME}${EXT}" \
            .


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: manager-desktop-${{ matrix.name }}
          path: manager/desktop/output/*