name: Service

# 服务端二进制：先 vet/测试，再出 linux amd64/arm64 + 校验和，发布 pre-release。
# install.sh 直接取最新 pre-release 的资产，不需要登录。
on:
  push:
    paths:
      - 'service/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum

      - name: Vet
        working-directory: service
        run: go vet ./...

      - name: Test
        working-directory: service
        run: go test -race ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum

      - name: Build
        id: build
        working-directory: service
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=7 HEAD)"
          version="v1.0.0-Alpha-$short"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p ../dist
          ldflags="-s -w -X main.version=$version"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o ../dist/LianT-linux-amd64 ./cmd/liant
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$ldflags" -o ../dist/LianT-linux-arm64 ./cmd/liant
          cd ../dist
          sha256sum * > SHA256SUMS.txt
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-service
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.version }}
          name: LianT ${{ steps.build.outputs.version }}
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: true
