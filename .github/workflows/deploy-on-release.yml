name: Deploy on Release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -f -X POST \
            -H "Content-Type: application/json" \
            -d '{"event_type": "release"}' \
            "${{ secrets.VERCEL_DEPLOY_HOOK }}"
