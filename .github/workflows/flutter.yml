name: Flutter

# 构建 Flutter 客户端：Web 版发 GitHub Pages 预览，Android 出 APK，Linux 出桌面二进制。
on:
  push:
    paths:
      - 'manager/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install Linux desktop deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Generate platform scaffolding
        working-directory: manager
        run: |
          flutter create --platforms=android,web,linux --project-name liant .
          git -C "$GITHUB_WORKSPACE" checkout -- manager/web/index.html

      - working-directory: manager
        run: flutter pub get

      - name: Build web preview
        working-directory: manager
        run: flutter build web --release --base-href /LianT/

      - name: Build APK
        working-directory: manager
        run: flutter build apk --debug

      - name: Build Linux desktop
        working-directory: manager
        run: flutter build linux --release

      - name: Deploy preview to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: manager/build/web
          publish_branch: gh-pages
          force_orphan: true

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-flutter-android
          path: manager/build/app/outputs/flutter-apk/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-flutter-linux
          path: manager/build/linux/x64/release/bundle/**
