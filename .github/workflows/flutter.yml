name: Flutter

# 构建 Flutter 客户端：Android 是交付目标，Linux 桌面作为附带产物，
# Web 只做本地预览与编译校验，不对外发布。
on:
  push:
    paths:
      - 'manager/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install Linux desktop deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Generate Linux desktop scaffolding
        working-directory: manager
        run: flutter create --platforms=linux --project-name liant .

      - working-directory: manager
        run: flutter pub get

      - name: Build web (预览用，不发布)
        working-directory: manager
        run: flutter build web --release

      - name: Build APK
        working-directory: manager
        run: flutter build apk --debug

      - name: Build Linux desktop
        working-directory: manager
        run: flutter build linux --release

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-flutter-android
          path: manager/build/app/outputs/flutter-apk/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-flutter-linux
          path: manager/build/linux/x64/release/bundle/**
