name: Flutter (Android)

# 只交付 Android：构建 release APK（arm64 / x86_64 / universal）并上传 artifact。
# Web 预览只在本地跑，不进 CI。
on:
  push:
    paths:
      - 'manager/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - working-directory: manager
        run: flutter pub get

      - name: Build Android APKs
        working-directory: manager
        run: |
          set -euo pipefail
          # release 构建（签名仍用 debug key，可直接安装），比 debug 小很多
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/LianT-universal.apk
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /tmp/LianT-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk /tmp/LianT-x86_64.apk
          ls -lh /tmp/LianT-*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-android-arm64
          path: /tmp/LianT-arm64.apk

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-android-x86_64
          path: /tmp/LianT-x86_64.apk

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-android-universal
          path: /tmp/LianT-universal.apk
