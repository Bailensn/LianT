name: Flutter (Android)

# 只交付 Android：构建 debug APK 并上传 artifact。
# Web 仅用于本地预览，这里只做一次编译校验，不发布。
on:
  push:
    paths:
      - 'manager/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - working-directory: manager
        run: flutter pub get

      - name: Compile web preview (not published)
        working-directory: manager
        run: flutter build web --release

      - name: Build Android APK
        working-directory: manager
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-android-debug
          path: manager/build/app/outputs/flutter-apk/*.apk
