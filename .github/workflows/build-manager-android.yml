name: Build Manager (Android)

on:
  push:
    branches: [main]
    paths:
      - 'manager/android/**'
      - '.github/workflows/build-manager-android.yml'
  pull_request:
    paths:
      - 'manager/android/**'
      - '.github/workflows/build-manager-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            manager/android/**/*.gradle.kts
            manager/android/gradle/libs.versions.toml

      - name: Configure Android SDK
        run: |
          # 运行器自带 SDK；不用 setup-android，它会去装已下架的 'tools' 包。
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMGR" --licenses > /dev/null || true
          # API 37 起 SDK 平台按 major.minor 命名；项目用 37.1（37.2 仍是 beta）。
          "$SDKMGR" --install "platforms;android-37.1" "build-tools;37.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-manager-debug
          path: manager/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
