name: Build Manager (Android)

on:
  push:
    branches: [main]
    paths:
      - 'manager/android/**'
      - '.github/workflows/build-manager-android.yml'
  pull_request:
    paths:
      - 'manager/android/**'
      - '.github/workflows/build-manager-android.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            manager/android/**/*.gradle.kts
            manager/android/gradle/libs.versions.toml

      - name: Compute version code
        id: code
        run: |
          BASE=$(cat version-code-base.txt)
          COUNT=$(curl -fsS -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=1" | jq -r '.total_count')
          # Android 要求 versionCode >= 1，所以计数从 1 开始。
          CODE=$((COUNT - BASE))
          if [ "$CODE" -lt 1 ]; then CODE=1; fi
          echo "versionCode=${CODE}"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"

      - name: Configure Android SDK
        run: |
          # 运行器自带 SDK；不用 setup-android，它会去装已下架的 'tools' 包。
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMGR" --licenses > /dev/null || true
          # API 37 起 SDK 平台按 major.minor 命名；项目用 37.1（37.2 仍是 beta）。
          "$SDKMGR" --install "platforms;android-37.1" "build-tools;37.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew --no-daemon --stacktrace \
            -PversionCode="${{ steps.code.outputs.code }}" \
            assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-manager-debug
          path: manager/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
