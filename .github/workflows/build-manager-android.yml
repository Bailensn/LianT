name: Build Manager (Android)

# 注意：暂只支持手动触发。GitHub 托管运行器的 SDK 仓库目前最高到
# android-36，而 manager 的 compileSdk 是 37，自动触发会红。
# 等运行器提供 37（或决定降 compileSdk）后，再把 push/pull_request 加回来。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            manager/android/**/*.gradle.kts
            manager/android/gradle/libs.versions.toml

      - name: Configure Android SDK
        run: |
          # 运行器自带 SDK；不用 setup-android，它会去装已下架的 'tools' 包。
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMGR" --licenses > /dev/null || true
          # API 37 起 SDK 平台按 major.minor 命名：platforms;android-37.0。
          "$SDKMGR" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.22.1"
          # AGP 的 compileSdk = 37 会去找 platforms/android-37。
          ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-manager-debug
          path: manager/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
