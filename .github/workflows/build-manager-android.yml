name: Build Manager (Android)

on:
  push:
    paths:
      - 'manager/android/**'
      - '.github/workflows/build-manager-android.yml'
  pull_request:
    paths:
      - 'manager/android/**'
      - '.github/workflows/build-manager-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            manager/android/**/*.gradle.kts
            manager/android/gradle/libs.versions.toml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "ndk;30.0.16248370" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-manager-debug
          path: manager/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
