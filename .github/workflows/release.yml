name: Release

# 手动发布稳定版：Service tag v<version>，Manager tag manager-v<version>。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v），例如 1.0.0'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum
      - name: Build Service
        working-directory: service
        run: |
          set -euo pipefail
          version="v${{ inputs.version }}"
          mkdir -p ../dist
          ldflags="-s -w -X main.version=$version"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o ../dist/LianT-linux-amd64 ./cmd/liant
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$ldflags" -o ../dist/LianT-linux-arm64 ./cmd/liant
          cd ../dist && sha256sum * > SHA256SUMS.txt
      - name: Publish Service release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: LianT v${{ inputs.version }}
          prerelease: false
          files: dist/*
          fail_on_unmatched_files: true

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Pub get
        working-directory: manager
        run: flutter pub get
      - name: Configure release signing
        working-directory: manager/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 未配置，稳定版拒绝使用 debug 签名" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties
      - name: Build arm64 APK
        working-directory: manager
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/LianT-arm64.apk
      - name: Publish Manager release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: manager-v${{ inputs.version }}
          name: LianT Manager v${{ inputs.version }}
          prerelease: false
          files: /tmp/LianT-arm64.apk
          fail_on_unmatched_files: true
