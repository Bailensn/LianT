name: Publish image

# 每次 push 到 main 都构建并推送一个镜像：
#   ghcr.io/bailensn/liant:v1.0.0-Alpha-<7位哈希>
#   同时更新 ghcr.io/bailensn/liant:latest
#
# 不再创建 GitHub Release：产物只有一个多架构镜像。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute version
        id: meta
        run: |
          set -euo pipefail
          VERSION="v1.0.0-Alpha-$(git rev-parse --short=7 HEAD)"
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-(Alpha|Beta|RC[0-9]+)-[0-9a-f]{7}$'; then
            echo "版本格式异常：$VERSION" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/bailensn/liant:${{ steps.meta.outputs.version }}
            ghcr.io/bailensn/liant:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "已推送 ghcr.io/bailensn/liant:${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "已更新 ghcr.io/bailensn/liant:latest" >> "$GITHUB_STEP_SUMMARY"
