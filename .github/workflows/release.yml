name: Release (pre-release)

# push 到 main 自动发一个 pre-release，Service 与 Manager 产物放在同一个 release：
#   v1.0.0-Alpha-<7位哈希>
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '可选：重发某个已存在的 tag；留空则按当前提交自动生成'
        required: false

permissions:
  contents: write

jobs:
  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web console
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm run build
          rm -rf ../service/internal/webui/dist
          cp -r dist ../service/internal/webui/dist

      - name: Compute version
        id: meta
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.0-Alpha-$(git rev-parse --short=7 HEAD)"
          fi
          VERSION="${TAG}"
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-(Alpha|Beta|RC[0-9]+)-[0-9a-f]{6,7}$'; then
            echo "版本格式应为 v<主>.<次>.<修>-<Alpha|Beta|RCn>-<6或7位哈希>，得到：$VERSION" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install NDK (android 目标需要 cgo)
        run: |
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "ndk;30.0.16248370"

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p ../dist
          VERSION="${{ steps.meta.outputs.version }}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          NDK="$ANDROID_HOME/ndk/30.0.16248370"
          CC_ANDROID="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          build() {
            GOOS=$1 GOARCH=$2 SUFFIX=$3
            if [ "$GOOS" = "android" ]; then
              CGO_ENABLED=1 GOOS=$GOOS GOARCH=$GOARCH CC="$CC_ANDROID" \
                go build -trimpath -ldflags="$LDFLAGS" \
                -o "../dist/LianT-Service-${GOOS}-${GOARCH}${SUFFIX}" ./cmd/liant
            else
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
                go build -trimpath -ldflags="$LDFLAGS" \
                -o "../dist/LianT-Service-${GOOS}-${GOARCH}${SUFFIX}" ./cmd/liant
            fi
          }
          build linux amd64 ""
          build linux arm64 ""
          build windows amd64 ".exe"
          build darwin arm64 ""
          build android arm64 ""
          cd ../dist && sha256sum * > SHA256SUMS.txt && ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: service-dist
          path: dist/*


  image:
    needs: [service]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/bailensn/liant:${{ needs.service.outputs.version }}
            ghcr.io/bailensn/liant:latest

  publish:
    needs: [service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.service.outputs.tag }}
          name: LianT ${{ needs.service.outputs.version }}
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: true
