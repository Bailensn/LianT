name: Release (pre-release)

# push 到 main 自动发一个 pre-release，Service 与 Manager 产物放在同一个 release：
#   v1.0.0-Alpha-<7位哈希>
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '可选：重发某个已存在的 tag；留空则按当前提交自动生成'
        required: false

permissions:
  contents: write

jobs:
  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum

      - name: Compute version
        id: meta
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.0-Alpha-$(git rev-parse --short=7 HEAD)"
          fi
          VERSION="${TAG}"
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-(Alpha|Beta|RC[0-9]+)-[0-9a-f]{6,7}$'; then
            echo "版本格式应为 v<主>.<次>.<修>-<Alpha|Beta|RCn>-<6或7位哈希>，得到：$VERSION" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install NDK (android 目标需要 cgo)
        run: |
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "ndk;30.0.16248370"

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p ../dist
          VERSION="${{ steps.meta.outputs.version }}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          NDK="$ANDROID_HOME/ndk/30.0.16248370"
          CC_ANDROID="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          build() {
            GOOS=$1 GOARCH=$2 SUFFIX=$3
            if [ "$GOOS" = "android" ]; then
              CGO_ENABLED=1 GOOS=$GOOS GOARCH=$GOARCH CC="$CC_ANDROID" \
                go build -trimpath -ldflags="$LDFLAGS" \
                -o "../dist/LianT-Service-${GOOS}-${GOARCH}${SUFFIX}" ./cmd/liant
            else
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
                go build -trimpath -ldflags="$LDFLAGS" \
                -o "../dist/LianT-Service-${GOOS}-${GOARCH}${SUFFIX}" ./cmd/liant
            fi
          }
          build linux amd64 ""
          build linux arm64 ""
          build windows amd64 ".exe"
          build darwin arm64 ""
          build android arm64 ""
          cd ../dist && sha256sum * > SHA256SUMS.txt && ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: service-dist
          path: dist/*

  manager:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: manager/android
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            manager/android/**/*.gradle.kts
            manager/android/gradle/libs.versions.toml

      - name: Compute version
        id: meta
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.0-Alpha-$(git rev-parse --short=7 HEAD)"
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Compute version code
        id: code
        run: |
          BASE=$(cat version-code-base.txt)
          COUNT=$(curl -fsS -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=1" | jq -r '.total_count')
          CODE=$((COUNT - BASE))
          if [ "$CODE" -lt 1 ]; then CODE=1; fi
          echo "versionCode=${CODE}"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"

      - name: Configure Android SDK
        run: |
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platforms;android-37.1" "build-tools;37.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -PversionName="${{ steps.meta.outputs.version }}" \
            -PversionCode="${{ steps.code.outputs.code }}" \
            assembleDebug

      - name: Collect APK
        run: |
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "../../dist/LianT-manager-${{ steps.meta.outputs.version }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: manager-dist
          path: dist/*

  publish:
    needs: [service, manager]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.service.outputs.tag }}
          name: LianT ${{ needs.service.outputs.version }}
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: true
