name: Release

# 手动发布稳定版：**一个 Release** 同时包含 Service 二进制与 Manager APK，
# tag 是 v<version>（不再单独发 manager-v<version>）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v），例如 1.0.0'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # 版本号只有一个来源：manager/app/build.gradle.kts。输入值必须与它一致，
      # 否则发出来的 APK 和 tag 对不上（安装后覆盖不上、用户也说不清装的是哪版）。
      - name: Check version
        id: version
        working-directory: manager
        env:
          WANT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          name="$(awk -F'"' '/^val liantVersionName/{print $2; exit}' app/build.gradle.kts)"
          code="$(awk -F'= ' '/^val liantVersionCode/{print $2; exit}' app/build.gradle.kts)"
          if [ "$name" != "$WANT" ]; then
            echo "manager/app/build.gradle.kts 的版本是 $name，输入是 $WANT；先改版本号再发版" >&2
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum

      - name: Build Service
        working-directory: service
        run: |
          set -euo pipefail
          version="v${{ inputs.version }}"
          mkdir -p ../dist
          ldflags="-s -w -X main.version=$version"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o ../dist/LianT-linux-amd64 ./cmd/liant
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$ldflags" -o ../dist/LianT-linux-arm64 ./cmd/liant

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure release signing
        working-directory: manager
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 未配置，稳定版拒绝使用 debug 签名" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties

      - name: Build Manager APK
        working-directory: manager
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk \
             "../dist/LianT-android-arm64.apk"

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: LianT v${{ inputs.version }}
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            LianT v${{ inputs.version }}（versionCode ${{ steps.version.outputs.code }}）

            - `LianT-linux-amd64` / `LianT-linux-arm64`：Service 服务端
            - `LianT-android-arm64.apk`：Manager 客户端（正式签名，仅 arm64）
            - `SHA256SUMS.txt`：校验和

            部署见 docs/DEPLOY.md。
          files: |
            dist/LianT-linux-amd64
            dist/LianT-linux-arm64
            dist/LianT-android-arm64.apk
            dist/SHA256SUMS.txt
