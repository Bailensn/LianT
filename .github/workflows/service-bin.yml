name: Service binaries

# 不打包 Docker，直接出可执行文件：拷到 /opt/liant 就能跑。
on:
  push:
    paths:
      - 'service/**'
      - '.github/workflows/service-bin.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum

      - name: Build
        working-directory: service
        run: |
          set -euo pipefail
          mkdir -p ../dist
          VERSION="v1.0.0-Alpha-$(git rev-parse --short=7 HEAD)"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          # 网页管理端已经不用了，二进制里只打包 API 与静态占位
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o ../dist/LianT-linux-amd64 ./cmd/liant
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o ../dist/LianT-linux-arm64 ./cmd/liant
          cd ../dist && sha256sum * > SHA256SUMS.txt && ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: LianT-service
          path: dist/*
