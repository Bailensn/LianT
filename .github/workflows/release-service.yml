name: Release Service (pre-release)

# tag 约定：service-v<版本>-<7位哈希>（兼容早期的 6 位），例如 service-v1.0.0-a1b2c3
on:
  push:
    tags:
      - 'service-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（例如 service-v1.0.0-a1b2c3）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum

      - name: Compute version
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#service-}"
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-(Alpha|Beta|RC[0-9]+)-[0-9a-f]{6,7}$'; then
            echo "版本格式应为 v<主>.<次>.<修>-<Alpha|Beta|RCn>-<7位哈希>，得到：$VERSION" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install NDK (android 目标需要 cgo)
        run: |
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "ndk;30.0.16248370"

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p ../dist
          VERSION="${{ steps.meta.outputs.version }}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          NDK="$ANDROID_HOME/ndk/30.0.16248370"
          CC_ANDROID="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          build() {
            GOOS=$1 GOARCH=$2 SUFFIX=$3
            if [ "$GOOS" = "android" ]; then
              # cgo：Android 上纯 Go 解析器读不到 netd，DNS 会失败。
              CGO_ENABLED=1 GOOS=$GOOS GOARCH=$GOARCH CC="$CC_ANDROID" \
                go build -trimpath -ldflags="$LDFLAGS" \
                -o "../dist/LianT-Service-${GOOS}-${GOARCH}${SUFFIX}" ./cmd/liant
            else
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
                go build -trimpath -ldflags="$LDFLAGS" \
                -o "../dist/LianT-Service-${GOOS}-${GOARCH}${SUFFIX}" ./cmd/liant
            fi
          }
          build linux amd64 ""
          build linux arm64 ""
          build windows amd64 ".exe"
          build darwin arm64 ""
          build android arm64 ""
          cd ../dist && sha256sum * > SHA256SUMS.txt && ls -l

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: LianT Service ${{ steps.meta.outputs.version }}
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: true
