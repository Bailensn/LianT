name: Build Service

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        type: choice
        options:
          - debug
          - release
        default: release
      linux_amd64:
        description: 'Linux amd64'
        type: boolean
        default: false
      linux_arm64:
        description: 'Linux arm64'
        type: boolean
        default: false
      windows_amd64:
        description: 'Windows amd64 (.exe)'
        type: boolean
        default: false
      darwin_arm64:
        description: 'macOS arm64 (Apple Silicon)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ============================================================
  # Linux amd64
  # ============================================================
  linux-amd64:
    if: ${{ inputs.linux_amd64 }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    env:
      BUILD_MODE: ${{ inputs.build_mode }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: service/go.sum
      - name: Build
        run: |
          if [ "$BUILD_MODE" = "release" ]; then
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -ldflags="-s -w" -trimpath -o service-linux-amd64 .
          else
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -o service-linux-amd64 .
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: service-linux-amd64
          path: service/service-linux-amd64

  # ============================================================
  # Linux arm64
  # ============================================================
  linux-arm64:
    if: ${{ inputs.linux_arm64 }}
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: service
    env:
      BUILD_MODE: ${{ inputs.build_mode }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: service/go.sum
      - name: Build
        run: |
          if [ "$BUILD_MODE" = "release" ]; then
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
              go build -ldflags="-s -w" -trimpath -o service-linux-arm64 .
          else
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
              go build -o service-linux-arm64 .
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: service-linux-arm64
          path: service/service-linux-arm64

  # ============================================================
  # Windows amd64
  # ============================================================
  windows-amd64:
    if: ${{ inputs.windows_amd64 }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: service
    env:
      BUILD_MODE: ${{ inputs.build_mode }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: service/go.sum
      - name: Build
        shell: pwsh
        run: |
          if ($env:BUILD_MODE -eq "release") {
            go build -ldflags="-s -w" -trimpath -o service-windows-amd64.exe .
          } else {
            go build -o service-windows-amd64.exe .
          }
      - uses: actions/upload-artifact@v6
        with:
          name: service-windows-amd64
          path: service/service-windows-amd64.exe

  # ============================================================
  # macOS arm64
  # ============================================================
  darwin-arm64:
    if: ${{ inputs.darwin_arm64 }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: service
    env:
      BUILD_MODE: ${{ inputs.build_mode }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: service/go.sum
      - name: Build
        run: |
          if [ "$BUILD_MODE" = "release" ]; then
            CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
              go build -ldflags="-s -w" -trimpath -o service-darwin-arm64 .
          else
            CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
              go build -o service-darwin-arm64 .
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: service-darwin-arm64
          path: service/service-darwin-arm64
