name: Build Service

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        type: choice
        options:
          - debug
          - release
        default: release
      linux_amd64:
        description: 'Linux amd64'
        type: boolean
        default: false
      linux_arm64:
        description: 'Linux arm64'
        type: boolean
        default: false
      windows_amd64:
        description: 'Windows amd64 (.exe)'
        type: boolean
        default: false
      darwin_amd64:
        description: 'macOS amd64 (Intel)'
        type: boolean
        default: false
      darwin_arm64:
        description: 'macOS arm64 (Apple Silicon)'
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: service

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IS_TAG_PUSH: ${{ github.event_name == 'push' }}
      BUILD_MODE: ${{ github.event_name == 'push' && 'release' || inputs.build_mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: service/go.sum

      # 仅在 release 模式安装 garble（手动触发时根据输入，tag 触发时总是 release）
      - name: Install garble (release mode)
        if: env.BUILD_MODE == 'release'
        run: go install mvdan.cc/garble@latest

      # ---------- Linux amd64 ----------
      - name: Build Linux amd64 (${{ env.BUILD_MODE }})
        if: ${{ env.IS_TAG_PUSH || inputs.linux_amd64 }}
        run: |
          if [ "$BUILD_MODE" = "release" ]; then
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              garble build -ldflags="-s -w" -trimpath -o service-linux-amd64 .
          else
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -o service-linux-amd64 .
          fi
      - name: Upload Linux amd64
        if: ${{ env.IS_TAG_PUSH || inputs.linux_amd64 }}
        uses: actions/upload-artifact@v4
        with:
          name: service-linux-amd64
          path: service/service-linux-amd64

      # ---------- Linux arm64 ----------
      - name: Build Linux arm64 (${{ env.BUILD_MODE }})
        if: ${{ env.IS_TAG_PUSH || inputs.linux_arm64 }}
        run: |
          if [ "$BUILD_MODE" = "release" ]; then
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
              garble build -ldflags="-s -w" -trimpath -o service-linux-arm64 .
          else
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
              go build -o service-linux-arm64 .
          fi
      - name: Upload Linux arm64
        if: ${{ env.IS_TAG_PUSH || inputs.linux_arm64 }}
        uses: actions/upload-artifact@v4
        with:
          name: service-linux-arm64
          path: service/service-linux-arm64

      # ---------- Windows amd64 ----------
      - name: Build Windows amd64 (${{ env.BUILD_MODE }})
        if: ${{ env.IS_TAG_PUSH || inputs.windows_amd64 }}
        run: |
          if [ "$BUILD_MODE" = "release" ]; then
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
              garble build -ldflags="-s -w" -trimpath -o service-windows-amd64.exe .
          else
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
              go build -o service-windows-amd64.exe .
          fi
      - name: Upload Windows amd64
        if: ${{ env.IS_TAG_PUSH || inputs.windows_amd64 }}
        uses: actions/upload-artifact@v4
        with:
          name: service-windows-amd64
          path: service/service-windows-amd64.exe

      # ---------- macOS amd64 ----------
      - name: Build macOS amd64 (${{ env.BUILD_MODE }})
        if: ${{ env.IS_TAG_PUSH || inputs.darwin_amd64 }}
        run: |
          if [ "$BUILD_MODE" = "release" ]; then
            CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
              garble build -ldflags="-s -w" -trimpath -o service-darwin-amd64 .
          else
            CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
              go build -o service-darwin-amd64 .
          fi
      - name: Upload macOS amd64
        if: ${{ env.IS_TAG_PUSH || inputs.darwin_amd64 }}
        uses: actions/upload-artifact@v4
        with:
          name: service-darwin-amd64
          path: service/service-darwin-amd64

      # ---------- macOS arm64 ----------
      - name: Build macOS arm64 (${{ env.BUILD_MODE }})
        if: ${{ env.IS_TAG_PUSH || inputs.darwin_arm64 }}
        run: |
          if [ "$BUILD_MODE" = "release" ]; then
            CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
              garble build -ldflags="-s -w" -trimpath -o service-darwin-arm64 .
          else
            CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
              go build -o service-darwin-arm64 .
          fi
      - name: Upload macOS arm64
        if: ${{ env.IS_TAG_PUSH || inputs.darwin_arm64 }}
        uses: actions/upload-artifact@v4
        with:
          name: service-darwin-arm64
          path: service/service-darwin-arm64

      # ---------- Release ----------
      - name: Create Release
        if: env.IS_TAG_PUSH
        uses: softprops/action-gh-release@v2
        with:
          files: |
            service/service-linux-amd64
            service/service-linux-arm64
            service/service-windows-amd64.exe
            service/service-darwin-amd64
            service/service-darwin-arm64
