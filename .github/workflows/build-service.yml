name: Build Service


on:

  # 手动构建
  workflow_dispatch:

    inputs:

      mode:
        description: "Build mode"
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug


      linux_amd64:
        description: "Build Linux amd64"
        required: false
        type: boolean
        default: false


      linux_arm64:
        description: "Build Linux arm64"
        required: false
        type: boolean
        default: false


      windows_amd64:
        description: "Build Windows amd64"
        required: false
        type: boolean
        default: false


      darwin_amd64:
        description: "Build macOS amd64"
        required: false
        type: boolean
        default: false


      darwin_arm64:
        description: "Build macOS arm64"
        required: false
        type: boolean
        default: false


  # Tag 自动发布
  push:
    tags:
      - "v*"



defaults:
  run:
    working-directory: service



jobs:

  build:

    name: Build Service

    runs-on: ubuntu-latest


    strategy:

      fail-fast: false

      matrix:

        include:

          - name: linux-amd64
            os: linux
            arch: amd64
            enabled: linux_amd64


          - name: linux-arm64
            os: linux
            arch: arm64
            enabled: linux_arm64


          - name: windows-amd64
            os: windows
            arch: amd64
            enabled: windows_amd64


          - name: darwin-amd64
            os: darwin
            arch: amd64
            enabled: darwin_amd64


          - name: darwin-arm64
            os: darwin
            arch: arm64
            enabled: darwin_arm64



    # 手动：
    #   根据 checkbox
    #
    # Tag：
    #   全部构建
    if: |
      github.event_name == 'push' ||
      github.event.inputs[matrix.enabled] == 'true'



    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Setup Go
        uses: actions/setup-go@v5

        with:

          go-version: stable

          # 必须对应 service/go.sum
          cache-dependency-path: service/go.sum



      - name: Download dependencies
        run: go mod download



      - name: Build

        shell: bash

        run: |

          mkdir -p output


          # Tag 永远 release
          if [ "${{ github.event_name }}" = "push" ]; then

            FLAGS="-ldflags=-s -w -trimpath"

          elif [ "${{ github.event.inputs.mode }}" = "release" ]; then

            FLAGS="-ldflags=-s -w -trimpath"

          else

            FLAGS=""

          fi



          export CGO_ENABLED=0
          export GOOS=${{ matrix.os }}
          export GOARCH=${{ matrix.arch }}



          NAME="service-${{ matrix.name }}"


          EXT=""

          if [ "${{ matrix.os }}" = "windows" ]; then

            EXT=".exe"

          fi



          go build \
            $FLAGS \
            -o "output/${NAME}${EXT}" \
            .



      - name: Upload artifact

        uses: actions/upload-artifact@v4

        with:

          name: service-${{ matrix.name }}

          path: service/output/*





  release:


    # 只有 Tag 才创建 Release
    if: github.event_name == 'push'


    needs: build


    runs-on: ubuntu-latest



    steps:


      - name: Download all artifacts

        uses: actions/download-artifact@v4

        with:

          path: release



      - name: Create GitHub Release

        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ github.ref_name }}

          name: Service ${{ github.ref_name }}

          files: |

            release/**/*