<!DOCTYPE html>
<html>
<head>
  <base href="/LianT/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <title>LianT</title>
</head>
<body>
  <script>
    // 应用内浏览器等没有 WebGL 的 WebView，可以用 ?cpu=1 强制 CanvasKit 走 CPU 渲染。
    // 只用于预览与截图自检；正常访问仍然使用 WebGL。
    if (location.search.indexOf('cpu=1') >= 0) {
      window.flutterConfiguration = { renderer: 'canvaskit', canvasKitForceCpuOnly: true };
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
