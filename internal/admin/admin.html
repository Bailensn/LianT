<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="LianT 管理后台：Telegram 群管理、回复规则、违禁词与审计。">
<title>LianT · 管理后台</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0b0f14; --bg-2:#0f1520; --panel:#121a26; --panel-2:#16202e;
  --text:#e8eef8; --text-2:#a7b4c8; --text-3:#6f7f96;
  --border:#233044; --border-2:#2e4058;
  --accent:#4cc9f0; --accent-2:#2ea8d6; --accent-soft:rgba(76,201,240,.12);
  --good:#41d392; --warn:#f4b860; --bad:#ff6b7a;
  --radius:14px; --radius-sm:10px;
  --shadow:0 12px 34px rgba(0,0,0,.28);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 700px at 85% -10%, rgba(76,201,240,.10), transparent 60%),var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:20px 14px;border-right:1px solid var(--border);background:linear-gradient(180deg,rgba(18,26,38,.9),rgba(11,15,20,.96))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px}
.brand-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#7b61ff);color:#061018;font-weight:800;font-size:17px}
.brand-name{font-weight:750;letter-spacing:.02em;font-size:16px}
.brand-sub{display:block;color:var(--text-3);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;color:var(--text-2);font-weight:550;border:1px solid transparent}
nav a:hover{background:var(--panel);color:var(--text)}
nav a.on{background:var(--accent-soft);border-color:rgba(76,201,240,.22);color:var(--accent)}
nav .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--border);border-radius:12px;color:var(--text-3);font-size:12px}
.side-foot strong{color:var(--text-2);font-weight:600}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:26px 30px 18px;border-bottom:1px solid var(--border)}
.top h1{margin:0;font-size:22px;letter-spacing:-.01em}
.top p{margin:5px 0 0;color:var(--text-3);font-size:12.5px}
.view{padding:22px 30px 60px;display:flex;flex-direction:column;gap:18px;max-width:1400px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{color:var(--text-3);font-size:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
.card-head h2{margin:0;font-size:14.5px;font-weight:650}
.card-head p{margin:3px 0 0;color:var(--text-3);font-size:12px}
.card-body{padding:16px 18px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:9px;border:1px solid var(--border-2);background:var(--panel-2);color:var(--text);cursor:pointer;font-weight:550;font-size:13px;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#061018;font-weight:700}
.btn.primary:hover{background:#6bd6f7;color:#061018}
.btn.danger{border-color:rgba(255,107,122,.35);color:var(--bad)}
.btn.danger:hover{background:rgba(255,107,122,.1);border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn.ghost{background:transparent}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--text-3);font-size:11.5px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
td{font-size:13px}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.02)}
.table-wrap{overflow:auto}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--border);font-size:11px;color:var(--text-2);white-space:nowrap}
.pill.ok{color:var(--good);border-color:rgba(65,211,146,.25);background:rgba(65,211,146,.08)}
.pill.warn{color:var(--warn);border-color:rgba(244,184,96,.25);background:rgba(244,184,96,.08)}
.pill.bad{color:var(--bad);border-color:rgba(255,107,122,.25);background:rgba(255,107,122,.08)}
.mono{font-family:var(--mono);font-size:11.5px;color:var(--text-3);word-break:break-all}
.muted{color:var(--text-3)}
.empty{padding:26px;text-align:center;color:var(--text-3)}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text-2)}
label.field input,label.field select,label.field textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border-2);background:var(--bg-2);outline:none}
label.field textarea{min-height:86px;resize:vertical}
label.field input:focus,label.field select:focus,label.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.check{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:12.5px;padding-top:20px}
.hint{color:var(--text-3);font-size:11.5px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.modal{position:fixed;inset:0;background:rgba(4,8,12,.72);display:grid;place-items:center;padding:20px;z-index:50;backdrop-filter:blur(4px)}
.modal-card{width:min(640px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--border-2);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:1}
.modal-head h2{margin:0;font-size:15px}
.modal-body{padding:18px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--panel-2);border:1px solid var(--border-2);border-left:3px solid var(--accent);border-radius:10px;padding:11px 14px;box-shadow:var(--shadow);max-width:360px;z-index:80;font-size:13px}
.toast.bad{border-left-color:var(--bad)}
.auth{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100;padding:20px}
.auth-card{width:min(400px,100%);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
.auth-card h1{margin:0 0 6px;font-size:21px}
.auth-card p{margin:0 0 18px;color:var(--text-3);font-size:12.5px}
.auth-card input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border-2);background:var(--bg-2);margin-bottom:10px}
.msg-list{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow:auto}
.msg{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg-2)}
.msg .who{min-width:110px;color:var(--text-2);font-size:12px;font-weight:600}
.msg .body{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;font-size:12.8px}
.msg .meta{color:var(--text-3);font-size:10.5px;margin-top:4px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--text-3)}
.kv dd{margin:0;word-break:break-all}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;overflow:auto;padding:10px}
  .brand{padding:0;flex:none}.brand-sub{display:none}
  nav{flex-direction:row;gap:4px}
  nav a{padding:7px 10px;white-space:nowrap;font-size:12px}
  .side-foot{display:none}
  .top{padding:18px 16px 12px}.view{padding:16px 16px 40px}
  .top h1{font-size:18px}
}
</style>
</head>
<body>
<div id="auth" class="auth hidden">
  <div class="auth-card">
    <h1>LianT</h1>
    <p>输入管理 token（`LianT admin` 可查看，或 LIANT_ADMIN_TOKEN）。</p>
    <input id="auth-token" type="password" placeholder="admin token" autocomplete="current-password">
    <button class="btn primary" id="auth-go" style="width:100%">进入管理后台</button>
    <p class="hint" id="auth-hint" style="margin-top:12px">token 会写进 cookie，之后刷新不用再输入。</p>
  </div>
</div>

<div class="layout">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">L</div>
      <div><div class="brand-name">LianT</div><span class="brand-sub">Telegram Bot</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div><strong id="foot-bot">未连接</strong></div>
      <div id="foot-api">—</div>
      <button class="btn sm ghost" id="logout">清除 token</button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h1 id="page-title">总览</h1><p id="page-desc">机器人状态与运营数据</p></div>
      <div class="toolbar"><button class="btn ghost" id="refresh">刷新</button></div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h2 id="modal-title">编辑</h2><button class="btn sm ghost" id="modal-close">关闭</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
const BASE = "__BASE_PATH__";
const NAV = [
  ["overview","总览"],["chats","群组"],["messages","消息"],["rules","回复规则"],
  ["words","违禁词"],["admins","管理员"],["mutes","禁言"],["blacklist","黑名单"],
  ["audit","操作日志"],["settings","设置"],["botapi","Bot API"],["help","帮助"]
];
const state = {
  active:"overview", chats:[], rules:[], words:[], admins:[], mutes:[], blacklist:[],
  audit:[], settings:{}, overview:null, selectedChat:"", messages:[]
};

// ---------- 基础 ----------
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function $(s,r=document){return r.querySelector(s);}
function $$(s,r=document){return Array.from(r.querySelectorAll(s));}
function fmtTime(v){
  if(!v) return "—";
  const d = new Date(v);
  return isNaN(d.getTime()) ? v : d.toLocaleString("zh-CN",{hour12:false});
}
let toastTimer=null;
function toast(msg,bad=false){
  const el=$("#toast"); el.textContent=msg; el.classList.toggle("bad",!!bad); el.classList.remove("hidden");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.add("hidden"),3800);
}
async function api(path,opt={}){
  const res = await fetch(BASE+"/api/"+path, Object.assign({
    credentials:"same-origin",
    headers:{"Content-Type":"application/json"}
  },opt));
  let body=null;
  try{ body=await res.json(); }catch(e){ throw new Error("HTTP "+res.status+"（响应不是 JSON）"); }
  if(!body || body.ok!==true){
    const err=new Error((body&&body.error)||("HTTP "+res.status));
    err.status=res.status; throw err;
  }
  return body.data;
}
function get(path,params){ const q=params?("?"+new URLSearchParams(params)):""; return api(path+q); }
function post(path,data){ return api(path,{method:"POST",body:JSON.stringify(data)}); }
function del(path,params){ return api(path+"?"+new URLSearchParams(params),{method:"DELETE"}); }
function chatName(id){
  const c=state.chats.find(x=>String(x.chat_id)===String(id));
  return c ? (c.name||c.chat_id) : (id||"全局");
}
function chatOptions(sel="",empty="全部会话"){
  let out=`<option value="">${esc(empty)}</option>`;
  for(const c of state.chats) out+=`<option value="${esc(c.chat_id)}"${String(c.chat_id)===String(sel)?" selected":""}>${esc(c.name||c.chat_id)}</option>`;
  return out;
}
function pill(on,onText="开",offText="关"){
  return `<span class="pill ${on?"ok":""}">${on?onText:offText}</span>`;
}

// ---------- 导航 ----------
function buildNav(){
  $("#nav").innerHTML = NAV.map(([id,label])=>`<a href="#${id}" class="${state.active===id?"on":""}"><span class="dot"></span>${label}</a>`).join("");
}
function titleOf(id){ const n=NAV.find(x=>x[0]===id); return n?n[1]:"总览"; }
function descOf(id){
  return ({overview:"机器人状态与运营数据",chats:"已登记的群组 / 频道",messages:"最近消息与主动发送",
    rules:"按匹配方式自动回复",words:"命中后的撤回/禁言/封禁",admins:"谁可以使用管理指令",
    mutes:"禁言记录与解除",blacklist:"黑名单成员",audit:"所有处置与后台操作",settings:"全局开关与欢迎语",
    botapi:"直接调用 Telegram Bot API 的任意方法",help:"群内指令与使用说明"})[id]||"";
}

// ---------- 加载 ----------
async function load(){
  const id=state.active;
  $("#page-title").textContent=titleOf(id);
  $("#page-desc").textContent=descOf(id);
  $("#view").innerHTML='<div class="empty">加载中…</div>';
  try{
    if(id==="overview"){ state.overview=await get("overview"); renderOverview(); }
    else if(id==="chats"){ state.chats=await get("chats"); renderChats(); }
    else if(id==="messages"){ await ensureChats(); if(!state.selectedChat && state.chats[0]) state.selectedChat=String(state.chats[0].chat_id); await loadMessages(); }
    else if(id==="rules"){ state.rules=await get("rules"); renderRules(); }
    else if(id==="words"){ state.words=await get("words"); renderWords(); }
    else if(id==="admins"){ await ensureChats(); state.admins=await get("admins"); renderAdmins(); }
    else if(id==="mutes"){ await ensureChats(); state.mutes=await get("mutes?all=1"); renderMutes(); }
    else if(id==="blacklist"){ await ensureChats(); state.blacklist=await get("blacklist"); renderBlacklist(); }
    else if(id==="audit"){ await ensureChats(); state.audit=await get("audit?limit=300"); renderAudit(); }
    else if(id==="settings"){ state.settings=await get("settings"); renderSettings(); }
    else if(id==="botapi"){ renderBotAPI(); }
    else if(id==="help"){ state.overview=state.overview||await get("overview"); renderHelp(); }
    renderFoot();
  }catch(e){
    if(e.status===401){ showAuth(); return; }
    $("#view").innerHTML=`<div class="card"><div class="card-body"><b>加载失败：</b>${esc(e.message)}</div></div>`;
  }
}
async function ensureChats(){ if(!state.chats.length) state.chats=await get("chats"); }

// ---------- 总览 ----------
function renderOverview(){
  const o=state.overview||{}, b=o.bot||{}, c=o.counts||{};
  const stateBad=/在线/.test(b.bot_state||"")?"ok":(/错误|失败/.test(b.bot_state||"")?"bad":"warn");
  $("#view").innerHTML=`
    <div class="stats">
      <div class="stat"><b>${esc(b.bot_username||"—")}</b><span>机器人</span></div>
      <div class="stat"><b>${esc(b.bot_state||"未知")}</b><span>连接状态</span></div>
      <div class="stat"><b>${esc(b.uptime||"—")}</b><span>运行时长</span></div>
      <div class="stat"><b>${esc(b.messages||"0")}</b><span>已收消息</span></div>
      <div class="stat"><b>${esc(c.chats||0)}</b><span>会话</span></div>
      <div class="stat"><b>${esc(c.rules||0)}</b><span>回复规则</span></div>
      <div class="stat"><b>${esc(c.words||0)}</b><span>违禁词</span></div>
      <div class="stat"><b>${esc(c.mutes||0)}</b><span>禁言中</span></div>
    </div>
    <div class="card"><div class="card-head"><div><h2>运行信息</h2><p>Token 来源：${esc(o.token_source||"—")}</p></div><span class="pill ${stateBad}">${esc(b.bot_state||"未知")}</span></div>
      <div class="card-body"><dl class="kv">
        <dt>Telegram API</dt><dd class="mono">${esc(b.api_base||"—")}</dd>
        <dt>收消息方式</dt><dd>${esc(b.mode||"long-polling")}</dd>
        <dt>Bot ID</dt><dd class="mono">${esc(b.bot_id||"—")}</dd>
        <dt>最近消息</dt><dd>${esc(fmtTime(b.last_message_at))}</dd>
        <dt>重连次数</dt><dd>${esc(b.reconnects||"0")}</dd>
        <dt>数据库</dt><dd class="mono">${esc(o.db_file||"—")}</dd>
        <dt>管理端</dt><dd class="mono">${esc(o.admin_url||"—")}</dd>
        ${b.last_error?`<dt>最近错误</dt><dd style="color:var(--bad)">${esc(b.last_error)}</dd>`:""}
      </dl></div></div>
    <div class="card"><div class="card-head"><div><h2>最近操作</h2><p>最新的 20 条审计</p></div></div>
      <div class="table-wrap">${auditTable(o.recent||[],false)}</div></div>`;
}

// ---------- 群组 ----------
function renderChats(){
  const rows=state.chats.map(c=>`
    <tr>
      <td><b>${esc(c.name||"(未命名)")}</b><div class="mono">${esc(c.chat_id)}</div></td>
      <td>${pill(c.enabled,"启用","停用")} ${pill(c.bot_is_admin,"管理员","非管理员")}</td>
      <td>${pill(c.reply_all,"全部","仅@")} ${pill(c.commands_enabled,"指令","禁指令")}</td>
      <td class="muted">${esc(c.note||"")}</td>
      <td>${esc(fmtTime(c.updated_at))}</td>
      <td style="white-space:nowrap">
        <button class="btn sm" data-act="view-messages" data-id="${esc(c.chat_id)}">消息</button>
        <button class="btn sm" data-act="edit-chat" data-id="${esc(c.chat_id)}">编辑</button>
        <button class="btn sm danger" data-act="del-chat" data-id="${esc(c.chat_id)}">删除</button>
      </td>
    </tr>`).join("");
  $("#view").innerHTML=`
    <div class="card"><div class="card-head"><div><h2>会话列表</h2><p>机器人收到消息后会自动登记；群 ID 通常是负数（超级群以 -100 开头）。</p></div>
      <div class="toolbar"><button class="btn" data-act="sync-chats">从 Telegram 同步</button><button class="btn primary" data-act="add-chat">添加会话</button></div></div>
      <div class="table-wrap">${rows?`<table><thead><tr><th>会话</th><th>状态</th><th>策略</th><th>备注</th><th>更新</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">还没有会话：把机器人拉进群，或点「添加会话」手动填群 ID。</div>'}</div></div>`;
}
function chatForm(c={}){
  const isNew=!c.chat_id;
  return `<form id="form-chat" class="grid-form">
    <label class="field"><span>chat_id *</span><input name="chat_id" value="${esc(c.chat_id||"")}" ${isNew?"":"readonly"} placeholder="-1001234567890"></label>
    <label class="field"><span>名称</span><input name="name" value="${esc(c.name||"")}" placeholder="群名称"></label>
    <label class="field"><span>备注</span><input name="note" value="${esc(c.note||"")}"></label>
    <label class="check"><input type="checkbox" name="enabled" ${c.enabled!==false?"checked":""}> 启用该会话</label>
    <label class="check"><input type="checkbox" name="reply_all" ${c.reply_all!==false?"checked":""}> 回复所有消息（关闭则只回 @机器人 / 回复机器人）</label>
    <label class="check"><input type="checkbox" name="commands_enabled" ${c.commands_enabled!==false?"checked":""}> 允许群内管理指令</label>
    <label class="check"><input type="checkbox" name="group_admin_can_command" ${c.group_admin_can_command!==false?"checked":""}> Telegram 群管理员可直接用指令</label>
    <div class="form-actions"><button type="submit" class="btn primary">保存</button></div>
  </form>`;
}

// ---------- 消息 ----------
async function loadMessages(){
  if(!state.selectedChat){ state.messages=[]; renderMessages(); return; }
  try{ state.messages=await get("messages",{chat_id:state.selectedChat}); }
  catch(e){ state.messages=[]; if(e.status!==401) toast(e.message,true); }
  renderMessages();
}
function renderMessages(){

          <label class="field" style="grid-column:1/-1"><span>参数 JSON</span><textarea id="api-params" style="min-height:140px" placeholder='{"chat_id":"-1001234567890"}'>{}</textarea></label>
        </div>
        <div class="form-actions"><button class="btn primary" type="submit">调用</button></div>
      </form>
      <pre id="api-result" style="white-space:pre-wrap;word-break:break-all;font-family:var(--mono);font-size:12px;color:var(--text-2);background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:12px;min-height:60px;margin:14px 0 0">结果会显示在这里</pre></div></div>
    <div class="card"><div class="card-head"><div><h2>常用方法</h2><p>点一下填入参数模板。</p></div></div>
      <div class="card-body toolbar">
        <button class="btn sm" data-api="getChat" data-params='{"chat_id":"-1001234567890"}'>getChat</button>
        <button class="btn sm" data-api="getChatAdministrators" data-params='{"chat_id":"-1001234567890"}'>getChatAdministrators</button>
        <button class="btn sm" data-api="getChatMemberCount" data-params='{"chat_id":"-1001234567890"}'>getChatMemberCount</button>
        <button class="btn sm" data-api="getWebhookInfo" data-params="{}">getWebhookInfo</button>
        <button class="btn sm" data-api="createChatInviteLink" data-params='{"chat_id":"-1001234567890","name":"LianT"}'>createChatInviteLink</button>
        <button class="btn sm" data-api="createForumTopic" data-params='{"chat_id":"-1001234567890","name":"公告"}'>createForumTopic</button>
        <button class="btn sm" data-api="setChatPermissions" data-params='{"chat_id":"-1001234567890","permissions":{"can_send_messages":true}}'>setChatPermissions</button>
        <button class="btn sm" data-api="getMyCommands" data-params="{}">getMyCommands</button>
      </div></div>
    <div class="card"><div class="card-head"><div><h2>上传本地文件并调用</h2><p>multipart/form-data，上限 32MB；文件字段名按方法填（sendPhoto=photo、sendDocument=document、createNewStickerSet=png_sticker 等）。</p></div></div>
      <div class="card-body"><form id="form-upload" class="grid-form">
        <label class="field"><span>方法名</span><input name="method" value="sendPhoto" placeholder="sendPhoto"></label>
        <label class="field"><span>文件字段名</span><input name="file_field" value="photo" placeholder="photo"></label>
        <label class="field" style="grid-column:1/-1"><span>其他参数 JSON</span><textarea name="params" placeholder='{"chat_id":"-1001234567890","caption":"hello"}'>{}</textarea></label>
        <label class="field" style="grid-column:1/-1"><span>选择文件</span><input type="file" name="file"></label>
        <div class="form-actions"><button class="btn primary" type="submit">上传并调用</button></div>
      </form>
      <pre id="upload-result" style="white-space:pre-wrap;word-break:break-all;font-family:var(--mono);font-size:12px;color:var(--text-2);background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:12px;min-height:50px;margin:14px 0 0">结果会显示在这里</pre></div></div>`;
  $("#form-botapi").onsubmit=async e=>{
    e.preventDefault();
    let params={};
    const raw=$("#api-params").value.trim();
    if(raw){
      try{ params=JSON.parse(raw); }catch(err){ toast("参数不是合法 JSON："+err.message,true); return; }
    }
    try{
      const r=await post("botapi",{method:$("#api-method").value.trim(),params});
      $("#api-result").textContent=JSON.stringify(r.result,null,2);
    }catch(err){ $("#api-result").textContent="调用失败："+err.message; toast(err.message,true); }

    $("#api-params").value=btn.dataset.params||"{}";
  });
  $("#form-upload").onsubmit=async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    try{
      const res=await fetch(BASE+"/api/upload",{method:"POST",body:fd,credentials:"same-origin"});
      const j=await res.json().catch(()=>({ok:false,error:"HTTP "+res.status}));
      if(!j.ok) throw new Error(j.error||"上传失败");
      $("#upload-result").textContent=JSON.stringify(j.data.result,null,2);
      toast("上传并调用成功");
    }catch(err){ $("#upload-result").textContent="调用失败："+err.message; toast(err.message,true); }
  };
}

// ---------- 帮助 ----------
function renderHelp(){
  const text=(state.overview&&state.overview.cmd_help)||"";
  $("#view").innerHTML=`
    <div class="card"><div class="card-head"><div><h2>群内指令</h2><p>中文指令和 /mute 这类斜杠命令都支持。</p></div></div>
      <div class="card-body"><pre style="white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;color:var(--text-2);margin:0">${esc(text)}</pre></div></div>
    <div class="card"><div class="card-head"><div><h2>Telegram 权限提示</h2></div></div>
      <div class="card-body muted" style="font-size:12.5px">
        1. 把机器人设为群管理员，并勾选「删除消息」「封禁用户」；否则撤回/禁言会失败。<br>
        2. 机器人只能撤回 48 小时内的消息；群成员消息需要机器人有删除权限。<br>
        3. Telegram 不提供普通成员列表，本地名册来自成员发言；按昵称找人前先让对方说句话。<br>
        4. 如果需要机器人看到群里全部消息，请在 @BotFather 关闭 privacy mode（/setprivacy）。<br>
        5. 网页后台默认只绑 127.0.0.1；远程访问请用 Nginx/Caddy 反代并加 HTTPS。<br>
        6. Webhook 模式：设 LIANT_WEBHOOK_URL（公网 HTTPS）与 LIANT_WEBHOOK_SECRET，本地监听 LIANT_WEBHOOK_LISTEN（默认 127.0.0.1:28743）。<br>
        7. 内联查询：在「设置」里填 inline_results（每行 标题|内容），在任意聊天输入 @机器人 关键词 即可。<br>
        8. 其他 Bot API 能力（媒体、投票、论坛话题、邀请链接、权限、贴纸、支付等）都能在「Bot API」页直接调用；需要本地文件的方法用下方「上传本地文件并调用」。
      </div></div>`;
}

// ---------- 渲染页脚 ----------
function renderFoot(){
  const b=(state.overview&&state.overview.bot)||{};
  $("#foot-bot").textContent=b.bot_username||"未连接";
  $("#foot-api").textContent=b.api_base||"—";
}

// ---------- 弹窗 ----------
function openModal(title,body,after){
  $("#modal-title").textContent=title;
  $("#modal-body").innerHTML=body;
  $("#modal").classList.remove("hidden");
  if(after) after($("#modal-body"));
}
function closeModal(){ $("#modal").classList.add("hidden"); $("#modal-body").innerHTML=""; }
$("#modal-close").onclick=closeModal;
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });

function formObj(form){
  const fd=new FormData(form), out={};
  for(const [k,v] of fd.entries()) out[k]=typeof v==="string"?v:v.name;
  $$("input[type=checkbox]",form).forEach(cb=>{ out[cb.name]=cb.checked; });
  return out;
}

// ---------- 动作 ----------
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act;
  try{
    if(act==="add-chat") openModal("添加会话",chatForm({enabled:true,reply_all:true,commands_enabled:true,group_admin_can_command:true}),bindChatForm);
    else if(act==="edit-chat"){ const c=state.chats.find(x=>String(x.chat_id)===el.dataset.id)||{}; openModal("编辑会话",chatForm(c),bindChatForm); }
    else if(act==="del-chat"){ if(!confirm("删除这个会话的记录？不会把机器人移出群。")) return; await del("chats",{chat_id:el.dataset.id}); toast("已删除"); load(); }
    else if(act==="sync-chats"){ const r=await post("chats/sync",{}); toast(`同步完成：${r.updated}/${r.tried}${(r.problems&&r.problems.length)?"；"+r.problems[0]:""}`,!(r.updated)); load(); }
    else if(act==="view-messages"){ state.selectedChat=el.dataset.id; location.hash="#messages"; }
    else if(act==="reload-messages"){ await loadMessages(); }
    else if(act==="recall"){ if(!confirm("撤回这条消息？")) return; await post("recall",{chat_id:el.dataset.chat,message_id:Number(el.dataset.msg)}); toast("已撤回"); loadMessages(); }
    else if(act==="add-rule") openModal("添加规则",ruleForm({}),bindRuleForm);
    else if(act==="edit-rule"){ const r=state.rules.find(x=>String(x.id)===el.dataset.id)||{}; openModal("编辑规则",ruleForm(r),bindRuleForm); }
    else if(act==="del-rule"){ if(!confirm("删除这条规则？")) return; await del("rules",{id:el.dataset.id}); toast("已删除"); load(); }
    else if(act==="add-word") openModal("添加违禁词",wordForm({}),bindWordForm);
    else if(act==="edit-word"){ const w=state.words.find(x=>String(x.id)===el.dataset.id)||{}; openModal("编辑违禁词",wordForm(w),bindWordForm); }
    else if(act==="del-word"){ if(!confirm("删除这个违禁词？")) return; await del("words",{id:el.dataset.id}); toast("已删除"); load(); }
    else if(act==="add-admin") openModal("添加管理员",adminForm(),bindAdminForm);
    else if(act==="del-admin"){ if(!confirm("删除这个管理员？")) return; await del("admins",{id:el.dataset.id}); toast("已删除"); load(); }
    else if(act==="add-mute") openModal("手动禁言",muteForm(),bindMuteForm);
    else if(act==="unmute"){ await del("mutes",{chat_id:el.dataset.chat,user_id:el.dataset.user}); toast("已解除"); load(); }
    else if(act==="add-black") openModal("添加黑名单",blackForm(),bindBlackForm);
    else if(act==="del-black"){ await del("blacklist",{chat_id:el.dataset.chat,user_id:el.dataset.user}); toast("已移出"); load(); }
    else if(act==="prune-audit"){ if(!confirm("只保留最近 2000 条审计，继续？")) return; await post("audit/prune?keep=2000",{}); toast("已清理"); load(); }
  }catch(err){ if(err.status===401){ showAuth(); return; } toast(err.message,true); }
});

// ---------- 表单绑定 ----------
function bindChatForm(root){
  $("#form-chat",root).onsubmit=async e=>{
    e.preventDefault(); const o=formObj(e.target);
    try{ await post("chats",o); toast("已保存"); closeModal(); load(); }catch(err){ toast(err.message,true); }
  };
}
function bindRuleForm(root){
  $("#form-rule",root).onsubmit=async e=>{
    e.preventDefault(); const o=formObj(e.target);
    o.id=Number(o.id||0); o.priority=Number(o.priority||100); o.scope=o.scope||"";
    o.reply=o.reply||""; o.pattern=o.pattern||"";
    try{ await post("rules",o); toast("已保存"); closeModal(); load(); }catch(err){ toast(err.message,true); }
  };
}
function bindWordForm(root){
  $("#form-word",root).onsubmit=async e=>{
    e.preventDefault(); const o=formObj(e.target);
    o.id=Number(o.id||0); o.mute_seconds=Number(o.mute_seconds||0); o.severity=Number(o.severity||100);
    try{ await post("words",o); toast("已保存"); closeModal(); load(); }catch(err){ toast(err.message,true); }
  };
}
function bindAdminForm(root){
  $("#form-admin",root).onsubmit=async e=>{
    e.preventDefault(); const o=formObj(e.target);
    try{ await post("admins",o); toast("已保存"); closeModal(); load(); }catch(err){ toast(err.message,true); }
  };
}
function bindMuteForm(root){
  $("#form-mute",root).onsubmit=async e=>{
    e.preventDefault(); const o=formObj(e.target); o.seconds=Number(o.seconds||600);
    try{ await post("mutes",o); toast("已执行"); closeModal(); load(); }catch(err){ toast(err.message,true); }
  };
}
function bindBlackForm(root){
  $("#form-black",root).onsubmit=async e=>{
    e.preventDefault(); const o=formObj(e.target);
    try{ await post("blacklist",o); toast("已处理"); closeModal(); load(); }catch(err){ toast(err.message,true); }
  };
}

function muteForm(){
  return `<form id="form-mute" class="grid-form">
    <label class="field"><span>会话 *</span><select name="chat_id">${chatOptions(state.selectedChat,"选择群组")}</select></label>
    <label class="field"><span>用户 ID *</span><input name="user_id" placeholder="123456789"></label>
    <label class="field"><span>用户名</span><input name="username" placeholder="@name"></label>
    <label class="field"><span>时长（秒）</span><input name="seconds" type="number" value="600"></label>
    <label class="field" style="grid-column:1/-1"><span>原因</span><input name="reason" placeholder="网页后台禁言"></label>
    <div class="form-actions"><button class="btn primary" type="submit">执行禁言</button></div>
  </form>`;
}
function blackForm(){
  return `<form id="form-black" class="grid-form">
    <label class="field"><span>会话 *</span><select name="chat_id">${chatOptions(state.selectedChat,"选择群组")}</select></label>
    <label class="field"><span>用户 ID *</span><input name="user_id" placeholder="123456789"></label>
    <label class="field"><span>用户名</span><input name="username" placeholder="@name"></label>
    <label class="field" style="grid-column:1/-1"><span>原因</span><input name="reason" placeholder="网页后台拉黑"></label>
    <label class="check"><input type="checkbox" name="ban" checked> 同时在 Telegram 封禁</label>
    <div class="form-actions"><button class="btn primary" type="submit">加入黑名单</button></div>
  </form>`;
}

// ---------- 发送/设置 ----------
document.addEventListener("submit",async e=>{
  if(e.target.id==="form-send"){
    e.preventDefault();
    const o=formObj(e.target);
    const payload={
      chat_id:state.selectedChat, kind:o.kind||"text", content:o.content||"",
      media:o.media||"", caption:o.caption||"", thread_id:Number(o.thread_id||0),
      parse_mode:o.parse_mode||"", disable_preview:!!o.disable_preview
    };
    if(o.buttons && String(o.buttons).trim()){
      try{ payload.buttons=JSON.parse(o.buttons); }
      catch(err){ toast("按钮 JSON 不合法："+err.message,true); return; }
    }
    try{
      await post("send",payload);
      toast("已发送"); e.target.reset(); await loadMessages();
    }catch(err){ toast(err.message,true); }
  }
  if(e.target.id==="form-settings"){
    e.preventDefault();
    const o=formObj(e.target);
    try{ await post("settings",o); toast("设置已保存"); load(); }catch(err){ toast(err.message,true); }
  }
});

// ---------- 认证 ----------
function showAuth(){
  $("#auth").classList.remove("hidden");
  $("#auth-hint").textContent = location.protocol==="http:" && !/^(127\.0\.0\.1|localhost)$/.test(location.hostname)
    ? "当前不是本机访问：建议用 HTTPS 反代，避免 token 明文传输。" : "token 会写进 cookie，之后刷新不用再输入。";
  $("#auth-token").focus();
}
$("#auth-go").onclick=()=>{
  const t=$("#auth-token").value.trim();
  if(!t){ toast("请输入 token",true); return; }
  location.href=BASE+"/?token="+encodeURIComponent(t)+location.hash;
};
$("#auth-token").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#auth-go").click(); });
$("#logout").onclick=()=>{ document.cookie="LianT_admin_token=; Max-Age=0; path=/"; location.href=BASE+"/"; };

// ---------- 启动 ----------
$("#refresh").onclick=()=>load();
window.addEventListener("hashchange",()=>{
  const id=(location.hash||"#overview").slice(1);
  state.active=NAV.some(n=>n[0]===id)?id:"overview";
  buildNav(); load();
});
(async()=>{
  const id=(location.hash||"#overview").slice(1);
  state.active=NAV.some(n=>n[0]===id)?id:"overview";
  buildNav();
  try{
    state.overview=await get("overview");
    renderFoot();
    if(state.active==="overview"){ renderOverview(); renderFoot(); }
    else await load();
  }catch(e){
    if(e.status===401) showAuth();
    else $("#view").innerHTML=`<div class="card"><div class="card-body"><b>连接失败：</b>${esc(e.message)}</div></div>`;
  }
})();
</script>
</body>
</html>
