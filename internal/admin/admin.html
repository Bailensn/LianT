<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f3">
<meta name="description" content="LianT · Telegram Bot 管理后台">
<title>LianT · 管理后台</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem("liant-theme");
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
  } catch (e) {}
})();
</script>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --mono: "SFMono-Regular", ui-monospace, Consolas, "Liberation Mono", monospace;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --radius: 16px;
  --radius-sm: 10px;
  --bg: #f5f5f3;
  --glow: rgba(59, 91, 219, 0.07);
  --surface: #ffffff;
  --surface-2: #fafaf9;
  --surface-3: #f1f1ef;
  --sidebar-bg: rgba(255, 255, 255, 0.74);
  --topbar-bg: rgba(245, 245, 243, 0.8);
  --field: #ffffff;
  --text: #16181d;
  --text-2: #5b616d;
  --text-3: #8a909b;
  --border: rgba(16, 24, 40, 0.08);
  --border-strong: rgba(16, 24, 40, 0.15);
  --accent: #3b5bdb;
  --accent-2: #2f49b0;
  --accent-contrast: #ffffff;
  --accent-soft: rgba(59, 91, 219, 0.08);
  --danger: #d64545;
  --danger-soft: rgba(214, 69, 69, 0.08);
  --ok: #178a5b;
  --ok-soft: rgba(23, 138, 91, 0.09);
  --warn: #b26a00;
  --warn-soft: rgba(178, 106, 0, 0.1);
  --scrim: rgba(16, 24, 40, 0.34);
  --toast-bg: #16181d;
  --toast-text: #f7f7f5;
  --shadow-1: 0 1px 2px rgba(16, 24, 40, 0.04);
  --shadow-2: 0 12px 32px -12px rgba(16, 24, 40, 0.18), 0 2px 8px rgba(16, 24, 40, 0.06);
  --shadow-3: 0 32px 80px -24px rgba(16, 24, 40, 0.4), 0 8px 24px -8px rgba(16, 24, 40, 0.12);
}
html[data-theme="dark"] {
  --bg: #0c0d0f;
  --glow: rgba(143, 166, 255, 0.09);
  --surface: #16171a;
  --surface-2: #1b1c20;
  --surface-3: #222329;
  --sidebar-bg: rgba(12, 13, 15, 0.74);
  --topbar-bg: rgba(12, 13, 15, 0.8);
  --field: #1b1c20;
  --text: #f2f3f5;
  --text-2: #a2a7b0;
  --text-3: #717782;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.15);
  --accent: #8fa6ff;
  --accent-2: #b3c2ff;
  --accent-contrast: #0c0d0f;
  --accent-soft: rgba(143, 166, 255, 0.12);
  --danger: #ff7b72;
  --danger-soft: rgba(255, 123, 114, 0.1);
  --ok: #5bd6a0;
  --ok-soft: rgba(91, 214, 160, 0.1);
  --warn: #f0b35b;
  --warn-soft: rgba(240, 179, 91, 0.1);
  --scrim: rgba(0, 0, 0, 0.56);
  --toast-bg: #f2f3f5;
  --toast-text: #0c0d0f;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-2: 0 14px 36px -12px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-3: 0 40px 100px -24px rgba(0, 0, 0, 0.8), 0 10px 30px -10px rgba(0, 0, 0, 0.5);
}
* { box-sizing: border-box; }
html {
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  background: var(--bg);
}
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  letter-spacing: -0.004em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(900px 520px at 82% -12%, var(--glow), transparent 62%);
}
::selection { background: var(--accent-soft); }
button, input, select, textarea { font: inherit; color: inherit; }
button, a, [role="button"] { touch-action: manipulation; }
button, [role="button"], .nav a, .brand { user-select: none; -webkit-user-select: none; }
a { color: var(--accent); text-decoration: none; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.icon.sm { width: 15px; height: 15px; }
.icon.lg { width: 24px; height: 24px; }
.hidden { display: none !important; }
.mono { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); word-break: break-all; }
.muted { color: var(--text-3); }
.nowrap { white-space: nowrap; }
.truncate { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100dvh; }
.sidebar {
  position: sticky;
  top: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: calc(18px + env(safe-area-inset-top, 0px)) 14px 14px;
  background: var(--sidebar-bg);
  -webkit-backdrop-filter: blur(20px) saturate(1.5);
  backdrop-filter: blur(20px) saturate(1.5);
  border-right: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 10px; color: var(--text); border-radius: 12px; }
.brand-mark {
  width: 34px; height: 34px; flex: none; border-radius: 11px;
  display: grid; place-items: center;
  background: linear-gradient(145deg, var(--accent), #7a5cff);
  color: #fff; font-weight: 800; font-size: 15px; letter-spacing: -0.03em;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 4px 12px -4px rgba(59,91,219,.6);
}
.brand-text { min-width: 0; }
.brand-name { font-size: 15.5px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.brand-sub { display: block; margin-top: 2px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); }
.nav { display: flex; flex-direction: column; gap: 16px; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 8px; min-width: 0; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-label { padding: 0 10px 4px; font-size: 10px; font-weight: 650; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); }
.nav a {
  display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 10px;
  border-radius: 9px; color: var(--text-2); font-size: 13px; font-weight: 550;
  transition: background-color 150ms ease, color 150ms ease;
}
.nav a .icon { width: 17px; height: 17px; opacity: .8; }
.nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.nav a.on .icon { opacity: 1; }
.sidebar-foot {
  margin-top: auto; display: flex; align-items: center; gap: 9px;
  padding: 10px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface); box-shadow: var(--shadow-1); min-width: 0;
}
.status-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--text-3); box-shadow: 0 0 0 3px var(--surface-3); }
.status-dot.online { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); animation: pulse 2.4s var(--ease-in-out) infinite; }
.status-dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.status-dot.bad { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.sidebar-foot .who { min-width: 0; flex: 1; }
.sidebar-foot strong { display: block; font-size: 12px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar-foot span { display: block; font-size: 10.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  padding: 22px 28px 16px;
  background: var(--topbar-bg);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  backdrop-filter: blur(18px) saturate(1.4);
  border-bottom: 1px solid var(--border);
}
.topbar h1 { margin: 0; font-size: 20px; line-height: 1.2; letter-spacing: -0.025em; font-weight: 700; }
.topbar p { margin: 4px 0 0; color: var(--text-3); font-size: 12.5px; }
.top-actions { display: flex; align-items: center; gap: 6px; }
.bot-switcher {
  height: 34px; max-width: 230px; padding: 0 30px 0 10px;
  border: 1px solid var(--border); border-radius: 9px;
  background: var(--surface); color: var(--text-2); font-size: 12.5px;
  outline: none; appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
  background-position: calc(100% - 14px) 14px, calc(100% - 9px) 14px;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
.bot-switcher:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
@media (max-width: 860px) { .bot-switcher { max-width: 132px; height: 32px; } }
.view { width: 100%; max-width: 1280px; padding: 22px 28px 64px; display: flex; flex-direction: column; gap: 16px; }
.view > * { animation: rise 220ms var(--ease-out) both; }
.view > *:nth-child(2) { animation-delay: 28ms; }
.view > *:nth-child(3) { animation-delay: 56ms; }
.view > *:nth-child(4) { animation-delay: 84ms; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-1); overflow: hidden; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 18px; border-bottom: 1px solid var(--border); }
.card-title { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: -0.012em; }
.card-sub { margin: 3px 0 0; color: var(--text-3); font-size: 12px; }
.card-body { padding: 18px; }
.hero {
  position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
  padding: 22px; overflow: hidden; background: linear-gradient(135deg, var(--surface), var(--surface-2));
}
.hero::after {
  content: ""; position: absolute; right: -80px; top: -120px; width: 320px; height: 320px;
  background: radial-gradient(circle, var(--accent-soft), transparent 68%); pointer-events: none;
}
.hero-main { position: relative; z-index: 1; min-width: 0; }
.eyebrow { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 11.5px; color: var(--text-2); }
.hero h2 { margin: 12px 0 4px; font-size: 27px; line-height: 1.1; letter-spacing: -0.04em; font-weight: 720; overflow-wrap: anywhere; }
.hero p { margin: 0; color: var(--text-3); font-size: 12.5px; }
.hero-actions { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(146px, 1fr)); gap: 10px; }
.stat { padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-1); }
.stat-label { display: flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 11.5px; }
.stat-num { margin-top: 5px; font-size: 23px; line-height: 1.1; font-weight: 700; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
.stat-hint { margin-top: 3px; color: var(--text-3); font-size: 11px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.kv { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 8px 14px; margin: 0; font-size: 12.5px; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.divider { height: 1px; background: var(--border); margin: 14px 0; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 36px; padding: 0 13px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-size: 13px; font-weight: 550; white-space: nowrap; text-decoration: none;
  transition: transform 120ms var(--ease-out), background-color 150ms ease, border-color 150ms ease, color 150ms ease;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); box-shadow: 0 1px 2px rgba(16,24,40,.12); }
.btn.danger { background: transparent; border-color: color-mix(in srgb, var(--danger) 38%, transparent); color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.subtle { background: var(--surface-3); border-color: transparent; }
.btn.sm { height: 30px; padding: 0 9px; font-size: 12px; border-radius: 8px; gap: 5px; }
.btn:active { transform: scale(0.97); }
.btn[disabled] { opacity: .5; pointer-events: none; }
.icon-btn {
  width: 34px; height: 34px; flex: none; display: inline-grid; place-items: center;
  border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--text-2);
  transition: transform 120ms var(--ease-out), background-color 150ms ease, color 150ms ease;
}
.icon-btn:active { transform: scale(0.94); }
.icon-btn.sm { width: 28px; height: 28px; border-radius: 8px; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { color: var(--text-2); font-size: 12px; font-weight: 550; }
.input, textarea, select {
  width: 100%; min-height: 38px; padding: 9px 11px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--field);
  color: var(--text); outline: none;
  transition: border-color 150ms ease, box-shadow 150ms ease, background-color 150ms ease;
}
textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
.input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input::placeholder, textarea::placeholder { color: var(--text-3); }
.grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.grid-form .full { grid-column: 1 / -1; }
.check { display: flex; align-items: center; gap: 8px; padding-top: 20px; color: var(--text-2); font-size: 12.5px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.hint { color: var(--text-3); font-size: 11.5px; line-height: 1.5; }

/* ---------- toolbar ---------- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.toolbar .spacer { flex: 1; }
.search { position: relative; flex: 1; min-width: 170px; max-width: 300px; }
.search .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-3); width: 15px; height: 15px; }
.search input { width: 100%; height: 36px; padding: 0 11px 0 32px; border: 1px solid var(--border); border-radius: 10px; background: var(--field); outline: none; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* ---------- tables ---------- */
.table-wrap { overflow: auto; overscroll-behavior: contain; }
table { width: 100%; border-collapse: collapse; min-width: 640px; }
th {
  position: sticky; top: 0; z-index: 1; padding: 9px 14px;
  background: var(--surface-2); color: var(--text-3);
  font-size: 10.5px; font-weight: 650; letter-spacing: 0.07em; text-transform: uppercase;
  text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border);
}
td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 12.8px; }
tr:last-child td { border-bottom: 0; }
.cell-main { font-weight: 600; color: var(--text); }
.cell-sub { margin-top: 2px; color: var(--text-3); font-size: 11px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.pill {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px;
  border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-2); font-size: 10.5px; font-weight: 550; white-space: nowrap;
}
.pill.ok { color: var(--ok); background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 24%, transparent); }
.pill.bad { color: var(--danger); background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 24%, transparent); }
.pill.warn { color: var(--warn); background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 24%, transparent); }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 46px 20px; text-align: center; color: var(--text-3); }
.empty .icon { width: 26px; height: 26px; opacity: .55; }
.empty strong { color: var(--text-2); font-size: 13px; font-weight: 600; }
.empty span { max-width: 360px; font-size: 12px; line-height: 1.55; }

/* ---------- messages / misc ---------- */
.msg-list { display: flex; flex-direction: column; gap: 8px; max-height: 58dvh; overflow: auto; overscroll-behavior: contain; }
.msg {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px;
  padding: 11px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2);
}
.msg-head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.msg-who { font-size: 12px; font-weight: 650; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg-meta { color: var(--text-3); font-size: 10.5px; white-space: nowrap; }
.msg-body { grid-column: 1 / -1; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.8px; line-height: 1.55; }
.msg-actions { display: flex; flex-wrap: wrap; gap: 3px; justify-content: flex-end; grid-row: 1; grid-column: 2; }
.chat-picker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chat-picker select { width: auto; min-width: 200px; max-width: 340px; }
.actions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.action-tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
  padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2);
  text-align: left; transition: transform 120ms var(--ease-out), border-color 150ms ease, background-color 150ms ease;
}
.action-tile:active { transform: scale(0.98); }
.action-tile strong { font-size: 12.5px; font-weight: 600; }
.action-tile span { color: var(--text-3); font-size: 11px; line-height: 1.45; }
.action-tile .icon { color: var(--accent); }
.api-result {
  margin: 14px 0 0; padding: 12px; min-height: 60px; max-height: 48dvh; overflow: auto;
  border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2);
  font-family: var(--mono); font-size: 11.5px; line-height: 1.55; color: var(--text-2);
  white-space: pre-wrap; overflow-wrap: anywhere; overscroll-behavior: contain;
}
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  height: 26px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text-2); font-size: 11px; font-family: var(--mono);
  transition: transform 120ms var(--ease-out), border-color 150ms ease, color 150ms ease;
}
.chip:active { transform: scale(0.96); }
.stat-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: 20px; }
.modal[hidden] { display: none; }
.modal-scrim { position: absolute; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); animation: fade-in 160ms ease both; }
.modal-card {
  position: relative; width: min(580px, 100%); max-height: 88dvh; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  box-shadow: var(--shadow-3); animation: modal-in 220ms var(--ease-out) both;
}
.modal-card.wide { width: min(760px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.modal-head h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.015em; }
.modal-body { padding: 18px; overflow: auto; overscroll-behavior: contain; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.modal-text { margin: 0; color: var(--text-2); font-size: 13px; line-height: 1.65; }
body.modal-open { overflow: hidden; }

/* ---------- toasts ---------- */
.toast-region {
  position: fixed; right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 300; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 10px;
  max-width: min(390px, calc(100vw - 32px)); padding: 10px 11px 10px 13px;
  border-radius: 12px; background: var(--toast-bg); color: var(--toast-text);
  box-shadow: var(--shadow-2); font-size: 12.5px; line-height: 1.45;
  animation: toast-in 240ms var(--ease-out) both;
}
.toast.is-leaving { animation: toast-out 160ms var(--ease-out) both; }
.toast-dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--accent); }
.toast.ok .toast-dot { background: var(--ok); }
.toast.bad .toast-dot { background: var(--danger); }
.toast span { min-width: 0; overflow-wrap: anywhere; }
.toast button { margin-left: auto; width: 24px; height: 24px; display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: inherit; opacity: .55; }

/* ---------- auth ---------- */
.auth { position: fixed; inset: 0; z-index: 400; display: grid; place-items: center; padding: 24px; background: var(--bg); }
.auth[hidden] { display: none; }
.auth-card { width: min(380px, 100%); padding: 26px; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-2); }
.auth-card .brand { padding: 0 0 18px; }
.auth-card h1 { margin: 0 0 6px; font-size: 18px; letter-spacing: -0.025em; }
.auth-card p { margin: 0 0 18px; color: var(--text-3); font-size: 12px; line-height: 1.55; }
.auth-card input { width: 100%; height: 40px; padding: 0 12px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--field); outline: none; }
.auth-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* ---------- skeleton ---------- */
.skeleton { border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.25s linear infinite; }
.skeleton-line { height: 12px; margin: 8px 0; }
.skeleton-card { padding: 18px; }

/* ---------- responsive ---------- */
@media (max-width: 1040px) {
  .grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: sticky; top: 0; z-index: 50; height: auto; flex-direction: row; align-items: center; gap: 10px;
    padding: calc(9px + env(safe-area-inset-top, 0px)) 12px 9px;
    border-right: 0; border-bottom: 1px solid var(--border); overflow: hidden;
  }
  .brand { padding: 0; margin-right: 2px; flex: none; }
  .brand-sub { display: none; }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; font-size: 13px; }
  .brand-name { font-size: 13.5px; }
  .nav { flex-direction: row; align-items: center; gap: 2px; overflow-x: auto; padding: 0; margin: 0; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav-group { display: contents; }
  .nav-label { display: none; }
  .nav a { height: 32px; padding: 0 10px; font-size: 12px; white-space: nowrap; }
  .nav a .icon { display: none; }
  .sidebar-foot { margin: 0 0 0 auto; padding: 6px; border-radius: 9px; }
  .sidebar-foot .who { display: none; }
  .topbar { position: static; padding: 16px 16px 12px; align-items: center; }
  .topbar h1 { font-size: 18px; }
  .topbar p { font-size: 11.5px; }
  .view { padding: 16px 16px calc(48px + env(safe-area-inset-bottom, 0px)); gap: 14px; }
  .hero { flex-direction: column; align-items: flex-start; padding: 18px; }
  .hero h2 { font-size: 23px; }
  .modal { align-items: end; padding: 0; }
  .modal-card, .modal-card.wide {
    width: 100%; max-height: 92dvh; border-radius: 20px 20px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    animation: sheet-in 260ms var(--ease-out) both;
  }
  .toast-region { left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); align-items: stretch; }
  .toast { max-width: none; }
  .sidebar-foot .icon-btn { width: 34px; height: 34px; }
  .hide-sm { display: none; }
  .kv { grid-template-columns: 110px minmax(0, 1fr); }
}
@media (pointer: coarse) {
  input, textarea, select { font-size: 16px; }
  .btn { min-height: 40px; }
  .btn.sm { min-height: 32px; }
  .icon-btn { width: 40px; height: 40px; }
}
@media (hover: hover) and (pointer: fine) {
  .btn:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: var(--accent-contrast); }
  .btn.danger:hover { background: var(--danger-soft); }
  .btn.ghost:hover { background: var(--surface-3); color: var(--text); }
  .btn.subtle:hover { background: var(--surface-3); }
  .icon-btn:hover { background: var(--surface-3); color: var(--text); }
  .nav a:hover { background: var(--surface-3); color: var(--text); }
  .nav a.on:hover { background: var(--accent-soft); color: var(--accent); }
  .brand:hover { background: var(--surface-3); }
  .action-tile:hover { border-color: var(--border-strong); background: var(--surface); }
  .chip:hover { border-color: var(--border-strong); color: var(--text); }
  tbody tr:hover td { background: var(--surface-2); }
}
@media (prefers-reduced-motion: reduce) {
  .view > *, .modal-card, .toast, .modal-scrim { animation: none !important; }
  .btn:active, .icon-btn:active, .action-tile:active, .chip:active { transform: none; }
  .status-dot.online { animation: none; }
  .skeleton { animation: none; }
  * { scroll-behavior: auto !important; }
}
@media (prefers-reduced-transparency: reduce) {
  .sidebar, .topbar { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .modal-scrim { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(0,0,0,.6); }
}
@media (prefers-contrast: more) {
  :root { --border: rgba(16,24,40,.22); --border-strong: rgba(16,24,40,.34); }
  html[data-theme="dark"] { --border: rgba(255,255,255,.22); --border-strong: rgba(255,255,255,.34); }
}
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes modal-in { from { opacity: 0; transform: translateY(6px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes sheet-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes toast-out { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(6px) scale(0.98); } }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
</style>

<script>
"use strict";

const BASE = "__BASE_PATH__";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (name, cls = "") => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;

const NAV_GROUPS = [
  ["运营", [["overview", "总览", "overview"], ["chats", "群组", "users"], ["messages", "消息", "message"], ["broadcast", "群发", "send"], ["joins", "入群", "userPlus"]]],
  ["自动化", [["rules", "回复规则", "list"], ["words", "违禁词", "shield"]]],
  ["成员", [["admins", "管理员", "userCheck"], ["mutes", "禁言", "clock"], ["blacklist", "黑名单", "ban"]]],
  ["工具", [["chattools", "群工具", "wrench"], ["bot", "Bot 资料", "bot"], ["botapi", "Bot API", "terminal"]]],
  ["系统", [["bots", "机器人", "layers"], ["audit", "操作日志", "activity"], ["settings", "设置", "sliders"], ["help", "帮助", "help"]]]
];
const NAV = NAV_GROUPS.flatMap(([, items]) => items);
const TITLES = Object.fromEntries(NAV.map(([id, label]) => [id, label]));
const DESCS = {
  overview: "机器人状态、待办与最近操作",
  chats: "已登记的群组 / 频道",
  messages: "最近消息与主动发送",
  broadcast: "一次发送到多个会话",
  joins: "入群申请审批",
  rules: "按匹配方式自动回复",
  words: "命中后的撤回 / 禁言 / 封禁",
  admins: "谁可以使用管理指令",
  mutes: "禁言记录与解除",
  blacklist: "黑名单成员",
  chattools: "群信息、邀请链接、话题与权限",
  bots: "多 Bot 注册与启停",
  bot: "当前 Bot 的资料、命令与 webhook",
  botapi: "直接调用任意 Bot API 方法",
  audit: "所有处置与后台操作",
  settings: "全局开关、欢迎语与备份",
  help: "指令与 Telegram 侧限制"
};
const KIND_LABELS = {
  text: "文本", photo: "图片", document: "文件", video: "视频", audio: "音频",
  voice: "语音", sticker: "贴纸", animation: "动图", video_note: "圆头视频",
  location: "位置", poll: "投票", dice: "骰子"
};

const state = {
  active: "overview", bots: [], platforms: [], currentBot: "",
  chats: [], rules: [], words: [], admins: [], mutes: [], blacklist: [],
  audit: [], settings: {}, overview: null, selectedChat: "", messages: [],
  joins: [], chatInfo: null, chatAdmins: [], chatBotMember: null,
  botMe: null, webhook: null, commands: null,
  filters: { chats: "", rules: "", words: "", auditKind: "", auditChat: "", joinStatus: "pending", joinChat: "" },
  composerKind: "text"
};

let loadSeq = 0;
let modalResolve = null;
let lastFocus = null;

/* ---------------- api ---------------- */
function withBot(path) {
  if (!state.currentBot) return path;
  if (path.startsWith("bots") || path.startsWith("platforms")) return path;
  return path + (path.indexOf("?") >= 0 ? "&" : "?") + "bot_id=" + encodeURIComponent(state.currentBot);
}
async function api(path, opt = {}) {
  const res = await fetch(BASE + "/api/" + withBot(path), Object.assign({
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" }
  }, opt));
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (!res.ok || !body || body.ok !== true) {
    const err = new Error((body && body.error) || ("HTTP " + res.status));
    err.status = res.status;
    throw err;
  }
  return body.data;
}
const get = (path, params) => api(path + (params ? "?" + new URLSearchParams(params) : ""));
const post = (path, data) => api(path, { method: "POST", body: JSON.stringify(data || {}) });
const del = (path, params) => api(path + "?" + new URLSearchParams(params), { method: "DELETE" });
async function botAPI(method, params = {}) {
  const r = await post("botapi", { method, params });
  return r.result;
}

function currentBotData() {
  return state.bots.find((b) => String(b.id) === String(state.currentBot)) || null;
}
function botHas(cap) {
  const b = currentBotData();
  return !!(b && b.capabilities && b.capabilities[cap]);
}
function platformName() {
  const b = currentBotData();
  return (b && b.platform_name) || "Telegram";
}
function populateBotSwitcher() {
  const sel = $("#bot-switcher");
  if (!sel) return;
  if (!state.bots.length) {
    sel.innerHTML = `<option value="">未添加 Bot</option>`;
    sel.disabled = true;
    return;
  }
  sel.disabled = false;
  sel.innerHTML = state.bots.map((b) => {
    const stateText = b.running ? "运行中" : (b.enabled ? "未运行" : "已停用");
    const name = b.name || ("Bot #" + b.id);
    return `<option value="${esc(b.id)}"${String(b.id) === String(state.currentBot) ? " selected" : ""}>${esc(name)} · ${esc(stateText)}</option>`;
  }).join("");
}
async function refreshOverview() {
  try {
    state.overview = await get("overview");
    renderFoot();
  } catch (e) {
    if (e.status === 401) showAuth();
  }
}
async function selectBot(id, reload = true) {
  state.currentBot = String(id || "");
  try { localStorage.setItem("liant-bot", state.currentBot); } catch (e) {}
  populateBotSwitcher();
  await refreshOverview();
  if (reload) await loadSection();
}

/* ---------------- formatting ---------------- */
function fmtNum(n) {
  n = Number(n) || 0;
  try { return new Intl.NumberFormat("zh-CN", { notation: "compact", maximumFractionDigits: 1 }).format(n); }
  catch (e) { return String(n); }
}
function fmtTime(v) {
  if (!v) return "—";
  const d = new Date(v);
  return isNaN(d.getTime()) ? String(v) : d.toLocaleString("zh-CN", { hour12: false });
}
function chatName(id) {
  const c = state.chats.find((x) => String(x.chat_id) === String(id));
  return c ? (c.name || c.chat_id) : (id || "全局");
}
function chatOptions(selected = "", empty = "选择会话") {
  let out = `<option value="">${esc(empty)}</option>`;
  for (const c of state.chats) {

/* ---------------- toast ---------------- */
function toast(message, type = "info") {
  const region = $("#toast-region");
  const el = document.createElement("div");
  el.className = "toast " + (type === "bad" ? "bad" : type === "ok" ? "ok" : "");
  el.innerHTML = `<span class="toast-dot"></span><span>${esc(message)}</span><button type="button" aria-label="关闭">${icon("close", "sm")}</button>`;
  region.appendChild(el);
  let timer = setTimeout(() => dismissToast(el), 4200);
  const close = el.querySelector("button");
  close.addEventListener("click", () => dismissToast(el));
  el.addEventListener("mouseenter", () => clearTimeout(timer));
  el.addEventListener("mouseleave", () => { clearTimeout(timer); timer = setTimeout(() => dismissToast(el), 1600); });
}
function dismissToast(el) {
  if (!el || el.classList.contains("is-leaving")) return;
  el.classList.add("is-leaving");
  setTimeout(() => el.remove(), 180);
}

/* ---------------- modal ---------------- */
function openModal(title, body, onMount, opts = {}) {
  const modal = $("#modal");
  modalResolve = null;
  lastFocus = document.activeElement;
  $("#modal-title").textContent = title;
  $("#modal-body").innerHTML = body;
  $(".modal-card").classList.toggle("wide", !!opts.wide);
  modal.hidden = false;
  document.body.classList.add("modal-open");
  if (onMount) onMount($("#modal-body"));
  const focusable = $("#modal-body").querySelector("input,textarea,select,button");
  if (focusable) setTimeout(() => focusable.focus(), 30);
}
function closeModal() {
  const modal = $("#modal");
  if (modal.hidden) return;
  modal.hidden = true;
  document.body.classList.remove("modal-open");
  $("#modal-body").innerHTML = "";
  const resolve = modalResolve;
  modalResolve = null;
  if (resolve) resolve(null);
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
function confirmAction(message, opts = {}) {
  return new Promise((resolve) => {
    const danger = !!opts.danger;
    openModal(opts.title || "确认操作", `
      <p class="modal-text">${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn ghost" type="button" data-cancel>取消</button>
        <button class="btn ${danger ? "danger" : "primary"}" type="button" data-ok>${esc(opts.confirmText || "确认")}</button>
      </div>`, (root) => {
        root.querySelector("[data-ok]").onclick = () => { modalResolve = null; closeModal(); resolve(true); };
        root.querySelector("[data-cancel]").onclick = () => { modalResolve = null; closeModal(); resolve(false); };
      });
    modalResolve = () => resolve(false);
  });
}
function promptValue(opts) {
  return new Promise((resolve) => {
    const multiline = !!opts.multiline;
    const input = multiline
      ? `<textarea id="prompt-input" placeholder="${esc(opts.placeholder || "")}">${esc(opts.value || "")}</textarea>`
      : `<input id="prompt-input" type="${esc(opts.type || "text")}" value="${esc(opts.value || "")}" placeholder="${esc(opts.placeholder || "")}">`;
    openModal(opts.title || "输入", `
      <form id="prompt-form">
        <label class="field"><span>${esc(opts.label || "内容")}</span>${input}</label>
        ${opts.help ? `<p class="hint" style="margin:8px 0 0">${esc(opts.help)}</p>` : ""}
        <div class="modal-actions">
          <button class="btn ghost" type="button" data-cancel>取消</button>
          <button class="btn primary" type="submit">${esc(opts.confirmText || "确定")}</button>
        </div>
      </form>`, (root) => {
        const field = root.querySelector("#prompt-input");
        root.querySelector("[data-cancel]").onclick = () => { modalResolve = null; closeModal(); resolve(null); };
        root.querySelector("#prompt-form").onsubmit = (ev) => {
          ev.preventDefault();
          const value = field.value.trim();
          modalResolve = null;
          closeModal();
          resolve(value);
        };
        setTimeout(() => { field.focus(); if (field.select) field.select(); }, 30);
      });
    modalResolve = () => resolve(null);
  });
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast("已复制", "ok");
  } catch (e) {
    const input = document.createElement("textarea");
    input.value = text; input.style.position = "fixed"; input.style.opacity = "0";
    document.body.appendChild(input); input.select();
    try { document.execCommand("copy"); toast("已复制", "ok"); }
    catch (err) { toast("复制失败", "bad"); }
    input.remove();
  }
}

/* ---------------- routing ---------------- */
async function loadSection() {
  const id = state.active;
  const seq = ++loadSeq;
  setHeader(id);
  buildNav();
  const still = () => seq === loadSeq;
  try {
    if (id === "bots") {
      state.bots = await get("bots");
      state.platforms = await get("platforms").catch(() => []);
      populateBotSwitcher();
      if (!still()) return;
      renderBots();
      renderFoot();
      return;
    }
    if (!state.currentBot) {
      $("#view").innerHTML = renderNoBots();
      renderFoot();
      return;
    }
    const rec = currentBotData();
    if (!rec) {
      state.currentBot = "";
      populateBotSwitcher();
      $("#view").innerHTML = renderNoBots();
      renderFoot();
      return;
    }
    if (!rec.running) {
      $("#view").innerHTML = renderBotUnavailable(rec);
      renderFoot();
      return;
    }
    $("#view").innerHTML = skeletonHTML();
    if (id === "overview") {
      const data = await get("overview");
      if (!still()) return;
      state.overview = data;
      if (data.no_bot) { $("#view").innerHTML = renderNoBots(); return; }
      renderOverview();
    } else if (id === "chats") {
      state.chats = await get("chats");
      if (!still()) return;
      renderChats();
    } else if (id === "messages") {
      await ensureChats();
      if (!still()) return;
      if (!state.selectedChat && state.chats[0]) state.selectedChat = String(state.chats[0].chat_id);
      await loadMessages();
    } else if (id === "broadcast") {
      await ensureChats();
      if (!still()) return;
      renderBroadcast();
    } else if (id === "joins") {
      await ensureChats();
      if (!still()) return;
      state.joins = await get("joins", { status: state.filters.joinStatus || "pending" });
      if (!still()) return;
      renderJoins();
    } else if (id === "rules") {
      state.rules = await get("rules");
      if (!still()) return;
      renderRules();
    } else if (id === "words") {
      state.words = await get("words");
      if (!still()) return;
      renderWords();
    } else if (id === "admins") {
      await ensureChats();
      if (!still()) return;
      state.admins = await get("admins");
      if (!still()) return;
      renderAdmins();
    } else if (id === "mutes") {
      await ensureChats();
      if (!still()) return;
      state.mutes = await get("mutes?all=1");
      if (!still()) return;
      renderMutes();
    } else if (id === "blacklist") {
      await ensureChats();
      if (!still()) return;
      state.blacklist = await get("blacklist");
      if (!still()) return;
      renderBlacklist();
    } else if (id === "chattools") {
      await ensureChats();
      if (!still()) return;
      if (!state.selectedChat && state.chats[0]) state.selectedChat = String(state.chats[0].chat_id);
      await loadChatTools();
      if (!still()) return;
    } else if (id === "bot") {
      await loadBot();
      if (!still()) return;
    } else if (id === "botapi") {
      renderBotAPI();
    } else if (id === "audit") {
      await ensureChats();
      if (!still()) return;
      const data = await get("audit", { limit: "200", kind: state.filters.auditKind || "", chat_id: state.filters.auditChat || "" });
      if (!still()) return;
      state.audit = data;
      renderAudit();
    } else if (id === "settings") {
      state.settings = await get("settings");
      if (!still()) return;
      renderSettings();
    } else if (id === "help") {
      if (!state.overview) { state.overview = await get("overview"); }
      if (!still()) return;
      renderHelp();
    }
    renderFoot();
  } catch (e) {
    if (!still()) return;
    if (e.status === 401) { showAuth(); return; }
    $("#view").innerHTML = `<div class="card"><div class="card-body"><div class="empty">${icon("alert", "lg")}<strong>加载失败</strong><span>${esc(errorText(e))}</span><button class="btn subtle" data-act="refresh" style="margin-top:8px">重试</button></div></div></div>`;
  }
}

async function doBroadcast(form) {
  const fd = new FormData(form);
  const chatIds = fd.getAll("chat").map(String);
  if (!chatIds.length) throw new Error("至少选择一个会话");
  const payload = { chat_ids: chatIds, kind: fd.get("kind") || "text", content: fd.get("content") || "", media: fd.get("media") || "", caption: fd.get("caption") || "", parse_mode: fd.get("parse_mode") || "" };
  if (payload.kind === "poll" && !payload.media) payload.media = payload.content;
  const r = await post("broadcast", payload);
  const rows = (r.results || []).map((x) => `<tr><td>${esc(chatName(x.chat_id))}<div class="mono">${esc(x.chat_id)}</div></td><td>${x.ok ? '<span class="pill ok">成功</span>' : '<span class="pill bad">失败</span>'}</td><td class="muted">${esc(x.ok ? "#" + x.id : x.error || "")}</td></tr>`).join("");
  $("#broadcast-result").innerHTML = `<div class="card"><div class="card-head"><div><h2 class="card-title">发送结果</h2><p class="card-sub">成功 ${fmtNum(r.ok_count)} / ${fmtNum((r.results || []).length)}</p></div></div><div class="table-wrap"><table><thead><tr><th>会话</th><th>结果</th><th>详情</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  toast("群发完成：成功 " + r.ok_count + " 个", r.ok_count > 0 ? "ok" : "bad");
}

async function loadChatTools() {
  const rec = currentBotData();
  if (rec && rec.platform && rec.platform !== "telegram") {
    $("#view").innerHTML = `<div class="card">${emptyState("wrench", "群工具目前调用的是 Telegram 原生方法；该平台需要自己的 runtime 接口。", "平台暂不支持")}</div>`;
    return;
  }
  const chatID = state.selectedChat;
  if (!chatID) { state.chatInfo = null; state.chatAdmins = []; renderChatTools(); return; }
  $("#view").innerHTML = skeletonHTML();
  try {
    const [info, count, admins] = await Promise.all([
      botAPI("getChat", { chat_id: chatID }),
      botAPI("getChatMemberCount", { chat_id: chatID }).catch(() => null),
      botAPI("getChatAdministrators", { chat_id: chatID }).catch(() => [])
    ]);
    let botMember = null;
    const botID = state.overview && state.overview.bot && state.overview.bot.bot_id;
    if (botID) {
      try { botMember = await botAPI("getChatMember", { chat_id: chatID, user_id: Number(botID) }); } catch (e) {}
    }
    state.chatInfo = { info, count, botMember };
    state.chatAdmins = Array.isArray(admins) ? admins : [];
    renderChatTools();
  } catch (e) {
    $("#view").innerHTML = `<div class="card"><div class="card-body">${emptyState("alert", errorText(e), "读取群信息失败")}</div></div>`;
  }
}

function bindChatForm(root) {
  $("#form-chat", root).onsubmit = async (e) => {

function formObj(form) {
  const fd = new FormData(form), out = {};
  for (const [k, v] of fd.entries()) out[k] = typeof v === "string" ? v : v.name;
  $$("input[type=checkbox]", form).forEach((cb) => { out[cb.name] = cb.checked; });
  return out;
}

/* ---------------- page forms ---------------- */
document.addEventListener("submit", async (e) => {
  const form = e.target;
  try {
    if (form.id === "composer") {
      e.preventDefault();
      const o = formObj(form);
      const kind = o.kind || "text";
      const payload = {
        chat_id: state.selectedChat, kind,
        content: o.content || "", media: o.media || "", caption: o.caption || "",
        thread_id: Number(o.thread_id || 0), parse_mode: o.parse_mode || "",
        disable_preview: !!o.disable_preview, buttons: null
      };
      if (payload.kind === "poll" && !payload.media) payload.media = payload.content;
      if (o.buttons && String(o.buttons).trim()) {
        try { payload.buttons = JSON.parse(o.buttons); } catch (err) { throw new Error("按钮 JSON 不合法：" + err.message); }
      }
      await post("send", payload);
      toast("已发送", "ok"); form.reset(); updateComposer(); await loadMessages();
    } else if (form.id === "broadcast-form") {
      e.preventDefault();
      await doBroadcast(form);
    } else if (form.id === "form-settings") {
      e.preventDefault();
      await post("settings", formObj(form));
      toast("设置已保存", "ok"); await loadSection();
    } else if (form.id === "form-botapi") {
      e.preventDefault();
      const method = $("#api-method").value.trim();
      let params = {};
      const raw = $("#api-params").value.trim();
      if (raw) { try { params = JSON.parse(raw); } catch (err) { throw new Error("参数不是合法 JSON：" + err.message); } }
      const r = await post("botapi", { method, params });
      $("#api-result").textContent = JSON.stringify(r.result, null, 2);
    } else if (form.id === "form-upload") {
      e.preventDefault();
      const fd = new FormData(form);
      const uploadURL = BASE + "/api/upload" + (state.currentBot ? "?bot_id=" + encodeURIComponent(state.currentBot) : "");
      const res = await fetch(uploadURL, { method: "POST", body: fd, credentials: "same-origin" });
      const body = await res.json().catch(() => ({ ok: false, error: "HTTP " + res.status }));
      if (!body.ok) throw new Error(body.error || "上传失败");
      $("#upload-result").textContent = JSON.stringify(body.data.result, null, 2);
      toast("上传并调用成功", "ok");
    } else if (form.id === "form-commands") {
      e.preventDefault();
      const raw = form.elements.commands.value.trim();
      let commands;
      try { commands = JSON.parse(raw); } catch (err) { throw new Error("命令 JSON 不合法：" + err.message); }
      if (!Array.isArray(commands)) throw new Error("命令必须是数组");
      await botAPI("setMyCommands", { commands });
      toast("命令已保存", "ok"); await loadBot();
    } else if (form.id === "form-bot-profile") {
      e.preventDefault();
      const fd = new FormData(form);
      const description = String(fd.get("description") || "");
      const short = String(fd.get("short_description") || "");
      await botAPI("setMyDescription", { description });
      await botAPI("setMyShortDescription", { short_description: short });
      toast("资料已保存", "ok"); await loadBot();
    }
  } catch (err) {
    if (err.status === 401) { showAuth(); return; }
    toast(errorText(err), "bad");
  }
});

/* ---------------- keyboard / init ---------------- */
document.addEventListener("keydown", (e) => {
  const modal = $("#modal");
  if (!modal.hidden) {
    if (e.key === "Escape") { closeModal(); return; }
    if (e.key === "Tab") {
      const focusables = $$("button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])", modal).filter((el) => !el.disabled && el.offsetParent !== null);
      if (!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }
});
$("#auth-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const token = $("#auth-token").value.trim();
  if (!token) { toast("请输入 token", "bad"); return; }
  location.href = BASE + "/?token=" + encodeURIComponent(token) + location.hash;
});
$("#refresh").addEventListener("click", () => loadSection());
$("#theme-toggle").addEventListener("click", toggleTheme);
$("#logout").addEventListener("click", ACTIONS.logout);
$("#bot-switcher").addEventListener("change", (e) => selectBot(e.target.value));
window.addEventListener("hashchange", route);

async function loadBotsAndPlatforms() {
  state.bots = await get("bots");
  state.platforms = await get("platforms").catch(() => []);
  let saved = "";
  try { saved = localStorage.getItem("liant-bot") || ""; } catch (e) {}
  let pick = state.bots.find((b) => String(b.id) === saved);
  if (!pick) pick = state.bots.find((b) => b.running) || state.bots.find((b) => b.enabled) || state.bots[0];
  state.currentBot = pick ? String(pick.id) : "";
  if (state.currentBot) {
    try { localStorage.setItem("liant-bot", state.currentBot); } catch (e) {}
  }
  populateBotSwitcher();
}

(async function boot() {
  applyTheme();
  buildNav();
  const id = (location.hash || "#overview").slice(1);
  state.active = TITLES[id] ? id : "overview";
  try {
    await loadBotsAndPlatforms();
    await refreshOverview();
    if (!state.currentBot || (state.overview && state.overview.no_bot)) {
      state.active = "bots";
      try { history.replaceState(null, "", "#bots"); } catch (e) {}
      buildNav();
      renderBots();
      renderFoot();
      return;
    }
    if (state.active === "overview") renderOverview();
    else await loadSection();
  } catch (e) {
    if (e.status === 401) showAuth();
    else $("#view").innerHTML = `<div class="card"><div class="card-body">${emptyState("alert", errorText(e), "连接失败")}</div></div>`;
  }
})();

</script>
