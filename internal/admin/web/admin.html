<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0c">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="LianT 管理后台：群消息、回复规则、违禁词与群管理。">
<title>LianT · 管理后台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='15' fill='%235b5bd6'/><rect x='15' y='22' width='34' height='25' rx='11' fill='none' stroke='white' stroke-width='4'/><circle cx='25.5' cy='34' r='3' fill='white'/><circle cx='38.5' cy='34' r='3' fill='white'/><path d='M32 22v-7' stroke='white' stroke-width='4' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="__BASE_PATH__/admin.css">
</head>
<body>
<a class="skip-link" href="#view">跳到主要内容</a>

  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
  <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
  <symbol id="i-user-plus" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>

<div class="app" id="app">
  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar" aria-label="侧边导航">
    <a class="brand" href="#bots" aria-label="LianT 所有 Bot">
      <span class="brand-mark"><svg class="i" aria-hidden="true"><use href="#i-bot"></use></svg></span>
      <span class="brand-text">
        <span class="brand-name">LianT</span>
        <span class="brand-sub">Bot 工作台</span>
      </span>
    </a>
    <a class="nav-back" href="#bots" data-tab="bots">
      <svg class="i" aria-hidden="true"><use href="#i-arrow-left"></use></svg><span>所有 Bot</span>
    </a>
    <div class="bot-context" id="bot-context" hidden>
      <span class="bot-context-avatar" id="bot-context-avatar">L</span>
      <span class="bot-context-text"><strong id="bot-context-name">—</strong><small id="bot-context-meta">—</small></span>
      <span class="bot-context-dot" id="bot-context-dot" aria-hidden="true"></span>
    </div>
    <nav class="nav" id="nav" aria-label="主导航"></nav>
    <div class="sidebar-foot">
      <div class="conn" id="conn" data-state="idle" role="status" aria-live="polite">
        <span class="conn-dot"></span><span id="conn-text">未连接</span>
      </div>
      <button class="btn ghost sm side-connect" id="btn-token" type="button">
        <svg class="i" aria-hidden="true"><use href="#i-key"></use></svg><span>连接设置</span>
      </button>
      <p class="foot-note">数据存于本机 SQLite · LianT</p>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="btn-nav" type="button" aria-label="打开导航" aria-expanded="false" aria-controls="sidebar">
        <svg class="i" aria-hidden="true"><use href="#i-menu"></use></svg>
      </button>
      <div class="crumb">
        <a class="crumb-root" href="#bots">所有 Bot</a>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <span id="crumb-bot" class="crumb-bot">—</span>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <span id="crumb-tab">总览</span>
      </div>
      <div class="top-actions">
        <select class="input select bot-select" id="bot-select" aria-label="选择 Bot"></select>
        <div class="status-pill" id="status-pill" data-state="idle" role="status" aria-live="polite" title="连接状态">
          <span class="status-dot"></span><span id="status-text">未连接</span>
        </div>
        <button class="icon-btn" id="btn-refresh" type="button" aria-label="刷新当前页面" title="刷新">
          <svg class="i" aria-hidden="true"><use href="#i-refresh"></use></svg>
        </button>
        <button class="icon-btn" id="btn-conn" type="button" aria-label="连接设置" title="连接设置">
          <svg class="i" aria-hidden="true"><use href="#i-key"></use></svg>
        </button>
      </div>
      <div class="progress" id="progress" hidden aria-hidden="true"><span></span></div>
    </header>

    <main class="view" id="view" tabindex="-1">
      <div class="boot"><span class="spinner"></span><p>正在连接管理端…</p></div>
    </main>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<dialog id="token-modal" class="modal" aria-labelledby="token-title">
  <form class="modal-form" id="token-form">
    <header class="modal-head">
      <div>
        <h2 id="token-title">连接管理端</h2>
        <p>这个页面需要管理端 token。</p>
      </div>
      <button class="icon-btn" type="button" data-close-token aria-label="关闭">
        <svg class="i" aria-hidden="true"><use href="#i-x"></use></svg>
      </button>
    </header>
    <div class="modal-body">
      <div class="form-grid">
        <label class="field span-2">
          <span class="field-label">管理端 token</span>
          <input id="token-input" class="input mono" type="password" autocomplete="off" spellcheck="false" placeholder="LIANT_ADMIN_TOKEN">
        </label>
      </div>
      <p class="field-hint">运行 <code>LianT admin</code> 可查看地址与 token；也可以在 <code>.env</code> 里设置 <code>LIANT_ADMIN_TOKEN</code> 固定它。</p>
    </div>
    <footer class="modal-foot">
      <button class="btn ghost" type="button" id="token-clear">清除 token</button>
      <button class="btn" type="button" data-close-token>取消</button>
      <button class="btn primary" type="submit">保存并连接</button>
    </footer>
  </form>
</dialog>

<dialog id="confirm" class="modal confirm" aria-labelledby="confirm-title">
  <form method="dialog" class="modal-form">
    <div class="modal-body">
      <div class="confirm-icon" id="confirm-icon"></div>
      <h2 id="confirm-title">确认操作</h2>
      <p id="confirm-msg"></p>
    </div>
    <footer class="modal-foot">
      <button class="btn" value="cancel">取消</button>
      <button class="btn danger" id="confirm-ok" value="confirm">确认</button>
    </footer>
  </form>
</dialog>

<dialog id="form-modal" class="modal" aria-labelledby="form-title"></dialog>

<noscript><p class="noscript">管理后台需要 JavaScript。请换一个支持 JavaScript 的浏览器，或检查是否禁用了脚本。</p></noscript>

<script src="__BASE_PATH__/admin.js"></script>
</body>
</html>
