plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def liantVersionCode = 102

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.bailensn.liant"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "com.bailensn.liant"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        // 显示版本固定 1.0.0；versionCode 从 82 起，每次发布 +1。
        // 同时同步 pubspec.yaml 的 +build（当前 102）。
        versionCode liantVersionCode
        versionName "1.0.0"
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // 有 key.properties 就用正式签名；没有时保留 debug 回退，便于本地测试。
            // v1.0.0 正式发布必须在 CI 注入 key.properties。
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug

            // 只打 arm64-v8a。
            // --target-platform 只管 Flutter 引擎/libapp.so，管不到依赖 AAR 自带的 .so：
            // ML Kit 条码（mobile_scanner）、CameraX、DataStore 每个都带四个 ABI，
            // 不裁的话 APK 会白胖约 6 MB（压缩后）。
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }
}

flutter {
    source = "../.."
}


