plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def liantVersionCode = 94

android {
    namespace = "com.bailensn.liant"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.bailensn.liant"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        // 显示版本固定 1.0.0；versionCode 从 82 起，每次发布 +1。
        // 同时同步 pubspec.yaml 的 +build（当前 94）。
        versionCode liantVersionCode
        versionName "1.0.0"
    }

    buildTypes {
        release {
            // v1 还没有正式分发的签名配置，CI 只出 debug APK；
            // 要出 release 包时在这里接入自己的 signingConfig。
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}


