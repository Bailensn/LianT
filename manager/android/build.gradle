allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// 构建产物统一放 manager/build/<module>：Flutter 工具链按这个路径找 APK。
// 用 layout.buildDirectory，旧的 buildDir 属性在 Gradle 8.2 起已废弃、9.0 会删掉。
rootProject.layout.buildDirectory.set(new File(rootDir, "../build"))
subprojects {
    layout.buildDirectory.set(
        new File(rootProject.layout.buildDirectory.get().asFile, project.name)
    )
}
subprojects {
    evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory.get().asFile
}
