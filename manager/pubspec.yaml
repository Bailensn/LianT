name: liant
description: LianT Manager（Bot Engine 客户端）
publish_to: none
version: 1.0.0+105

environment:
  # Flutter 3.47.9 / Dart 3.13.7（CI 与 templates 对齐）。
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 协议层的 SHA-256；签名/验签用的 P-256 在 lib/core/p256.dart 里自己实现，
  # 这样 Web 与 Android 两边的行为完全一致，也不会被插件版本拖累。
  crypto: ^3.0.6
  # 2.5 起要求 Flutter 3.41，钉在 2.3.x 以同时兼容 CI 的 3.24.5。
  hive: 2.2.3
  hive_flutter: 1.1.0
  shared_preferences: '>=2.3.0 <2.4.0'
  web_socket_channel: ^3.0.1
  # 只在 Web 上用来读地址栏参数（预览用），其它平台走条件导入的空实现。
  web: ^1.1.0
  file_picker: ^8.3.7
  http: ^1.6.0
  image_picker: 1.1.2
  image_picker_android: 0.8.12+21
  image_picker_platform_interface: 2.10.1
  mobile_scanner: 5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

# shared_preferences_foundation 2.6 起依赖 objective_c（带原生 build hook），
# Termux 上 hook 进程会被系统拒绝；2.5.4 两边 SDK 都能用，也不会拉进 hook。
dependency_overrides:
  shared_preferences_foundation: 2.5.4
