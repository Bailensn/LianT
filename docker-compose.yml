# 单容器跑起来就完事：内置自签证书监听 8443。
#
#   docker compose up -d
#
# 首次配对（终端会打印二维码和配对链接）：
#   docker compose run --rm liant pair --host 192.168.1.50
#
# 想要正式证书和域名，见 docker-compose.proxy.yml。
services:
  liant:
    # 用官方镜像；想从源码构建就把这行换成 build: .
    image: ghcr.io/bailensn/liant:latest
    container_name: liant
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      # 配置、密钥、数据库都在 /app 下；改用 bind mount 时注意目录权限
      - liant_data:/app
      # 也可以用：- ./data:/app
    environment:
      TZ: Asia/Shanghai
      # 后台容器没有终端，配对确认由「能执行 pair」替代
      LIANT_CONFIRM: auto
      # 容器里 pair 只生成配对码，由正在运行的服务兑付
      LIANT_PAIR_DELEGATE: "1"
      # 公网暴露时请设置，格式 user:password；留空则不启用
      LIANT_BASIC_AUTH: "${LIANT_BASIC_AUTH:-}"
    # 容器内不需要任何特权：无 capabilities、不可提权、根文件系统只读
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  liant_data:
