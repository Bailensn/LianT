    <script>
        function randomString(length) {
            var result = '';
            var characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            var charactersLength = characters.length;
            for (var i = 0; i < length; i++) {
                result += characters.charAt(Math.floor(Math.random() * charactersLength));
            }
            return result;
        }

        if (window.assetsRetryStatistics !== undefined) {
            console.log('assetsRetryStatistics already exists')
        } else {
            var primaryAssetUrlPrefix = 'https://small-files.make-w0rld-static.club/';
            var randomAssetUrlPrefix = `https://${randomString(8)}.small-files.make-w0rld-static.club/`;
            // 本站直链（scheme-relative）
            var siteAssetUrlPrefix = `//${window.location.host}/`;
            // CDN 上的资源路径可能带有发布目录前缀：
            // /file/ikuuu-static-release/ikuuu-web-front/<release>/...
            // 但站内资源一般直接挂在 / 下，因此回源到本站时需要移除该前缀。
            function rewriteIkuuuWebFrontFilePathnameToPublicPathname(pathname) {
                // 将 CDN 的发布路径改写为站内可访问的路径（用于“本站直链”回源）。
                //
                // 示例输入：
                //   /file/ikuuu-static-release/ikuuu-web-front/theme-1.0.12/theme-e5556/malio/assets/css/style.css
                // 示例输出：
                //   /theme-e5556/malio/assets/css/style.css
                var marker = '/file/ikuuu-static-release/ikuuu-web-front/';
                if (pathname.indexOf(marker) !== 0) {
                    return pathname;
                }

                // marker 之后的第一个 path segment 是发布版本目录（例如：theme-1.0.12）。
                // 这里通过移除该 segment，把路径映射回站内的 `/theme-e5556/...`。
                var rest = pathname.slice(marker.length);
                var slashIndex = rest.indexOf('/');
                if (slashIndex === -1) {
                    return pathname;
                }

                return '/' + rest.slice(slashIndex + 1);
            }

            function rewriteToSiteDirectUrl(urlString) {
                // 将 CDN 的 URL 改写为站内直链 URL（保留 querystring）。
                //
                // 示例输入：
                //   https://small-files.make-w0rld-static.club/file/ikuuu-static-release/ikuuu-web-front/theme-1.0.15/theme-e5556/malio/assets/css/style.css?v=123
                // 示例输出：
                //   //<本站域名>/theme-e5556/malio/assets/css/style.css?v=123
                try {
                    var url = new URL(urlString, window.location.origin);
                    url.pathname = rewriteIkuuuWebFrontFilePathnameToPublicPathname(url.pathname);
                    return `//${window.location.host}${url.pathname}${url.search}`;
                } catch (e) {
                    return urlString;
                }
            }

            var assetsRetryDebug = false;
            try {
                assetsRetryDebug = window.localStorage && window.localStorage.getItem('assetsRetryDebug') === '1';
            } catch (e) {
                assetsRetryDebug = false;
            }
            function debugLog() {
                if (!assetsRetryDebug || !window.console || !window.console.log) {
                    return;
                }
                window.console.log.apply(window.console, arguments);
            }

            window.assetsRetryStatistics = window.assetsRetry({
                // domain list, only resources in the domain list will be retried.
                // 首次访问时，此 fallback 起效
                // 后续访问时， workbox 起效
                // 默认 > 随机子域名 > 本站直链
                domain: [primaryAssetUrlPrefix, randomAssetUrlPrefix, siteAssetUrlPrefix],

                // maximum retry count for each asset, default is 3
                // 2 次重试：primary -> random -> site
                maxRetryCount: 2,

                // onRetry hook is how you can customize retry logic with, default is x => x
                onRetry: function (currentUrl, originalUrl, statistics) {
                    debugLog('assetsRetry onRetry', {currentUrl, originalUrl, statistics})
                    if (currentUrl.indexOf(siteAssetUrlPrefix) === 0) {
                        return rewriteToSiteDirectUrl(currentUrl);
                    }
                    return currentUrl;
                },

                // for a given resource (except background-images in css),
                // either onSuccess or onFail will be eventually called to
                // indicate whether the resource has been successfully loaded
                onSuccess: function (currentUrl) {
                    debugLog('assetsRetry onSuccess', currentUrl)
                },

                onFail: function (currentUrl) {
                    debugLog('assetsRetry onFail', currentUrl)
                }
            })
        }
